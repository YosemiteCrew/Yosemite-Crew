version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: 'UTC'
    target-branch: dev
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automerge-candidate
    # Use a conventional type(scope) the PR-title gate accepts. A bare 'chore'
    # with include:scope yields 'chore(deps): …', and 'deps' is not an allowed
    # scope, so those PRs would fail pr-governance. 'repo' is the catch-all scope.
    commit-message:
      prefix: 'chore(repo)'
    groups:
      typescript-eslint:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'eslint*'
          - '@typescript-eslint/*'
      testing:
        patterns:
          - 'jest*'
          - '@testing-library/*'
      build-tooling:
        patterns:
          - 'turbo'
          - 'pnpm'
          - 'prettier'
          - 'husky'
          - 'lint-staged'
      # Catch-all. Must stay LAST: a dependency joins the first group it
      # matches, so an earlier '*' would swallow the named groups above.
      # Minor and patch only, so major bumps still get an individual PR
      # and an individual review.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: 'UTC'
    target-branch: dev
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'ci(repo)'
    labels:
      - dependencies
      - github-actions
    groups:
      # Action majors are routinely breaking, so keep them out of the group
      # and let each land on its own.
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
