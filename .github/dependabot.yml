# NOTE: dependabot reads this file from the DEFAULT branch (main), not from dev -
# target-branch below only aims the PRs at dev. Any change here must land on
# main to take effect, so keep the copies on dev and main byte-identical
# (see PR #2079, which fixed a month of silently inert config changes).
#
# NOTE: because every block below sets target-branch, NOTHING in this file
# governs dependabot SECURITY updates. The options reference makes the carve-out
# explicit - the settings that would otherwise shape a security PR apply
# "except where target-branch is used" - and it voids the block as a unit, so
# ignore, cooldown, groups, labels and commit-message are all inapplicable.
# Security updates instead go to main with dependabot's defaults and remediate
# whatever the lock files report as vulnerable.
#
# This is measured here, not inferred: every npm security PR since target-branch
# landed (#1873, #2005, #2020, #2067) carries the default `javascript` label and
# a `chore(deps)`/`chore(deps-dev)`/`ci(deps)` headline, while version-update PRs
# from the same window carry this file's `dependencies` label and `chore(repo)`
# prefix. #1873 is decisive on its own: a fixed prefix cannot emit the
# `chore(deps-dev)` variant at all.
#
# So an ignore entry below is a statement about weekly version updates ONLY. It
# is not a freeze, and it must never be relied on as one - an advisory against a
# held package will still produce a PR, against main, with no cooldown. Where a
# hold has to survive that path it needs an enforcing check outside this file
# (#3345).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: 'UTC'
    target-branch: dev
    open-pull-requests-limit: 10
    # Wait this long after a release before proposing it. This is the only
    # defence in the repo against a compromised maintainer publishing a
    # malicious version: the attacks that matter are caught and yanked within
    # hours to days, so the whole value is in not being first to install.
    #
    # Dependabot already applies a 3 day cooldown when this block is absent, so
    # what is bought here is the extra margin, and majors get the longest wait
    # because they are the least reversible.
    #
    # Cooldown does NOT apply to security updates - GitHub exempts them - so an
    # advisory-driven bump still arrives immediately. Nothing here delays a
    # patch for a known vulnerability.
    #
    # Patches get the same 7 days as minors deliberately. The instinct is to let
    # patches through faster, but a hijacked package is typically published AS a
    # patch, so that is the release line the wait most needs to cover.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    # Only labels that exist in the repo. Dependabot cannot create labels, so an
    # unknown name makes it post a config error on every PR it opens instead of
    # applying the label.
    labels:
      - dependencies
    # Use a conventional type(scope) the PR-title gate accepts. A bare 'chore'
    # with include:scope yields 'chore(deps): …', and 'deps' is not an allowed
    # scope, so those PRs would fail pr-governance. 'repo' is the catch-all scope.
    commit-message:
      prefix: 'chore(repo)'
    ignore:
      # react-doctor is fully frozen for dependabot - not just minors/majors.
      # The React Doctor CI action flags any bump of the react-doctor package
      # itself with its low-supply-chain-score rule (even the 0.2.14 -> 0.2.16
      # PATCH failed the gate on #2082), so every batch that touches it goes
      # red on the tool's own judgement of itself. No update-types list means
      # ignore ALL updates; upgrades are deliberate, manual, and reviewed
      # together with the pinned CLI version in react-doctor.yml.
      - dependency-name: 'react-doctor'
      # The React Native native cluster only ever updates by patch through
      # dependabot. react-native is 0.x, so 0.81 -> 0.86 - five framework
      # releases with native template changes and a moved jest environment -
      # rode a "minor" batch (#2088) and broke type-check plus every mobile
      # test suite; reanimated and worklets are pinned since the Android build
      # fix (#2052); stripe-react-native and the nitro modules are 0.x native
      # code; react-test-renderer must exactly match the react version RN pins
      # (its 19.2.8 ride-along failed all 457 suites); react-native-screens is
      # pinned to 4.24.0 for two separate reasons. 4.26.0+ emit
      # React.ComponentRef<> in their src/fabric/ codegen specs and RN 0.81.6's
      # parser accepts only React.ElementRef<>, which was observed failing on
      # 4.27.0 and 4.26.2 - both iOS pod install and the Android codegen task,
      # each on a different command (showColumn, setToolbarMenuElementOptions).
      # 4.25.0's specs are clean and it does build, but it declares
      # react-native >=0.82.0, so it is unsupported here. 4.24.0 is the last
      # version that both builds and claims to support 0.81.6 (#2271, #2272).
      # RN upgrades are deliberate migrations with device builds, never weekly PRs.
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@react-native-community/cli*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-native-reanimated'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-native-worklets'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-native-nitro-*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@stripe/stripe-react-native'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-native-screens'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # react-test-renderer is fully frozen: @testing-library/react-native
      # requires it to EXACTLY equal the react version RN pins, so even the
      # 19.1.0 -> 19.1.9 PATCH failed every mobile suite (#2096). It moves
      # only with a deliberate RN upgrade.
      - dependency-name: 'react-test-renderer'
      # posthog-js is fully frozen at ^1.391.7: the React Doctor gate scores
      # the lowest version a range allows via Socket, and every 1.4x range so
      # far scores below the 50 minimum (1.413.x scored 31/100 on #2088 and
      # #2096). Re-bump deliberately once the Socket score recovers.
      #
      # An entry with no update-types ignores every update TYPE, but it is still
      # only a version-update rule: per the note at the top of this file, an
      # advisory against posthog-js does still open a remediation PR, against
      # main - and it is likely to land red on the React Doctor gate for the same
      # Socket score that froze the package, so it needs a deliberate decision
      # rather than a merge. The standing compensating control is the
      # supply-chain scan
      # (scripts/security/supply-chain.sh), which greps the SBOM of what is
      # actually installed and fails the merge gate on a critical finding
      # regardless of what dependabot is or is not proposing. If that scan
      # flags posthog-js, bump it by hand rather than waiting for a PR.
      - dependency-name: 'posthog-js'
      # google-auth-library 11 requires node >=22 at runtime; the backend image
      # runs node 18 - unfreeze together with the runtime upgrade (#2125).
      - dependency-name: 'google-auth-library'
        update-types: ['version-update:semver-major']
      # react-native-nitro-sound added engines node >=22.21.0 in 0.2.18; the repo
      # and CI run node 20, so an engine-strict install fails outright. Frozen at
      # 0.2.17 until the runtime upgrade (#2125).
      - dependency-name: 'react-native-nitro-sound'
      # playwright raised its node floor to >=20 in 1.62; the backend image runs
      # node 18 and the security override pins playwright-core at EXACTLY 1.61.1,
      # which every playwright release must match exactly. Fully frozen (even
      # patches) so the pair only moves atomically with the runtime upgrade
      # (#2125) - a patch bump here without the override recreates the mismatch.
      - dependency-name: 'playwright'
      # ioredis 6 raised its node floor to >=20; the backend image runs node 18.
      # 5.11.1 is the last 5.x release and carries AIKIDO-2026-538318 (medium)
      # with no 5.x fix available, so the advisory only clears by taking 6.x,
      # which the runtime upgrade (#2125) has to come first for. This is the
      # same version main already runs, so the freeze holds parity rather than
      # accepting anything new.
      - dependency-name: 'ioredis'
        update-types: ['version-update:semver-major']
      # typescript 7 is the native compiler rewrite and nothing in the toolchain
      # admits it yet: ts-jest 29.4.12 peers "typescript >=4.3 <7" (no published
      # release, stable or next, allows 7), and typescript-eslint peers
      # ">=4.8.4 <6.1.0" on BOTH latest and its canary channel. Because .npmrc
      # sets auto-install-peers without strict-peer-dependencies, an install
      # stays green while both contracts are violated, so the breakage only
      # appears at compile and test time (#2200). TS 7 also removed baseUrl and
      # made rootDir mandatory alongside outDir, which fails the shared package
      # builds before any app code compiles. Migration is tracked in #1992 and
      # has to move with ts-jest and typescript-eslint, not ahead of them.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @babel/core 8 cannot be installed while the app is on React Native
      # 0.81: @react-native/babel-preset asserts Babel "^7.0.0-0" at load time
      # and throws "Requires Babel ^7.0.0-0, but was loaded with 8.0.1" for
      # every mobile file (#2116). This is a hard assertion inside the preset,
      # not something a config can work around. Unfreeze with the React Native
      # upgrade that ships a Babel 8 compatible preset.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      # @babel/runtime 8 is blocked by the same Babel-8-too-early constraint,
      # but fails differently and later: 8.0.0 drops the "./regenerator"
      # export subpath, keeping only "./helpers/regenerator*". Two packages
      # still import the old path - posthog-react-native (4 files, including
      # in its current 4.63.2, so there is nothing to upgrade to) and
      # react-native-vector-icons (1 file) - so Metro cannot resolve it and
      # :app:createBundleReleaseJsAndAssets
      # dies. That task only runs for RELEASE builds, so assembleDebug and
      # every jest suite stay green while release is broken (#2109 shipped it
      # unnoticed on 2026-08-09). Unfreeze alongside @babel/core.
      - dependency-name: '@babel/runtime'
        update-types: ['version-update:semver-major']
      # @babel/preset-env 8 is blocked by the same Babel-8-too-early constraint
      # and is the one that actually slipped through. The two entries above name
      # @babel/core and @babel/runtime, so preset-env was free to move: it went
      # to ^8.0.2 in a bulk bump on 2026-07-15 and sat in apps/mobileAppYC until
      # #2379 pulled it back to ^7.29.6 on 2026-08-22. The constraint is "nothing
      # from Babel 8 while the app is on React Native 0.81", not "these two
      # packages", so guard the family rather than the package that broke first.
      # Unfreeze alongside @babel/core.
      #
      # Not listed here: @babel/plugin-transform-modules-systemjs. It is a
      # pnpm.overrides entry rather than a declared dependency, and dependabot
      # does not raise updates for overridden packages, so an ignore for it would
      # never match anything.
      - dependency-name: '@babel/preset-env'
        update-types: ['version-update:semver-major']
      # eslint 10 is blocked in two workspaces at once (#2180), so the repo
      # stays on 9 until both clear:
      #   frontend - eslint-config-next 15.x loads @rushstack/eslint-patch,
      #     which refuses to patch an ESLint it does not recognise and fails
      #     with "Failed to patch ESLint because the calling module was not
      #     recognized". eslint-config-next 16 drops the patch and declares
      #     eslint >=9, so this clears with the Next 16 upgrade.
      #   mobileAppYC - @react-native/eslint-config parses with
      #     @babel/eslint-parser, whose scope manager ESLint 10 rejects
      #     ("scopeManager.addGlobals is not a function"). Only
      #     @babel/eslint-parser 8 supports ESLint 10, and it requires
      #     @babel/core ^8, which React Native blocks per the entry above.
      # Backend and desktop were verified to lint clean on 10 already; the hold
      # is only so all four workspaces move together rather than splitting the
      # toolchain across two ESLint majors.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # react and react-dom are frozen for dependabot - every update type, not
      # just minors and majors (#3325). react-test-renderer is already frozen
      # above, with the React Native native cluster; do not repeat it here, a
      # duplicate dependency-name makes the whole file invalid and dependabot
      # then applies NONE of these holds.
      #
      # react-native 0.81.6 declares `peerDependencies.react: ^19.1.4`, so a
      # minor bump to 19.3.0 satisfies the range and nothing refuses it. The
      # renderer React Native ships enforces something narrower at runtime. In
      # Libraries/Renderer/implementations/ReactNativeRenderer-prod.js the check
      # is a literal string compare:
      #
      #   if ("19.1.4" !== React.version) throw Error('Incompatible React
      #     versions: the "react" and "react-native-renderer" packages must have
      #     the exact same version...')
      #
      # The iOS release app installed, launched and then terminated before its
      # first screen on exactly that throw, and no CI stage could see it: jest
      # never mounts through the native renderer, the peer range is not violated
      # so the install is clean, and the release workflow builds and uploads the
      # app without launching it.
      #
      # Because the comparison is against a baked-in literal, a PATCH breaks it
      # the same way a minor does - 19.1.5 is as fatal as 19.3.0. There is no
      # update-types subset that is safe, so the entries carry none.
      #
      # This is workspace-wide: there is one npm config for the whole pnpm
      # workspace and ignores match on dependency-name only, so it also holds
      # apps/frontend. react-dom is frozen alongside react for that reason - it
      # carries the same exact-version guard against react, so leaving it
      # updatable while react is held is the one configuration that guarantees
      # the pair drifts apart.
      #
      # These entries do NOT stop a react advisory arriving as a PR. Per the
      # note at the top of this file, target-branch voids the whole block for
      # security updates, so a react CVE still opens a bump - against main, with
      # no cooldown - and the entries here are silent on that path. This is the
      # hold whose bypass matters most, because the failure it guards against is
      # invisible to every gate: the version compare above is a runtime throw in
      # the release app, jest never mounts through the native renderer, and an
      # exact-pinned bump is a clean install. Tracked in #3345; until an
      # enforcing check lands, a react or react-dom bump from any source has to
      # be checked by hand against the renderer literal before it merges.
      #
      # The manual policy is unchanged: the mobile app cannot take a react bump
      # without a react-native bump anyway, and both lifts are deliberate -
      # raise react with the react-native bump for mobile, and raise react and
      # react-dom together in one PR for the frontend.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      # next is held on 15.x while the Next 16 adoption is decided (#3266).
      #
      # The two instrument failures that used to sit in front of that decision
      # are fixed on dev and are no longer reasons to hold:
      #   - check-bundle-budgets.mjs classified chunks by webpack filename
      #     shape, so under Turbopack all four patterns matched nothing and
      #     three of the four ceilings guarded zero chunks. It now classifies
      #     from build-manifest.json and the prerendered documents, which both
      #     bundlers emit, and throws instead of falling back to a default
      #     bucket when a source is missing.
      #   - export-build-report.mjs read .next/app-build-manifest.json, which
      #     Next 16 removed, with no existence check. It now falls back to the
      #     prerendered documents and fails loudly when neither source is
      #     present. Repointing it at build-manifest.json is still not an
      #     option - that file is pages-router only and makes the script write
      #     an empty report and exit 0.
      #
      # What is left is the decision itself, which is above a dependabot PR and
      # is not fixable by adjusting a budget number on one: whether to adopt
      # Turbopack as the production bundler, and whether to accept ~3% more
      # first-load JS to take Next 16 at all.
      #
      # Measured on a local 16.3.4 Turbopack build of dev at 89eedeaca with the
      # fixed gate: the classification works - 1/5/42/249 across
      # polyfills/shared/page/async rather than 0/0/0/297 - and the bump then
      # fails honestly on three chunks, not one. 1462.6 KiB lazy against the
      # 1190 KiB async ceiling, 453.8 KiB first-load against 290 KiB (it also
      # exceeded the previous 375 KiB page ceiling), and a 222.7 KiB entry chunk
      # against 178 KiB, where dev's largest entry chunk is 169.7 KiB. Those are
      # the numbers the decision has to be made against.
      # There is no security pressure to take the major: no published next
      # advisory has a vulnerable range containing 15.5.24, and 15.x still
      # receives patches through this config.
      #
      # Scoped to 16.x rather than all majors so a later major is still
      # proposed, and because eslint 10 (held above) only clears once this one
      # is taken - the hold needs to be visible, not permanent.
      #
      # Note for whoever takes it: next is pinned in TWO places, this repo's
      # root pnpm.overrides and apps/frontend/package.json. A bump that moves
      # only one fails the lockfile config check before CI reaches the gates.
      - dependency-name: 'next'
        versions: ['16.x']
    groups:
      # Every group is minor-and-patch only, including the named ones below. A
      # named group without `update-types` silently swallows MAJORS too, which is
      # how a TypeScript 5 -> 7 bump landed inside "typescript-eslint" and a
      # Jest 29 -> 30 bump inside "testing": each arrived as an unreviewable
      # group PR that broke the build, instead of the individual PR a breaking
      # major needs. Majors now always get their own PR and their own review.
      typescript-eslint:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'eslint*'
          - '@typescript-eslint/*'
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - 'jest*'
          - '@testing-library/*'
        update-types:
          - minor
          - patch
      build-tooling:
        patterns:
          - 'turbo'
          - 'pnpm'
          - 'prettier'
          - 'husky'
          - 'lint-staged'
        update-types:
          - minor
          - patch
      # Catch-all. Must stay LAST: a dependency joins the first group it
      # matches, so an earlier '*' would swallow the named groups above.
      # Minor and patch only, so major bumps still get an individual PR
      # and an individual review.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  # Ruby lives only in the mobile app's CocoaPods toolchain. It had no entry at
  # all, so bundler surfaced solely as SECURITY updates - and those always open
  # against the default branch, which is how #2131 landed straight on main.
  # A real entry keeps routine bundler bumps flowing through dev like everything
  # else; the guard workflow is what stops security PRs merging into main.
  - package-ecosystem: bundler
    directory: /apps/mobileAppYC
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
      timezone: 'UTC'
    target-branch: dev
    open-pull-requests-limit: 5
    # Same rationale as the npm entry above. Bundler supports cooldown; only
    # `default-days` is used because the CocoaPods toolchain gems are few and
    # do not need per-semver tuning.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(mobile)'
    labels:
      - dependencies
      - ruby
    groups:
      bundler:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: 'UTC'
    target-branch: dev
    open-pull-requests-limit: 10
    # No `cooldown` here, and that is not an oversight: GitHub does not support
    # cooldown for the github-actions ecosystem, and it is listed as "not
    # currently supported" in the options reference. Adding it would be an
    # unrecognised key rather than a longer wait. Actions are pinned by commit
    # SHA throughout .github/workflows, which is the mitigation that applies to
    # this ecosystem instead.
    commit-message:
      prefix: 'ci(repo)'
    labels:
      - dependencies
      - github_actions
    groups:
      # Action majors are routinely breaking, so keep them out of the group
      # and let each land on its own.
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
