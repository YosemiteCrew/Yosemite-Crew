name: Sonar

# Reusable Sonar stage: scan, then hold the result to this repository's numbers.
#
# The previous workflow reinstalled dependencies, regenerated the Prisma client
# and reran every suite with coverage purely so the scanner had something to
# read. The test stage already produces that coverage, so this stage downloads it
# and scans. There is no pnpm install, no prisma generate and no jest run here
# by design.
#
# The scan waits on SonarCloud's built-in "Sonar way" gate, which is the only
# gate this organisation's plan allows. That gate passes at 80% coverage and 3%
# duplication on new code and carries no issue condition, so the final step
# reads the published measures and enforces 95% coverage, zero duplication and
# zero open issues. See scripts/ci/sonar-thresholds.mjs for why that is a
# separate step rather than a gate configured on the server, and
# docs/ci/sonar-quality-bar.md for what the bar means on each analysis scope.
#
# The cost of scanning without an install is that rules needing type resolution
# from node_modules see less than they would (backend and desktop set
# sonar.typescript.tsconfigPath). The nightly full analysis in
# sonar-cloud-analysis.yml remains the type-aware backstop for exactly that gap.

on:
  workflow_call:
    inputs:
      apps-with-coverage:
        description: JSON array of {app_key, dir} produced by the test stage.
        required: true
        type: string
    # Declared one by one rather than taking `secrets: inherit` from the caller,
    # which would hand every organisation and repository secret to this
    # workflow. Naming them bounds this workflow's secrets context to the four
    # Sonar tokens it actually uses.
    secrets:
      SONAR_TOKEN_FRONTEND:
        required: false
      SONAR_TOKEN_API:
        required: false
      SONAR_TOKEN_MOBILE:
        required: false
      SONAR_TOKEN_DESKTOP:
        required: false

permissions:
  contents: read

jobs:
  scan:
    name: Sonar scan (${{ matrix.app_key }})
    # Forks never receive the Sonar secrets, so a scan there would fail on an
    # empty token rather than tell anyone anything useful.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.apps-with-coverage) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history on every event, not just pull_request. Sonar attributes
          # new code and blame from git history, and a depth-1 clone silently
          # degrades both on push and merge_group. Coverage arrives as an
          # artifact, so the only cost here is clone time.
          fetch-depth: 0
          persist-credentials: false

      - name: Download merged coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-${{ matrix.app_key }}
          path: ${{ matrix.dir }}/coverage

      - name: Verify coverage resolves against the source tree
        env:
          APP_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          LCOV="$APP_DIR/coverage/lcov.info"
          if [ ! -s "$LCOV" ]; then
            echo "$LCOV is missing or empty; the test stage did not produce coverage for this app."
            exit 1
          fi
          # Sonar treats unresolvable coverage paths as 0% and passes its gate
          # without complaint. Catch that here, before the scan.
          node scripts/ci/lcov-check.mjs --resolve "$APP_DIR" "$LCOV"

      - name: Cache Sonar scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ matrix.app_key }}-${{ github.run_id }}
          restore-keys: |
            sonar-${{ runner.os }}-${{ matrix.app_key }}-
            sonar-${{ runner.os }}-

      # The scan step below names each secret statically instead of indexing the
      # secrets context with secrets[matrix.sonar_token]. A dynamic index makes
      # the entire context reachable from that one expression, which CodeQL
      # reports as excessive secret exposure; naming them means only this leg's
      # token is ever bound. The selection falls through to an empty string for
      # an unrecognised app, so this step checks the app key up front and fails
      # loudly rather than letting the scan run against the wrong project. It
      # inspects the key, never a secret value, so nothing lands in the log.
      - name: Verify a Sonar token is mapped for this app
        run: |
          set -euo pipefail
          case "${{ matrix.app_key }}" in
            frontend | backend | mobile | desktop) ;;
            *)
              echo "No Sonar token is mapped for app '${{ matrix.app_key }}'."
              echo "Add it to the selection in _sonar.yaml and to the caller's secrets block."
              exit 1
              ;;
          esac

      - name: Sonar scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: ${{ matrix.dir }}
          # Wait for the gate so a red quality gate reds this job, and therefore
          # the PR run's aggregate required check. That PR-run verdict is the
          # only Sonar signal a merge queue gets: the caller skips this stage on
          # merge_group refs (the SonarCloud plan analyzes each project's main
          # branch only, so a queue's ephemeral ref can never publish).
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ (matrix.app_key == 'frontend' && secrets.SONAR_TOKEN_FRONTEND) || (matrix.app_key == 'backend' && secrets.SONAR_TOKEN_API) || (matrix.app_key == 'mobile' && secrets.SONAR_TOKEN_MOBILE) || (matrix.app_key == 'desktop' && secrets.SONAR_TOKEN_DESKTOP) || '' }}

      # The bar, enforced. "Sonar way" passes at 80% coverage and 3% duplication
      # on new code and has no issue condition at all, so the step above proves
      # much less than it looks like it proves. This one reads the measures the
      # analysis just published and holds every leg to 95% coverage, zero
      # duplication and zero open issues (docs/ci/sonar-quality-bar.md).
      # `always()` is deliberately absent: if the scan itself failed there are
      # no measures to read, and the job is already red.
      # Run FROM the scanned directory rather than passing it in. The scanner
      # leaves report-task.txt under the directory it scanned, so this way the
      # script reads a constant relative path and takes no path argument at all -
      # a path assembled from an argument and then read is a file-inclusion sink
      # whether or not anything hostile can reach the argument, and bounding it
      # does not change that.
      - name: Enforce the Sonar quality bar
        working-directory: ${{ matrix.dir }}
        env:
          SONAR_TOKEN: ${{ (matrix.app_key == 'frontend' && secrets.SONAR_TOKEN_FRONTEND) || (matrix.app_key == 'backend' && secrets.SONAR_TOKEN_API) || (matrix.app_key == 'mobile' && secrets.SONAR_TOKEN_MOBILE) || (matrix.app_key == 'desktop' && secrets.SONAR_TOKEN_DESKTOP) || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # This step holds SONAR_TOKEN, so on a pull_request it runs the BASE
          # copy of the script, never the PR's. The checkout above is the PR
          # head, and a same-repository pull request can edit any file in it -
          # including this script - which would hand an attacker-controlled
          # program the project token. Reading it out of the base commit means
          # the code that runs with the token is code that was already reviewed.
          # (Log masking would not help: exfiltration is a network call.)
          SCRIPT="$GITHUB_WORKSPACE/scripts/ci/sonar-thresholds.mjs"
          if [ -n "${BASE_SHA:-}" ]; then
            TRUSTED="${RUNNER_TEMP}/sonar-thresholds.mjs"
            if git cat-file -e "${BASE_SHA}:scripts/ci/sonar-thresholds.mjs" 2>/dev/null; then
              git show "${BASE_SHA}:scripts/ci/sonar-thresholds.mjs" > "$TRUSTED"
              SCRIPT="$TRUSTED"
            else
              echo "scripts/ci/sonar-thresholds.mjs is not in the base commit: the target branch" >&2
              echo "predates the Sonar quality bar. Update the branch from dev (rebase)." >&2
              exit 1
            fi
          fi
          if [ ! -f "$SCRIPT" ]; then
            echo "scripts/ci/sonar-thresholds.mjs is not in this checkout: the branch predates" >&2
            echo "the Sonar quality bar. Update the branch from dev (rebase) and push again." >&2
            exit 1
          fi
          node "$SCRIPT" \
            --coverage 95 \
            --duplication 0 \
            --issues 0
