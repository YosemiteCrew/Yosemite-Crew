name: Release Notes

# Generates GitHub Release notes from Conventional Commits (already enforced
# by commitlint + pr-governance.yml) instead of requiring hand-written notes.
# See RELEASING.md for the full release process this fits into.

on:
  push:
    tags:
      - '*-v*'

# Deny by default at workflow level, grant the minimum on the job that needs it,
# matching desktop-release.yml.
permissions: {}

jobs:
  generate-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create or edit the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the previous tag can be resolved.
          fetch-depth: 0
          # Nothing here pushes over git; the release is published with gh using
          # GITHUB_TOKEN from the environment. Leaving the token in .git/config
          # would expose it to every later step in the job for no benefit.
          persist-credentials: false

      # Tag names reach this workflow as untrusted input, so every value derived
      # from them is passed through env rather than interpolated into a script.
      - name: Determine component prefix and previous tag
        id: prev
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREFIX=$(printf '%s' "$TAG" | sed -E 's/-v[0-9].*$//')
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          # The nearest matching tag reachable from this one, not the highest by
          # version sort. Sorting picks the wrong predecessor whenever stable and
          # prerelease tags coexist, or a maintenance tag is cut out of order.
          PREV=$(git describe --tags --abbrev=0 --match "${PREFIX}-v*" "${TAG}^" 2>/dev/null || true)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

          # Whether the TAG carries a SemVer pre-release suffix. This decides
          # only who may hold the repo-wide Latest badge (see the publish step),
          # never GitHub's "Pre-release" label: every release is published as a
          # full release.
          case "$TAG" in
            *-beta*|*-alpha*|*-rc*) SUFFIXED=true ;;
            *) SUFFIXED=false ;;
          esac
          # The MCP server is an npm package, not an app: its releases never
          # take the Latest badge that the desktop updater and release pill read.
          if [ "$PREFIX" = "mcp" ]; then SUFFIXED=true; fi
          echo "suffixed=$SUFFIXED" >> "$GITHUB_OUTPUT"

          # A range between two component tags still contains every other
          # workspace's commits, so notes are filtered to the paths that
          # component actually ships. Unknown prefixes fall back to no filter
          # rather than silently publishing empty notes.
          case "$PREFIX" in
            backend)      PATHS="apps/backend packages" ;;
            pims|pms)     PATHS="apps/frontend packages" ;;
            mobile)       PATHS="apps/mobileAppYC" ;;
            desktop)      PATHS="apps/desktop" ;;
            mcp)          PATHS="packages/mcp-server" ;;
            *)            PATHS="" ;;
          esac
          echo "paths=$PATHS" >> "$GITHUB_OUTPUT"

      # A tag is only a release if it sits on the shipped line. Without this,
      # any accidental *-v* tag pushed on dev or a feature branch publishes a
      # public GitHub Release.
      - name: Require the tag to be reachable from main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Explicit refspec: the checkout is of a tag, so refs/remotes/origin/main
          # does not necessarily exist yet.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::$TAG does not point at a commit reachable from origin/main."
            echo "RELEASING.md requires cutting releases from main. Delete the tag, or"
            echo "merge the commit to main and re-tag."
            exit 1
          fi
          echo "$TAG is reachable from origin/main."

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          PREV: ${{ steps.prev.outputs.prev }}
          PATHS: ${{ steps.prev.outputs.paths }}
        run: |
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
          else
            # First release of a component: everything from the root commit.
            # A bare tag is not a range git-cliff accepts.
            ROOT=$(git rev-list --max-parents=0 "$TAG" | tail -n 1)
            RANGE="$ROOT..$TAG"
          fi

          set -- "$RANGE" --config cliff.toml --strip all -o notes.md
          for p in $PATHS; do
            set -- "$@" --include-path "$p/**"
          done

          npx --yes git-cliff@2.13.1 "$@"
          cat notes.md

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SUFFIXED: ${{ steps.prev.outputs.suffixed }}
        run: |
          # No release is ever labelled "Pre-release". --prerelease=false is
          # passed on the edit path too, because a release created by hand in
          # the GitHub UI arrives with "Set as a pre-release" pre-ticked for a
          # -beta tag.
          #
          # A suffixed tag must still never take Latest: the marketing release
          # pill and electron-updater's stable desktop channel both resolve
          # /releases/latest. An unsuffixed tag keeps GitHub's default (a new
          # release takes Latest, an edit leaves it where it is).
          set -- --notes-file notes.md --prerelease=false
          if [ "$SUFFIXED" = "true" ]; then
            set -- "$@" --latest=false
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "$@"
          else
            gh release create "$TAG" --title "$TAG" "$@"
          fi

          # Assert on what GitHub recorded, not on what was sent, so a label, a
          # draft or a Latest badge that did not take turns this run red instead
          # of shipping quietly. A draft fails too: the edit does not publish it,
          # and publishing it later without --latest=false hands a beta Latest.
          # Reads are retried, whether they fail or come back stale. Only a 404
          # means "no Latest"; any other error is a read that did not happen.
          for _ in 1 2 3; do
            STATE=$(gh release view "$TAG" --json isPrerelease,isDraft \
              --jq '"\(.isPrerelease) \(.isDraft)"' 2>/dev/null) || STATE=unread
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null) \
              || case "$LATEST" in *'"status":"404"'*) LATEST="" ;; *) LATEST=unread ;; esac
            if [ "$STATE" = "false false" ] && [ "$LATEST" != "unread" ] \
              && { [ "$SUFFIXED" != "true" ] || [ "$LATEST" != "$TAG" ]; }; then
              echo "$TAG is a published full release (Latest: ${LATEST:-none})."
              exit 0
            fi
            sleep 5
          done
          [ "$STATE" != "unread" ] || echo "::error::Could not read $TAG back from GitHub."
          case "$STATE" in "true "*) echo "::error::$TAG is still labelled Pre-release on GitHub." ;; esac
          case "$STATE" in *" true")
            echo "::error::$TAG is still a draft. Publish it with: gh release edit $TAG --draft=false --latest=false"
            echo "(drop --latest=false only for an unsuffixed tag that should become Latest)" ;;
          esac
          [ "$LATEST" != "unread" ] || echo "::error::Could not read the repository's Latest release from GitHub."
          if [ "$SUFFIXED" = "true" ] && [ "$LATEST" = "$TAG" ]; then
            echo "::error::$TAG carries a pre-release suffix but holds the repo-wide Latest badge."
            echo "Mark the intended release as Latest (Releases > Edit > Set as the latest release)."
          fi
          exit 1

  # A release published with GITHUB_TOKEN emits no `release` event, so
  # supply-chain.yml never sees this one. workflow_dispatch is an event
  # GITHUB_TOKEN can start, so dispatch it from this tag: it builds the SBOMs
  # from the released code and attaches them to the release.
  attach-sboms:
    needs: generate-notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # start supply-chain.yml
    steps:
      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run supply-chain.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f release_tag="$TAG"
