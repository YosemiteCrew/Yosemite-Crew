name: Frontend E2E

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_BASE_URL: https://devapi.yosemitecrew.com/
  NEXT_PUBLIC_DISABLE_AUTH_GUARD: 'false'

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `secrets` is not available in a job-level `if:` — gate on a preflight output instead.
  #
  # This job resolves YC_E2E_* into a runner, so it must never run on a
  # pull_request: that event runs PR-controlled code (this very workflow file
  # is editable on the PR branch), which is precisely the surface that could
  # exfiltrate the credentials. The `environment: e2e` gate on playwright-auth
  # does NOT cover preflight, so this event gate is the real protection. Trusted
  # events only (workflow_dispatch, or a future push to a protected branch).
  preflight:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-auth-creds: ${{ steps.check.outputs.has-auth-creds }}
    steps:
      - id: check
        env:
          YC_E2E_EMAIL: ${{ secrets.YC_E2E_EMAIL }}
          YC_E2E_PASSWORD: ${{ secrets.YC_E2E_PASSWORD }}
        run: |
          if [ -n "$YC_E2E_EMAIL" ] && [ -n "$YC_E2E_PASSWORD" ]; then
            echo "has-auth-creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-auth-creds=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the frontend once and share it with both Playwright jobs, instead of
  # doing an identical cold Next.js build inside each one.
  build:
    name: Build frontend (shared)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/frontend/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('apps/frontend/package.json', 'apps/frontend/next.config.*', 'pnpm-lock.yaml') }}
          restore-keys: |
            next-build-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-

      - name: Build packages
        run: pnpm run build --filter "@yosemite-crew/types" --filter "@yosemite-crew/fhirtypes"

      - name: Build frontend
        run: pnpm --filter frontend run build

      - name: Upload frontend build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-e2e-build
          path: |
            apps/frontend/.next
            !apps/frontend/.next/cache
            packages/types/dist
            packages/fhirtypes/dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  playwright-public:
    name: Playwright public smoke + a11y
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/frontend/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('apps/frontend/package.json', 'apps/frontend/next.config.*', 'pnpm-lock.yaml') }}
          restore-keys: |
            next-build-${{ runner.os }}-

      - name: Download frontend build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-e2e-build
          path: .

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter frontend exec playwright install --with-deps chromium firefox

      - name: Run public smoke and accessibility flows
        env:
          E2E_WEB_SERVER_COMMAND: pnpm exec next start -p 3001 -H 127.0.0.1
        run: pnpm --filter frontend exec playwright test e2e/smoke.spec.ts e2e/a11y.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-playwright-public-report
          path: apps/frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-playwright-public-test-results
          path: apps/frontend/test-results
          if-no-files-found: ignore

  playwright-auth:
    name: Playwright authenticated flow
    needs: [preflight, build]
    # preflight is skipped on pull_request (above), which alone skips this job -
    # but state the PR exclusion explicitly so the intent survives edits to
    # preflight. On a PR this job shows a neutral skip, not the red failure it
    # produced when it reached the e2e environment's dev/main-only branch gate.
    if: needs.preflight.outputs.has-auth-creds == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # This job runs PR-controlled code (the local setup action, dependency
    # lifecycle scripts, and Playwright specs) with the YC_E2E_* credentials in
    # scope. On a pull_request event a same-repo branch could otherwise modify
    # that code to exfiltrate the secrets. Gate it behind the protected `e2e`
    # environment (configure required reviewers in repo settings) so a
    # maintainer must approve before the credentials are released to the run.
    environment: e2e
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Playwright writes an AI error-context snapshot on failure that captures
      # the DOM verbatim - including the filled password field. That write is
      # gated ONLY by this var (playwright/lib/index.js _takePageSnapshot), not
      # by trace/screenshot/video, so set it here to stop the password reaching
      # error-context.md on the runner.
      PLAYWRIGHT_NO_COPY_PROMPT: '1'
      YC_E2E_EMAIL: ${{ secrets.YC_E2E_EMAIL }}
      YC_E2E_PASSWORD: ${{ secrets.YC_E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download frontend build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-e2e-build
          path: .

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter frontend exec playwright install --with-deps chromium firefox

      # Both authenticated specs run here and nowhere else. The public job runs
      # an explicit two-file list, so a spec that needs a session has no other
      # home: adding it to `e2e/` alone would mean it never executes.
      # public-booking-setup.spec.ts follows the same credential-artefact rules
      # as auth-flow.spec.ts (trace/screenshot/video off in-file, and the
      # PLAYWRIGHT_NO_COPY_PROMPT above), which is why it is safe in this job.
      - name: Run authenticated Playwright flow
        env:
          E2E_WEB_SERVER_COMMAND: pnpm exec next start -p 3001 -H 127.0.0.1
        run: pnpm --filter frontend exec playwright test e2e/auth-flow.spec.ts e2e/public-booking-setup.spec.ts

      # This job's artifacts are deliberately NOT uploaded.
      #
      # auth-flow.spec.ts types YC_E2E_PASSWORD into a real password field, and
      # Playwright records input values verbatim: every failure snapshot wrote
      # the secret in plaintext into error-context.md and into trace.zip, which
      # any account with repo read access could download. That silently defeated
      # the protected-environment gate above, whose whole purpose is to keep
      # these credentials away from untrusted code.
      #
      # Redacting was rejected: the secret lands inside a zipped trace and in
      # the HTML report's embedded copy of it, so a scrub step would have to
      # rewrite archives and would fail open the first time Playwright changed
      # its format - the failure mode being a leak nobody notices.
      #
      # The job log still carries the assertion, the stack and the step output,
      # which is what a CI failure is normally triaged from. Reproduce locally
      # with `pnpm --filter frontend exec playwright test e2e/auth-flow.spec.ts`
      # to get a trace, using your own credentials.
      #
      # Only restore uploads here if the spec stops handling a real secret (for
      # example a provider-mocked sign-in). The public smoke job keeps its
      # artifacts: it handles no credentials.
