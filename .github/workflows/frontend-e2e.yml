name: Frontend E2E

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_BASE_URL: https://devapi.yosemitecrew.com/
  NEXT_PUBLIC_DISABLE_AUTH_GUARD: 'false'

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the frontend once and share it with both Playwright jobs, instead of
  # doing an identical cold Next.js build inside each one.
  build:
    name: Build frontend (shared)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/frontend/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('apps/frontend/package.json', 'apps/frontend/next.config.*', 'pnpm-lock.yaml') }}
          restore-keys: |
            next-build-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-

      - name: Build packages
        run: pnpm run build --filter "@yosemite-crew/types" --filter "@yosemite-crew/fhirtypes"

      - name: Build frontend
        run: pnpm --filter frontend run build

      - name: Upload frontend build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-e2e-build
          path: |
            apps/frontend/.next
            !apps/frontend/.next/cache
            packages/types/dist
            packages/fhirtypes/dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  playwright-public:
    name: Playwright public smoke + a11y
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/frontend/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('apps/frontend/package.json', 'apps/frontend/next.config.*', 'pnpm-lock.yaml') }}
          restore-keys: |
            next-build-${{ runner.os }}-

      - name: Download frontend build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-e2e-build
          path: .

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter frontend exec playwright install --with-deps chromium firefox

      - name: Run public smoke and accessibility flows
        env:
          E2E_WEB_SERVER_COMMAND: pnpm exec next start -p 3001 -H 127.0.0.1
        run: pnpm --filter frontend exec playwright test e2e/smoke.spec.ts e2e/a11y.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-playwright-public-report
          path: apps/frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-playwright-public-test-results
          path: apps/frontend/test-results
          if-no-files-found: ignore

  playwright-auth:
    name: Playwright authenticated flow
    needs: build
    if: vars.E2E_CREDENTIALS_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    # This job runs PR-controlled code (the local setup action, dependency
    # lifecycle scripts, and Playwright specs) with the YC_E2E_* credentials in
    # scope. On a pull_request event a same-repo branch could otherwise modify
    # that code to exfiltrate the secrets. Gate it behind the protected `e2e`
    # environment (configure required reviewers in repo settings) so a
    # maintainer must approve before the credentials are released to the run.
    environment: e2e
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      YC_E2E_EMAIL: ${{ secrets.YC_E2E_EMAIL }}
      YC_E2E_PASSWORD: ${{ secrets.YC_E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download frontend build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-e2e-build
          path: .

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter frontend exec playwright install --with-deps chromium firefox

      - name: Run authenticated Playwright flow
        env:
          E2E_WEB_SERVER_COMMAND: pnpm exec next start -p 3001 -H 127.0.0.1
        run: pnpm --filter frontend exec playwright test e2e/auth-flow.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-playwright-auth-report
          path: apps/frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-playwright-auth-test-results
          path: apps/frontend/test-results
          if-no-files-found: ignore
