name: Frontend Quality

# Reusable frontend bundle-budget and Lighthouse stage.
#
# The type-check, lint, unit-test and security-header jobs that used to live here
# are gone: _core runs the frontend's lint and type-check, and _test runs its
# jest suite sharded with the same 80/70/78/80 coverage floor this workflow
# enforced on the jest command line (including securityHeaders.test.ts, which is
# an ordinary frontend spec picked up by the shards). What remains is the bundle
# and Lighthouse pass, and it consumes the build _core already produced rather
# than building the frontend a second time.

# workflow_call only. This stage consumes the dist-packages and next-build
# artifacts that _core produces in the same run and deliberately does not build
# them itself, so a standalone dispatch would have nothing to download and would
# fail at that step. To run it on demand, dispatch ci.yaml, which runs the whole
# pipeline including this stage.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  bundle-lighthouse:
    name: Frontend bundle budgets and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download shared package dist output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-packages

      - name: Unpack shared package dist output
        run: tar -xzf dist-packages.tar.gz

      # next start loads .next/server, which resolves the workspace packages
      # through node_modules, so both the frontend build and the package dist
      # have to be present. Neither is rebuilt here.
      - name: Download frontend build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: apps/frontend/.next

      - name: Check bundle budgets
        working-directory: apps/frontend
        run: pnpm run check:bundle-budgets

      - name: Export route build report
        working-directory: apps/frontend
        run: pnpm run report:build-routes

      - name: Upload route build report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build-route-report
          path: |
            apps/frontend/artifacts/build-route-report.json
            apps/frontend/artifacts/build-route-report.md
          if-no-files-found: warn

      - name: Start frontend server
        run: |
          nohup pnpm --filter frontend exec next start -H 127.0.0.1 -p 3001 > /tmp/frontend-lighthouse.log 2>&1 &
          echo $! > /tmp/frontend-lighthouse.pid

      - name: Wait for frontend server
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/pet-businesses > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/frontend-lighthouse.log
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: apps/frontend/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          # This input overrides `numberOfRuns` in lighthouserc.json, so it has to
          # be set here. Three runs means assertions are checked against a median
          # rather than a single sample, which matters on shared runners where an
          # individual performance score swings widely.
          runs: 3

      - name: Stop frontend server
        if: always()
        run: |
          if [ -f /tmp/frontend-lighthouse.pid ]; then
            kill "$(cat /tmp/frontend-lighthouse.pid)" || true
          fi
