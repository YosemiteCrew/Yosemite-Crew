name: Migration

# Reusable migration stage: prove that every Prisma migration applies cleanly to
# a real Postgres, that the schema is valid, and that schema.prisma and the
# migration history have not drifted apart.
#
# Why this stage exists: before it, migration SQL in this repository was never
# executed by CI even once. There was no Postgres service, no `prisma validate`,
# no `prisma migrate deploy` and no drift check in any workflow, in any husky
# hook, or in any Dockerfile - `.husky/pre-push` runs lint and type-check only,
# and there is no backend CD workflow. A schema change therefore merged green
# and first ran when an operator applied it by hand against a live database.
#
# The drift check is the part that earns its keep: a `migrate diff` taken today
# emits `DROP TABLE` for four live control-plane tables (see CONTROL_PLANE_TABLES
# below), and nothing in the repository would have caught that before an
# operator ran it.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  # The four shared control-plane tables live in `public` and are deliberately
  # NOT part of this datamodel. `packages/database/prisma/schema.prisma` models
  # tenant-scoped operational data (one schema per tenant, see
  # `packages/database/src/tenant.ts`), while Enterprise / Tenant /
  # EnterpriseMembership / TenantMembership are shared across tenants, created by
  # `20260607120000_tenant_control_plane`, and read through raw SQL rather than
  # the generated client - `prisma.enterprise` and `prisma.tenant` have no
  # callers anywhere in the repository.
  #
  # `migrate diff` cannot know that, so it reports them as droppable on every
  # run. They are allow-listed here so the drift check still fails on every
  # *other* difference. Do not "fix" this by declaring them in schema.prisma:
  # that would replicate the control plane into every tenant schema.
  #
  # Written as one alternation rather than a word-split list on purpose: a
  # `for t in $VAR` loop silently iterates once over the whole string in shells
  # that do not word-split unquoted expansions, which would disable the
  # allow-list without failing.
  CONTROL_PLANE_TABLE_PATTERN: '"(Enterprise|Tenant|EnterpriseMembership|TenantMembership)"'

jobs:
  migrate:
    name: Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # Not a secret: this database is a service container created for this
          # job and destroyed with it, reachable only on the runner's localhost.
          # Derived from the run id so no credential literal sits in the repo.
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: yosemite_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/yosemite_ci?schema=public
      DIRECT_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/yosemite_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/yosemite_shadow?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Needed to diff this branch against its base for the immutability
          # check below.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # Prisma stores a checksum of every migration it has applied. Editing a
      # migration that is already deployed therefore does not fail here - it
      # fails later, in `migrate deploy` against the environment that already
      # ran it, which is the worst possible place to find out. Applied
      # migrations are immutable: fix a mistake with a new migration.
      - name: Check applied migrations were not edited
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Only additions are allowed under prisma/migrations. Renames count as
          # a delete plus an add, so -M is disabled to catch a migration being
          # moved rather than added.
          changed=$(git diff --no-renames --name-status "$BASE_SHA...HEAD" \
            -- packages/database/prisma/migrations \
            | grep -Ev '^A' || true)

          if [ -n "$changed" ]; then
            echo "::error::An existing migration was modified or deleted."
            echo "Migrations that have been applied anywhere are immutable - Prisma"
            echo "checksums them, so an edit here surfaces as a failed deploy against"
            echo "an environment that already ran it. Add a new migration instead."
            echo "--- disallowed changes ---"
            echo "$changed"
            exit 1
          fi

          echo "No existing migration was modified."

      # `migrate diff --from-migrations` replays the whole history into a
      # throwaway database, so it needs one that is not the target.
      - name: Create shadow database
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE yosemite_shadow;'

      - name: Validate schema
        run: pnpm --filter @yosemite-crew/database exec prisma validate

      # The gate that did not exist: prove the migration history applies, in
      # order, to an empty database.
      - name: Apply migrations
        run: pnpm --filter @yosemite-crew/database run prisma:deploy

      # `code_entry_search_text` (20260824160000_clinical_term_search_index) is
      # the prefilter behind clinical-term autocomplete, and it has two
      # properties that are easy to lose and silent when lost. Both were real
      # defects during review, and both make a term vanish from search rather
      # than raise anything:
      #
      #   1. It must NOT be strict. `synonyms` is nullable, so a
      #      `RETURNS NULL ON NULL INPUT` declaration returns NULL for such a
      #      row, and the caller's `NULL LIKE ...` drops it before its display is
      #      ever scored. Fixed in 970532c48.
      #   2. It must read the synonym ARRAY ELEMENTS, not `synonyms::text`.
      #      Casting the jsonb yields its JSON encoding, so a synonym containing
      #      a quote appears escaped and a query spanning that character misses a
      #      row that genuinely contains it. Fixed in 066c48846.
      #
      # An applied migration is immutable, so the risk is not that this file
      # changes: it is a LATER migration doing CREATE OR REPLACE and restoring
      # either fault. That is a behavioural regression, so it needs a
      # behavioural check, which is why this asserts against the migrated
      # database rather than grepping the SQL.
      #
      # Rows are scoped by an explicit code so the assertion cannot be satisfied
      # or broken by anything a future migration seeds, and the trap removes them
      # whether the assertions pass or fail, so the checks below see the database
      # they expect.
      - name: Check clinical term search survives null and quoted synonyms
        shell: bash
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail

          psql_ci() { psql -h localhost -U postgres -d yosemite_ci "$@"; }

          cleanup() {
            psql_ci -q -c "DELETE FROM \"CodeEntry\"
              WHERE \"code\" IN ('CI_GUARD_NULL_SYNONYMS', 'CI_GUARD_QUOTED_SYNONYM');" || true
          }
          trap cleanup EXIT

          psql_ci -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "CodeEntry" ("id", "system", "code", "display", "type", "active", "synonyms", "updatedAt")
          VALUES
            ('00000000-0000-4000-8000-0000000ce001', 'YOSEMITECODE', 'CI_GUARD_NULL_SYNONYMS',
             'Vomiting', 'CLINICAL_TERM', true, NULL, now()),
            ('00000000-0000-4000-8000-0000000ce002', 'YOSEMITECODE', 'CI_GUARD_QUOTED_SYNONYM',
             'Regurgitation', 'CLINICAL_TERM', true, '["a\"b"]'::jsonb, now());
          SQL

          # Mirrors the filter the service builds at
          # apps/backend/src/services/clinical-terms.service.ts, ESCAPE included,
          # so this fails for the same reason the product would.
          matches() {
            psql_ci -tAc "
              SELECT count(*) FROM \"CodeEntry\" e
              WHERE e.\"system\" = 'YOSEMITECODE'::\"CodeSystem\"
                AND e.\"type\" = 'CLINICAL_TERM'::\"CodeType\"
                AND e.\"active\"
                AND e.\"code\" = '$1'
                AND code_entry_search_text(e.\"display\", e.\"synonyms\") LIKE '$2' ESCAPE '\\';"
          }

          null_synonyms=$(matches 'CI_GUARD_NULL_SYNONYMS' '%vomit%')
          quoted_synonym=$(matches 'CI_GUARD_QUOTED_SYNONYM' '%a"b%')

          failed=0

          if [ "$null_synonyms" != "1" ]; then
            echo "::error::A clinical term with no synonyms is not findable by its display."
            echo "code_entry_search_text returned NULL for a row whose \"synonyms\" is SQL NULL,"
            echo "so the prefilter's NULL LIKE ... dropped it. The function must not be declared"
            echo "RETURNS NULL ON NULL INPUT, and \"display\" must be coalesced."
            echo "Expected 1 match for '%vomit%' on display 'Vomiting', got: $null_synonyms"
            failed=1
          fi

          if [ "$quoted_synonym" != "1" ]; then
            echo "::error::A clinical term whose synonym contains a quote is not findable by it."
            echo "code_entry_search_text must build its text from jsonb_array_elements_text, not"
            echo "from \"synonyms\"::text - the cast yields the JSON encoding, so a quote appears"
            echo "escaped and a query spanning it misses a row that genuinely contains it."
            echo "Expected 1 match for '%a\"b%' on synonym 'a\"b', got: $quoted_synonym"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "Clinical term search survives a null synonym list and a quoted synonym."

      # Invoice.providerPaymentIntentId is the whole idempotency guarantee of the
      # Stripe appointment-booking webhook. handleWebhookEvent never reads
      # event.id - there is no processed-event table, no cache and no lock - so a
      # redelivered event re-runs the entire dispatch, and this unique index is
      # the only thing that stops two concurrent deliveries minting two invoices
      # for one payment.
      #
      # It is asserted here because the jest suite CANNOT assert it: that suite
      # mocks Prisma, so it exercises the handler's decision logic and never the
      # constraint the decisions rely on. Verified against a real Postgres that
      # dropping this index lets both racers insert, producing exactly the
      # duplicate-invoice bug the design exists to prevent.
      #
      # The nullable half matters just as much: every invoice not raised by that
      # webhook has a NULL here, and Postgres keeps NULLs distinct in a unique
      # index, so they must all continue to coexist.
      - name: Check the booking payment intent stays unique
        shell: bash
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail

          psql_ci() { psql -h localhost -U postgres -d yosemite_ci "$@"; }

          cleanup() {
            psql_ci -q -c "DELETE FROM \"Invoice\" WHERE \"currency\" = 'ci-guard';" || true
          }
          trap cleanup EXIT

          row() {
            echo "('$1', '[]'::jsonb, 0, 0, 'ci-guard', $2, now())"
          }

          insert_rows() {
            psql_ci -v ON_ERROR_STOP=1 -q -c "
              INSERT INTO \"Invoice\" (\"id\", \"items\", \"subtotal\", \"totalAmount\", \"currency\", \"providerPaymentIntentId\", \"updatedAt\")
              VALUES $1;"
          }

          # The index has to be there AND be unique. Asserted from the catalog as
          # well as behaviourally, because the two fail differently: a dropped
          # index shows up here, while an index that exists but stopped being
          # unique only shows up in the insert below.
          unique_index=$(psql_ci -tAc "
            SELECT count(*)
            FROM pg_index i
            JOIN pg_class c ON c.oid = i.indexrelid
            WHERE c.relname = 'Invoice_providerPaymentIntentId_key'
              AND i.indisunique;")

          if [ "$unique_index" != "1" ]; then
            echo "::error::Invoice_providerPaymentIntentId_key is missing or is no longer unique."
            echo "That index is the only thing preventing a redelivered booking webhook"
            echo "from minting a second invoice for one payment, because nothing"
            echo "upstream deduplicates by Stripe event id."
            exit 1
          fi

          # One good row, then the collision. Split in two on purpose: a single
          # two-row statement fails for any reason at all - a check constraint, a
          # trigger, a typo in this SQL - and "the insert failed" would then read
          # as "uniqueness is intact" while measuring nothing.
          insert_rows "$(row 00000000-0000-4000-8000-0000000pi001 "'pi_ci_guard'")"

          if err=$(insert_rows "$(row 00000000-0000-4000-8000-0000000pi002 "'pi_ci_guard'")" 2>&1); then
            echo "::error::Two invoices were accepted for the same Stripe payment intent."
            exit 1
          fi

          # And it has to be THAT constraint. Postgres names the violated index in
          # the message, so an unrelated rejection cannot be mistaken for this one.
          if ! grep -q 'duplicate key value violates unique constraint' <<<"$err" \
             || ! grep -q 'Invoice_providerPaymentIntentId_key' <<<"$err"; then
            echo "::error::The duplicate intent was rejected, but not by the uniqueness guarantee."
            echo "Something else refused the row, so this check proves nothing about"
            echo "whether a redelivered booking webhook can mint a second invoice."
            echo "--- what Postgres actually said ---"
            echo "$err"
            exit 1
          fi

          # The nullable half: unrelated invoices must still coexist freely.
          insert_rows "$(row 00000000-0000-4000-8000-0000000pi003 NULL), $(row 00000000-0000-4000-8000-0000000pi004 NULL)"

          nulls=$(psql_ci -tAc "SELECT count(*) FROM \"Invoice\" WHERE \"currency\" = 'ci-guard' AND \"providerPaymentIntentId\" IS NULL;")
          if [ "$nulls" != "2" ]; then
            echo "::error::Invoices with no payment intent stopped coexisting."
            echo "NULLs must stay distinct in this unique index, or every invoice not"
            echo "raised by the booking webhook collides with every other one."
            echo "Expected 2 rows, got: $nulls"
            exit 1
          fi

          echo "The booking payment intent is unique, and NULLs still coexist."

      # The Supabase advisor caught public."OrganizationDocumentAcknowledgements"
      # shipping with RLS off. The cause was structural: RLS was only ever enabled
      # by hand in the dashboard, so every new table was unprotected until someone
      # remembered. This asserts it against the freshly migrated database, so a
      # table added without RLS fails here rather than in a security advisor.
      - name: Check row level security is enabled on every public table
        shell: bash
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # DATABASE_URL carries Prisma's ?schema= parameter, which psql rejects,
          # so connect with explicit flags like the shadow-database step above.
          missing=$(psql -h localhost -U postgres -d yosemite_ci -tAc "
            SELECT c.relname
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind = 'r'
              AND c.relname <> '_prisma_migrations'
              AND NOT c.relrowsecurity
            ORDER BY c.relname;")

          if [ -n "$missing" ]; then
            echo "::error::Tables in the public schema have row level security disabled."
            echo "Supabase exposes public tables over PostgREST to the anon and"
            echo "authenticated keys; without RLS those keys can read them directly."
            echo "Add the table to the RLS migration rather than enabling it in the dashboard."
            echo "--- tables without RLS ---"
            echo "$missing"
            exit 1
          fi

          echo "Row level security is enabled on every public table."

      - name: Check schema and migrations have not drifted
        shell: bash
        run: |
          set -euo pipefail

          pnpm --filter @yosemite-crew/database exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > drift.sql

          # Drop the allow-listed control-plane statements, then SQL comments and
          # blank lines. Anything still standing is real drift: either
          # schema.prisma changed without a migration, or a migration changed
          # without the schema.
          #
          # Both greps are guarded with `|| true`: grep exits 1 when it prints
          # nothing, and "prints nothing" is the healthy outcome here, so without
          # the guard `set -e` would fail the step precisely when there is no
          # drift.
          grep -Ev "$CONTROL_PLANE_TABLE_PATTERN" drift.sql > drift.filtered || true
          remaining=$(grep -Ev '^[[:space:]]*(--|$)' drift.filtered || true)

          if [ -n "$remaining" ]; then
            echo "::error::schema.prisma and prisma/migrations have drifted apart."
            echo "Generate a migration for the schema change, or reconcile the schema with the migration."
            echo "--- unaccounted-for drift ---"
            echo "$remaining"
            exit 1
          fi

          echo "No drift: schema.prisma matches the migration history."
