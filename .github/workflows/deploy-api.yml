name: Deploy API

# The two API hosts are hand-provisioned and NOTHING deployed them: no workflow
# in this repo touched api.yosemitecrew.com or devapi.yosemitecrew.com, so a
# green main said nothing about what was running. On 2026-08-23 the dev box was
# found 254 commits and six migrations behind while main had been green for days,
# and every production fix that week needed a hand-deploy from someone's laptop.
#
# Deliberately manual (workflow_dispatch, not push). These hosts run migrations
# against the live database and there is no blue/green, so a deploy is a decision
# someone makes, not a side effect of merging. What this removes is the drift and
# the laptop, not the judgement.
on:
  # The deploy itself stays manual (see below). The unit tests for its git-sync
  # step do not: they are the only thing standing between a refspec edit and a
  # deploy that stops on a ref-lock error, which is how this script first failed.
  pull_request:
    paths:
      - 'scripts/deploy/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Which API host to deploy.
        required: true
        type: choice
        options: [dev, production]
      ref:
        description: Git ref to deploy. Defaults to the branch this is run from.
        required: false
        type: string

permissions:
  contents: read

# One deploy per host at a time. Two concurrent runs would race the same repo
# checkout and pm2 process; never cancel a running one, because a deploy killed
# between `git checkout` and `pm2 restart` leaves the box on new source with an
# old bundle.
concurrency:
  # Keyed by event as well as host: a PR running the unit tests must not queue
  # behind a deploy, and two PRs must not serialise against each other.
  group: deploy-api-${{ github.event_name }}-${{ inputs.environment || github.ref }}
  cancel-in-progress: false

jobs:
  git-sync-tests:
    name: git-sync unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run deploy git-sync tests
        run: ./scripts/deploy/tests/git-sync.test.sh

  deploy:
    # Only ever on an explicit dispatch. The pull_request trigger above exists for
    # the unit-test job; without this guard it would also start a real deploy, with
    # an empty `environment` input, on every PR that touches scripts/deploy.
    if: github.event_name == 'workflow_dispatch'
    # The tests gate the deploy rather than running beside it. Without this the two
    # jobs start together on a dispatch, and a broken ref-sync change could reach a
    # live host while its own suite was still going red in parallel.
    needs: git-sync-tests
    name: Deploy API (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      # Fail on a missing credential BEFORE checkout, and say exactly what is
      # missing and where to put it.
      #
      # The generic check further down already refused to deploy without a key,
      # but it only said "not set for the 'dev' environment", which reads as a
      # bug in the workflow rather than a one-line fix in repository settings. On
      # 2026-08-24 a dispatch failed on exactly that; the secret was added 98
      # seconds later and the run was never retried, so the deploy simply did not
      # happen and nothing said so.
      #
      # Production is the case worth naming out loud: `environment:` creates the
      # environment implicitly on first use, so dispatching production does NOT
      # fail with "no such environment". It succeeds into an EMPTY one and the
      # key resolves to nothing, which looks identical to a revoked key.
      - name: Preflight the deploy credential
        shell: bash
        env:
          SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_KEY:-}" ]; then
            {
              echo "::error::No API_DEPLOY_SSH_KEY in the '${ENVIRONMENT}' environment, so there is nothing to authenticate with and no deploy has happened."
              echo
              echo "Fix it in repository settings, not here:"
              echo "  Settings > Environments > ${ENVIRONMENT} > Environment secrets > New secret"
              echo "  Name:  API_DEPLOY_SSH_KEY"
              echo "  Value: the PRIVATE half of the key pair whose public half is in"
              echo "         ubuntu@<host>:~/.ssh/authorized_keys on that box."
              echo
              echo "If '${ENVIRONMENT}' is not listed under Environments, create it first."
              echo "A job that names an environment creates it implicitly and empty, so"
              echo "dispatching an environment that was never set up fails here rather"
              echo "than anywhere more obvious."
            } >&2
            exit 1
          fi

          # A truncated or single-line paste authenticates against nothing and
          # fails later as a confusing "Permission denied (publickey)". Check the
          # shape, never the contents: nothing here echoes the key.
          if ! printf '%s' "${SSH_KEY}" | head -n 1 | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            {
              echo "::error::API_DEPLOY_SSH_KEY for '${ENVIRONMENT}' does not begin with a private-key header."
              echo "It is most likely the PUBLIC half of the pair. The value must be the private key."
              echo "Re-add it from the file so the format survives: gh secret set API_DEPLOY_SSH_KEY --env ${ENVIRONMENT} < path/to/key"
            } >&2
            exit 1
          fi

          # The header alone is not enough. A key pasted through a form that
          # collapses newlines keeps its BEGIN marker on the single remaining
          # line and passes the check above, then fails at ssh time as a
          # permission error that looks like a revoked key rather than a
          # malformed one. A real key is at least three lines.
          KEY_LINES="$(printf '%s\n' "${SSH_KEY}" | grep -c '')"
          if [ "${KEY_LINES}" -lt 3 ]; then
            {
              echo "::error::API_DEPLOY_SSH_KEY for '${ENVIRONMENT}' is ${KEY_LINES} line(s). A private key has at least three."
              echo "The newlines were almost certainly lost when it was pasted."
              echo "Re-add it from the file: gh secret set API_DEPLOY_SSH_KEY --env ${ENVIRONMENT} < path/to/key"
            } >&2
            exit 1
          fi

          echo "A private key is present for '${ENVIRONMENT}'."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve target
        id: target
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = "production" ]; then
            echo "host=63.181.54.147"                       >> "$GITHUB_OUTPUT"
            echo "repo=/home/ubuntu/Yosemite-Crew"          >> "$GITHUB_OUTPUT"
            echo "pm2=yosemite-backend"                     >> "$GITHUB_OUTPUT"
            echo "default_ref=main"                         >> "$GITHUB_OUTPUT"
          else
            echo "host=63.179.216.42"                       >> "$GITHUB_OUTPUT"
            echo "repo=/home/ubuntu/fix/Yosemite-Crew"      >> "$GITHUB_OUTPUT"
            echo "pm2=1"                                    >> "$GITHUB_OUTPUT"
            echo "default_ref=dev"                          >> "$GITHUB_OUTPUT"
          fi
          echo "ref=${INPUT_REF:-}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          HOST: ${{ steps.target.outputs.host }}
          REPO: ${{ steps.target.outputs.repo }}
          PM2_TARGET: ${{ steps.target.outputs.pm2 }}
          REF: ${{ steps.target.outputs.ref }}
          DEFAULT_REF: ${{ steps.target.outputs.default_ref }}
          # Passed as an env var rather than interpolated into the script below.
          # A ${{ }} expression inside `run:` is substituted before the shell
          # sees it, so context values become part of the command text - the
          # template-injection shape, regardless of how constrained the input
          # looks today.
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Preflight above already proved this; kept so the step cannot run with
          # an empty key if the steps are ever reordered.
          if [ -z "${SSH_KEY:-}" ]; then
            echo "API_DEPLOY_SSH_KEY is empty at deploy time. See the preflight step." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          TARGET_REF="${REF:-$DEFAULT_REF}"
          echo "Deploying $TARGET_REF to $HOST ($REPO)"

          # Ship the whole deploy directory from THIS checkout rather than
          # trusting whatever version happens to be on the box. The directory,
          # not just the entry script: api-deploy.sh sources lib/git-sync.sh
          # relative to its own location, so copying the one file would leave it
          # looking for a helper that is not there and exit before preflight.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "ubuntu@$HOST" \
            "rm -rf /tmp/yc-deploy && mkdir -p /tmp/yc-deploy"

          scp -r -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            scripts/deploy/. "ubuntu@$HOST:/tmp/yc-deploy/"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "ubuntu@$HOST" \
            "chmod +x /tmp/yc-deploy/api-deploy.sh && /tmp/yc-deploy/api-deploy.sh '$REPO' '$PM2_TARGET' '$TARGET_REF'"

      - name: Verify from outside
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = "production" ]; then
            BASE="https://api.yosemitecrew.com"
          else
            BASE="https://devapi.yosemitecrew.com"
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/health")"
          echo "$BASE/health -> $code"
          [ "$code" = "200" ] || { echo "health check failed after deploy" >&2; exit 1; }

          # Status alone proves little: Express answers 404 for a route that was
          # never mounted AND for one that ran and found nothing. The body is
          # what distinguishes them - JSON means a real handler ran.
          body="$(curl -s --max-time 20 "$BASE/v1/pet-passport/mobile/companion/probe" | head -c 80)"
          echo "auth-gated route -> $body"
          case "$body" in
            \{*) echo "route mounted ✅" ;;
            *) echo "expected a JSON body from a mounted route, got HTML" >&2; exit 1 ;;
          esac
      - name: Always clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
