name: sonar-cloud-analysis

# Schedule-only. The per-pull-request and per-push analysis moved into the
# single pipeline as the scan-only _sonar stage, which reads the coverage the
# test stage already produced instead of reinstalling and rerunning every suite.
# What stays here is the nightly full run: it does install, generate Prisma and
# run the suites with coverage, so it remains the drift baseline and the
# type-aware backstop for the rules the scan-only path cannot see without
# node_modules. workflow_dispatch is kept so it can still be run on demand.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect workspace changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: github.repository_owner == 'YosemiteCrew' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'packages/types/**'
              - 'packages/fhir/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
            backend:
              - 'apps/backend/**'
              - 'packages/types/**'
              - 'packages/fhir/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
            mobile:
              - 'apps/mobileAppYC/**'
              - 'packages/types/**'
              - 'packages/fhir/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
            desktop:
              - 'apps/desktop/**'
              - 'packages/types/**'
              - 'packages/fhir/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          apps=()
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            apps+=(frontend backend mobile)
            [[ -d apps/desktop ]] && apps+=(desktop)
          else
            [[ "${{ steps.filter.outputs.frontend }}" == "true" ]] && apps+=(frontend)
            [[ "${{ steps.filter.outputs.backend }}" == "true" ]] && apps+=(backend)
            [[ "${{ steps.filter.outputs.mobile }}" == "true" ]] && apps+=(mobile)
            [[ "${{ steps.filter.outputs.desktop }}" == "true" ]] && apps+=(desktop)
          fi

          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json='{"include":['
          first=1
          for app in "${apps[@]}"; do
            case "$app" in
              frontend)
                dir="apps/frontend"
                ;;
              backend)
                dir="apps/backend"
                ;;
              mobile)
                dir="apps/mobileAppYC"
                ;;
              desktop)
                dir="apps/desktop"
                ;;
              *)
                echo "Unknown app: $app" >&2
                exit 1
                ;;
            esac

            if [[ $first -eq 0 ]]; then
              json+=','
            else
              first=0
            fi
            json+="{\"app\":\"$app\",\"dir\":\"$dir\"}"
          done
          json+=']}'

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  sonarqube:
    if: >
      github.repository_owner == 'YosemiteCrew' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        github.event_name == 'schedule' ||
        needs.changes.outputs.has_changes == 'true'
      )
    name: SonarQube Analysis - ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    permissions:
      contents: read
      checks: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      # Per-app Jest transform cache. Keyed without github.sha so it actually
      # restores across commits (the previous backend-only key never hit on the
      # frontend leg, so every frontend Sonar run recompiled from cold).
      - name: Per-app Jest transform cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.dir }}/.jest-cache
          key: jest-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            jest-${{ matrix.app }}-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STORE_PATH }}
            ~/.sonar/cache
          key: cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (backend)
        if: matrix.app == 'backend'
        working-directory: ${{ matrix.dir }}
        run: pnpm prisma:generate

      - name: Run tests with coverage
        working-directory: ${{ matrix.dir }}
        run: pnpm run test --coverage --ci --maxWorkers=4 --cacheDirectory=.jest-cache

      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: ${{ matrix.dir }}
        env:
          # Named statically rather than indexed with secrets[matrix.sonar_token]:
          # a dynamic index exposes the whole secrets context to the expression,
          # which CodeQL reports as excessive secret exposure.
          SONAR_TOKEN: ${{ (matrix.app == 'frontend' && secrets.SONAR_TOKEN_FRONTEND) || (matrix.app == 'backend' && secrets.SONAR_TOKEN_API) || (matrix.app == 'mobile' && secrets.SONAR_TOKEN_MOBILE) || (matrix.app == 'desktop' && secrets.SONAR_TOKEN_DESKTOP) || '' }}
