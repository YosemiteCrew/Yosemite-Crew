name: Desktop Release

# Builds and code-signs the desktop app. Two ways to run:
#   • Push a tag `v*` on main → builds, signs, and PUBLISHES a GitHub Release.
#       1) bump "version" in apps/desktop/package.json
#       2) merge to main, then: git tag v<version> && git push origin v<version>
#     The tag MUST be `v` + the exact apps/desktop/package.json version, and must
#     be reachable from main. The `verify` job below fails the run otherwise: on a
#     version mismatch because electron-builder names its release from the package
#     version rather than from the pushed tag (so the assets would silently land on
#     a different release), and off-main because a release would otherwise be cut
#     for an unshipped commit. For throwaway test builds use workflow_dispatch.
#     The release stays a DRAFT until both installers are attached; see `verify`.
#     The `v` prefix is not cosmetic. electron-updater's GitHub provider reads
#     the tag out of the release URL and drops any tag that is not valid semver
#     (GitHubProvider `semver.valid(hrefTag)`), so a `desktop-v*` tag makes every
#     desktop release invisible to the updater. Other products in this monorepo
#     keep their prefixes precisely so the updater skips them.
#   • Run manually (Actions → "Desktop Release" → Run workflow / workflow_dispatch)
#       → builds + signs, uploads workflow ARTIFACTS, then creates a draft
#         GitHub Release with the same assets. Use this to share download links
#         without requiring the Actions artifact UI.
#
# Windows is signed via Azure Artifact Signing (formerly Trusted Signing).
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   (the `yc-signing-ci` app registration, holding the
#    "Trusted Signing Certificate Profile Signer" role on the yc-signing account)
#
# macOS is signed with a Developer ID Application cert and notarized via notarytool.
#   CSC_LINK (base64 of the Developer ID .p12), CSC_KEY_PASSWORD,
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# All values are GitHub Actions secrets (Settings → Secrets and variables → Actions);
# none are committed. Builds succeed unsigned locally when these are unset.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions: {}

jobs:
  # Fails fast when the tag is wrong, before any signing credential is reachable,
  # then opens a DRAFT release for the build jobs to upload into.
  #
  # The draft matters for three reasons:
  #   • An asset-less published release is visible to the updater immediately.
  #     Beta clients scan published Atom entries and would select it as the newest
  #     semver, then fail on the missing latest.yml. Drafts are invisible to them.
  #   • electron-builder refuses to upload into a release *published* more than two
  #     hours earlier. A draft has no published_at, so the clock never starts and a
  #     wait on the `release` environment approval cannot burn the window.
  #   • If a build job fails, a leftover draft is private and harmless.
  # The publish job below flips it to public once both installers are attached.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the main-ancestry check below can see origin/main.
          fetch-depth: 0

      - name: Read desktop version
        id: version
        working-directory: apps/desktop
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # A `-beta.N` suffix means this must not take the repo-wide Latest badge.
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "apps/desktop version: ${VERSION} (prerelease=${PRERELEASE})"

      - name: Tag must match the desktop package version
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag '${TAG}' does not match apps/desktop/package.json version '${VERSION}'."
            echo "::error::electron-builder publishes to 'v${VERSION}', so this run would put the installers on the wrong release."
            echo "::error::Bump the version and re-tag as 'v${VERSION}', or delete and re-push the tag."
            exit 1
          fi
          echo "Tag ${TAG} matches package version ${VERSION}."

      # RELEASING.md cuts releases by merging dev into main and tagging there. The
      # protected `release` environment only gates the signing jobs, so without this
      # a tag pushed from any branch would still open a release for an unshipped
      # commit. Test builds belong on workflow_dispatch, which stays draft-only.
      - name: Tag must be on main
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::Could not resolve origin/main to check tag reachability."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '${TAG}' points at ${GITHUB_SHA}, which is not reachable from main."
            echo "::error::Merge the release commit into main and re-tag there, per RELEASING.md."
            echo "::error::For a throwaway test build, run this workflow via workflow_dispatch instead."
            exit 1
          fi
          echo "Tag ${TAG} is reachable from main."

      - name: Open a draft release for the build jobs
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; the build jobs will upload into it."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Yosemite Crew PIMS Desktop $TAG" \
            --generate-notes \
            --draft

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # Gates the Azure signing secrets behind the protected `release` environment.
    # Configure required reviewers and a deployment tag rule (v*) on this
    # environment in repo settings so pushing a `v*` tag cannot reach
    # signing credentials without an explicit approval.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & sign (Azure Artifact Signing); publish only on a tag
        working-directory: apps/desktop
        run: pnpm run desktop:dist:win -- --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Nothing downstream of the build re-reads the signature, so without this a
      # green job means only that signing did not throw.
      #
      # Step position does NOT contain a bad installer, and it must not be read
      # that way: the upload step below is `if: always()` so it runs even when
      # this fails, and on a tag the build step itself already passed
      # `--publish always`, attaching the installers to the draft release before
      # this step runs. What actually holds the line is job-level: `publish`
      # needs verify + windows + macos and `release` needs windows + macos, so a
      # failure here means the draft is never made public and no manual release
      # is created. The artifact and the draft asset are deliberately still
      # produced, because a rejected installer is the thing you need to inspect.
      - name: Verify the Windows Authenticode signatures
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Read the expected publisher from the electron-builder config rather
          # than repeating it, so the check cannot drift from what is signed.
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).build.win.signtoolOptions.publisherName
          if ([string]::IsNullOrWhiteSpace($expected)) {
            throw 'build.win.signtoolOptions.publisherName is not set in package.json; cannot verify.'
          }
          $files = @(Get-ChildItem -Path dist -Filter *.exe -File -ErrorAction SilentlyContinue)
          # An empty artifact set must fail. "Nothing to check" and "everything
          # checked out" are not allowed to look the same from outside.
          if ($files.Count -eq 0) { throw 'No .exe found in apps/desktop/dist; nothing was verified.' }
          $failures = @()
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "$($file.Name): status=$($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              $failures += "$($file.Name): Authenticode status is $($sig.Status), expected Valid."
              continue
            }
            # Read the CN through GetNameInfo rather than pattern-matching the
            # Subject DN: the publisher name contains a non-ASCII character
            # (U+00E4) and parentheses, so substring and regex forms over the DN
            # are both a bet on encoding and quoting. This returns the CN value.
            $cn = $sig.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            # Exact, ordinal. A `-like "*$expected*"` here would accept any
            # publisher whose name merely CONTAINS ours.
            if ($cn -cne $expected) {
              $failures += "$($file.Name): signed by CN '$cn' (len $($cn.Length)), expected '$expected' (len $($expected.Length))."
            }
            # `Status -eq 'Valid'` is true for a signature that was never
            # timestamped, and an untimestamped Authenticode signature stops
            # validating when the signing certificate expires. This chain
            # configures an RFC3161 timestamp explicitly
            # (scripts/windows-trusted-sign.js sets TimestampRfc3161), and
            # verification runs minutes after signing, when a timestamped and an
            # untimestamped signature are otherwise indistinguishable.
            if (-not $sig.TimeStamperCertificate) {
              $failures += "$($file.Name): no RFC3161 countersignature; this signature expires with the certificate."
            }
          }
          if ($failures.Count -gt 0) {
            foreach ($failure in $failures) { Write-Host "::error::$failure" }
            exit 1
          }
          Write-Host "All $($files.Count) Windows artifacts carry a valid $expected signature."

      - name: Upload signed Windows artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-signed
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: warn

  macos:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    # Same protected `release` environment gate for the Apple signing/notarization secrets.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign (Developer ID) & notarize; publish only on a tag
        working-directory: apps/desktop
        run: pnpm run desktop:dist:mac -- --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # scripts/notarize.js falls back to `codesign --sign -` when APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD or APPLE_TEAM_ID is absent or rejected, and an
      # ad-hoc signed bundle passes `codesign --verify --deep --strict` with exit
      # 0 - measured, macOS 15. So the obvious check is blind to the one failure
      # this build can actually produce, and the script asserts the Developer ID
      # authority, the team identifier, Gatekeeper acceptance and the stapled
      # ticket instead. See apps/desktop/scripts/verify-macos-signature.js.
      #
      # The .app is the target rather than the .dmg: @electron/notarize staples
      # the ticket to the bundle (lib/index.js calls stapleApp after notarizing),
      # and the disk image is built from the already-stapled app.
      #
      # As on the windows job, step position is not what contains a bad build -
      # the upload below is `if: always()` and on a tag the build step has
      # already run `--publish always`. The guarantee is job-level: `publish`
      # needs verify + windows + macos, `release` needs windows + macos.
      - name: Verify the macOS signature and notarization
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          # Every bundle, not the first one found. `build.mac.target` is dmg+zip
          # with no `arch` list today, so macos-14 yields exactly one - but if an
          # arch list is ever added this would otherwise silently verify half the
          # output and pass.
          COUNT=$(find dist -maxdepth 2 -type d -name '*.app' | wc -l | tr -d ' ')
          # An empty artifact set must fail. "Nothing to check" and "everything
          # checked out" are not allowed to look the same from outside.
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No .app bundle under apps/desktop/dist; nothing was verified."
            exit 1
          fi
          echo "Verifying ${COUNT} app bundle(s)."
          # -print0/-0 because the bundle name contains spaces.
          find dist -maxdepth 2 -type d -name '*.app' -print0 \
            | xargs -0 node scripts/verify-macos-signature.js

      - name: Upload signed macOS artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-signed
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: warn

  # Both installers are attached by now, so the draft is safe to make public. Only
  # a clean X.Y.Z takes the repo-wide Latest badge: electron-updater's stable path
  # resolves /releases/latest, so a stable desktop release has to hold it or stable
  # clients keep resolving another product's tag. A `-beta.N` release must not.
  publish:
    if: github.event_name == 'push'
    needs:
      - verify
      - windows
      - macos
    runs-on: ubuntu-latest
    # Covers the up-to-25-minute Supply Chain wait below plus the flip itself.
    timeout-minutes: 30
    permissions:
      contents: write
      # Needed to query the Supply Chain workflow's runs for this commit.
      actions: read
    steps:
      # supply-chain.yml runs its vulnerability and license gates independently
      # on the same tag push, so without this wait a tag carrying a critical
      # vulnerability or a disallowed license would still go public. Hold the
      # draft flip until the Supply Chain run for this exact commit succeeds.
      - name: Wait for the Supply Chain verdict on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # 50 polls x 30s = ~25 minutes; the supply-chain run starts with the
          # tag push, in parallel with the 45-minute build jobs, and takes
          # several minutes. Multiple runs can share this head_sha (the merge
          # to main and the tag push), so wait on the most recent one.
          for ATTEMPT in $(seq 1 50); do
            RUN=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/supply-chain.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "none" else "\(.status)|\(.conclusion)|\(.html_url)" end')
            if [ "$RUN" = "none" ]; then
              echo "[${ATTEMPT}/50] No Supply Chain run found for ${SHA} yet; retrying in 30s."
            else
              STATUS=${RUN%%|*}
              REST=${RUN#*|}
              CONCLUSION=${REST%%|*}
              URL=${REST#*|}
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "Supply Chain passed for ${SHA}: ${URL}"
                  exit 0
                fi
                echo "::error::Supply Chain run for ${SHA} concluded '${CONCLUSION}' (${URL}); refusing to publish the release."
                exit 1
              fi
              echo "[${ATTEMPT}/50] Supply Chain run is ${STATUS} (${URL}); retrying in 30s."
            fi
            sleep 30
          done
          echo "::error::No completed Supply Chain run for ${SHA} after 25 minutes; refusing to publish the release."
          exit 1

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then LATEST=false; else LATEST=true; fi
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest="$LATEST"
          echo "Published $TAG (latest=${LATEST})."

  release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Read desktop version
        id: version
        working-directory: apps/desktop
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: desktop-manual-v${{ steps.version.outputs.version }}-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: Yosemite Crew PIMS Desktop manual v${{ steps.version.outputs.version }}-${{ github.run_id }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/latest.yml
            release-assets/latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
