name: Desktop Release

# Builds and code-signs the desktop app. Two ways to run:
#   • Push a tag `v*`  → builds, signs, and PUBLISHES a GitHub Release.
#       1) bump "version" in apps/desktop/package.json
#       2) git tag v<version> && git push origin v<version>
#     The tag MUST be `v` + the exact apps/desktop/package.json version. The
#     `verify` job below fails the run otherwise, because electron-builder names
#     its release from the package version rather than from the pushed tag: a
#     mismatch silently publishes the assets to a different release.
#     The `v` prefix is not cosmetic. electron-updater's GitHub provider reads
#     the tag out of the release URL and drops any tag that is not valid semver
#     (GitHubProvider `semver.valid(hrefTag)`), so a `desktop-v*` tag makes every
#     desktop release invisible to the updater. Other products in this monorepo
#     keep their prefixes precisely so the updater skips them.
#   • Run manually (Actions → "Desktop Release" → Run workflow / workflow_dispatch)
#       → builds + signs, uploads workflow ARTIFACTS, then creates a draft
#         GitHub Release with the same assets. Use this to share download links
#         without requiring the Actions artifact UI.
#
# Windows is signed via Azure Artifact Signing (formerly Trusted Signing).
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   (the `yc-signing-ci` app registration, holding the
#    "Trusted Signing Certificate Profile Signer" role on the yc-signing account)
#
# macOS is signed with a Developer ID Application cert and notarized via notarytool.
#   CSC_LINK (base64 of the Developer ID .p12), CSC_KEY_PASSWORD,
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# All values are GitHub Actions secrets (Settings → Secrets and variables → Actions);
# none are committed. Builds succeed unsigned locally when these are unset.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions: {}

jobs:
  # Fails fast when the pushed tag and apps/desktop/package.json disagree, before
  # any signing credential is reachable. Also creates the release up front so the
  # windows and macos jobs upload into one release instead of racing to create
  # two (which is how v0.1.0-beta.1 ended up split across duplicate drafts).
  #
  # Two things to know about pre-creating it:
  #   • electron-builder refuses to upload into a release published more than two
  #     hours earlier, so the build jobs must finish inside that window. Their
  #     45-minute timeouts keep them well clear of it.
  #   • If a build job fails, the empty release stays behind. Delete it before
  #     re-running, or re-run and let the jobs upload into it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read desktop version
        id: version
        working-directory: apps/desktop
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apps/desktop version: ${VERSION}"

      - name: Tag must match the desktop package version
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag '${TAG}' does not match apps/desktop/package.json version '${VERSION}'."
            echo "::error::electron-builder publishes to 'v${VERSION}', so this run would put the installers on the wrong release."
            echo "::error::Bump the version and re-tag as 'v${VERSION}', or delete and re-push the tag."
            exit 1
          fi
          echo "Tag ${TAG} matches package version ${VERSION}."

      - name: Create the release up front
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; the build jobs will upload into it."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Yosemite Crew PIMS Desktop $TAG" \
            --generate-notes \
            --latest=false

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # Gates the Azure signing secrets behind the protected `release` environment.
    # Configure required reviewers and a deployment tag rule (v*) on this
    # environment in repo settings so pushing a `v*` tag cannot reach
    # signing credentials without an explicit approval.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & sign (Azure Artifact Signing); publish only on a tag
        working-directory: apps/desktop
        run: pnpm run desktop:dist:win -- --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed Windows artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-signed
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: warn

  macos:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    # Same protected `release` environment gate for the Apple signing/notarization secrets.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign (Developer ID) & notarize; publish only on a tag
        working-directory: apps/desktop
        run: pnpm run desktop:dist:mac -- --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed macOS artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-signed
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: warn

  release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Read desktop version
        id: version
        working-directory: apps/desktop
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          tag_name: desktop-manual-v${{ steps.version.outputs.version }}-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: Yosemite Crew PIMS Desktop manual v${{ steps.version.outputs.version }}-${{ github.run_id }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/latest.yml
            release-assets/latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
