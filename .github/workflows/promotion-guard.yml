name: Promotion Guard

# main takes changes from dev, and only from dev.
#
# Config alone cannot enforce this. `target-branch: dev` aims Dependabot VERSION
# updates at dev, but Dependabot SECURITY updates always open against the default
# branch and ignore it - which is exactly how the json security bump (#2131)
# arrived as a PR into main on 2026-08-13 and was merged there, leaving dev still
# on the vulnerable version. This job is the part that actually holds the line.
#
# Mark it required on main's ruleset for it to block rather than merely report.
on:
  pull_request_target:
    # `edited` matters: retargeting an existing PR onto main emits edited (with
    # changes.base), not opened or synchronize. Without it the guard never runs
    # for a retargeted PR, which - once the check is required - leaves that PR
    # waiting forever on a status instead of getting the actionable error.
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
    branches: [main]

concurrency:
  group: promotion-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# pull_request_target runs against the BASE repository, so it must never check
# out or execute the pull request's code. It only reads branch metadata and
# retargets the pull request through the API below.
permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    name: Only dev may merge into main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Bots first, and deliberately BEFORE the main-direct escape hatch, so no
      # label a human applies can wave a bot's pull request into main.
      #
      # Dependabot SECURITY updates ignore `target-branch: dev` and always open
      # against the default branch - that is a GitHub behaviour we cannot
      # configure away, and it is how #2131 landed on main leaving dev on the
      # vulnerable version. Blocking those PRs alone would leave the fix
      # stranded, so retarget them at dev where they can actually be merged.
      - name: Retarget bot pull requests at dev
        id: retarget
        if: github.event.pull_request.user.type == 'Bot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A fork branch cannot be retargeted usefully, and we will not grant it
          # a path into main. Leave it for the guard below to reject.
          if [[ "${HEAD_REPO}" != "${BASE_REPO}" ]]; then
            echo "retargeted=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::notice::${AUTHOR} opened this against main. Retargeting at dev."
          gh pr edit "${PR}" --repo "${BASE_REPO}" --base dev

          gh pr comment "${PR}" --repo "${BASE_REPO}" --body "$(cat <<'BODY'
          Retargeted from `main` to `dev` automatically.

          `main` only ever takes changes from `dev`. Dependabot security updates ignore the `target-branch: dev` setting and always open against the default branch, so this is corrected here rather than in configuration.

          Nothing is needed from you: review and merge this into `dev`, and the next `dev` to `main` promotion carries it. If the diff no longer applies cleanly against `dev`, close this and let the `dev`-targeted update supersede it.
          BODY
          )"

          echo "retargeted=true" >> "${GITHUB_OUTPUT}"

      - name: Check the head branch
        if: steps.retarget.outputs.retargeted != 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          IS_BOT: ${{ github.event.pull_request.user.type == 'Bot' }}
          # A deliberate, human-applied escape hatch for the rare direct-to-main
          # change (an emergency hotfix, or a dependabot.yml sync that has to
          # take effect before the next promotion). Checked AFTER the bot branch
          # above, so it can only ever release a human's pull request.
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          if [[ "${IS_BOT}" == "true" ]]; then
            echo "::error::A bot pull request (${HEAD_REPO}:${HEAD_REF}) cannot merge into main, and the 'main-direct' label does not apply to it. It should have been retargeted at dev automatically; if it was not, retarget it by hand."
            exit 1
          fi

          if [[ ",${LABELS}," == *",main-direct,"* ]]; then
            echo "::notice::'main-direct' label present - a human has explicitly allowed this direct merge."
            exit 0
          fi

          if [[ "${HEAD_REPO}" != "${BASE_REPO}" ]]; then
            echo "::error::A fork branch (${HEAD_REPO}:${HEAD_REF}) cannot merge into main. Target dev instead."
            exit 1
          fi

          if [[ "${HEAD_REF}" != "dev" ]]; then
            echo "::error::main only accepts merges from dev, but this PR's head is '${HEAD_REF}'. Retarget it at dev and let the usual dev-to-main promotion carry it. If this genuinely must land on main first, add the 'main-direct' label."
            exit 1
          fi

          echo "Head branch is dev - promotion allowed."

      # dev must CONTAIN main before dev can be promoted into it again.
      #
      # Promotion merges dev into main, so anything sitting on main that dev does
      # not have is not carried by the next promotion - it is simply left behind,
      # and the promotion diff makes it look like a deletion. back-merge.yml opens
      # a pull request to prevent exactly this, but opening one enforces nothing:
      # on 2026-08-30 back-merge #2568 sat unmerged and dev was missing a commit
      # that main had while a promotion was being prepared on top of it.
      #
      # Read through the compare API rather than a checkout: this workflow runs as
      # pull_request_target and must never fetch the pull request's code.
      - name: dev must contain main
        if: steps.retarget.outputs.retargeted != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `dev...main` describes main RELATIVE TO dev, so ahead_by counts the
          # commits main holds that dev does not.
          AHEAD="$(gh api "repos/${BASE_REPO}/compare/dev...main" --jq '.ahead_by')"

          if [[ "${AHEAD}" -gt 0 ]]; then
            echo "::error::dev is missing ${AHEAD} commit(s) that are on main, so this promotion would leave them behind. Merge the open back-merge pull request (back-merge.yml opens one on every push to main) into dev first, then re-run this check."
            exit 1
          fi

          echo "dev contains main - nothing would be left behind."
