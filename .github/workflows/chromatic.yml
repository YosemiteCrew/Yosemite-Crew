name: Chromatic

# Runs on pull requests so a visual regression is caught BEFORE it lands, and on
# pushes to the long-lived branches so the accepted baseline moves forward after
# a merge. Previously this only ran on push, which meant every regression shipped
# first and was reported afterwards.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**'
      - 'packages/design-tokens/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/chromatic.yml'
  push:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**'
      - 'packages/design-tokens/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/chromatic.yml'
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  chromatic:
    name: Chromatic Publish & Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The vars gate keeps this dormant until the project token is configured.
    # The repo check skips pull requests from forks, which cannot read secrets:
    # without it every external contributor gets a red check they cannot fix.
    # Dependabot is excluded for the same reason - its head repo IS this repo,
    # so the fork check does not catch it, but GitHub still withholds Actions
    # secrets from Dependabot-triggered runs, which would fail every dependency
    # PR that touches package.json or the lockfile.
    if: >-
      vars.CHROMATIC_CONFIGURED == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Chromatic needs full history to find the baseline commit; onlyChanged
          # (TurboSnap) also walks the git graph to decide what to re-snapshot.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@4cc98810d00b34b8f9e89d454d64a8ac3d088340 # v18.7.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/frontend
          buildScriptName: 'storybook:build'
          onlyChanged: true
          # On main/dev the merged result IS the new baseline, so accept
          # automatically. On a pull request nothing is auto-accepted: unreviewed
          # visual changes fail the job and a human accepts them in Chromatic.
          autoAcceptChanges: ${{ github.event_name == 'push' && github.ref_name || '' }}
          externals: |
            packages/design-tokens/**
            apps/frontend/public/**
