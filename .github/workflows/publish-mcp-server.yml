# Stages @yosemitecrew/mcp-server on npm on an `mcp-v*` tag.
#
# Trusted publishing (OIDC), not a token. npm mints a short-lived credential
# from this workflow's identity, so there is no NPM_TOKEN to leak, rotate or
# leave in a log, and the staged package carries provenance linking it to this
# repository and this run. A maintainer then reviews and approves the staged
# package with 2FA.
#
# Two jobs, so the credential and the build never share a job:
#   build  checks the tag, installs, builds, tests and packs with `contents:
#          read` only. Every install and build script runs here, where there is
#          no id-token for a compromised dependency to take.
#   stage  runs only on a tag push, in the `npm-publish` environment (whose
#          deployment policy admits `mcp-v*` tags only), and is the ONLY job
#          with `id-token: write`. It installs nothing and runs no package
#          scripts: it stages exactly the tarball `build` produced and tested.
# npm's trust configuration names this repository, this file AND the
# `npm-publish` environment, so a credential requested from anywhere else - a
# branch dispatch, another environment, another workflow - is refused by npm.
# `publish-mcp-first` (the one-time bootstrap that published 0.1.0
# interactively) created that configuration and refuses any that differs.
#
# npm only supports staging an existing package, so the first tag this
# workflow publishes is the version after 0.1.0.
name: Publish MCP server

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same rule the desktop and mobile releases enforce: a package is
      # published from code that is already on main, never from a tag pointing
      # at something that never landed.
      - name: Refuse a tag that is not on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not reachable from main; promote it first."
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tag must name the version being published, so a mistyped tag cannot
      # ship a different version than the one it claims.
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./packages/mcp-server/package.json').version")
          TAG="${GITHUB_REF_NAME#mcp-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag mcp-v$TAG does not match package version $PKG"
            exit 1
          fi
          echo "staging $PKG"

      - run: pnpm --filter @yosemitecrew/mcp-server run build
      - run: pnpm --filter @yosemitecrew/mcp-server run test

      # Proves the tarball's entrypoint exists before anything is published:
      # `files` and `bin` can disagree with what the build actually emitted, and
      # a missing entrypoint only shows up when someone installs it.
      - name: Prove the tarball is installable
        working-directory: packages/mcp-server
        run: |
          set -euo pipefail
          npm pack
          TARBALL=$(ls ./*.tgz)
          WORK=$(mktemp -d)
          cd "$WORK"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$OLDPWD/$TARBALL"
          BIN=node_modules/@yosemitecrew/mcp-server/dist/index.js
          test -f "$BIN" || { echo "::error::bin entrypoint missing from the tarball"; exit 1; }
          head -1 "$BIN" | grep -q '^#!' || { echo "::error::bin entrypoint has no shebang"; exit 1; }
          echo "tarball installs and carries a runnable entrypoint"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-server-tarball
          path: packages/mcp-server/*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage on npm
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Trusted publishing needs a recent npm; the one bundled with Node 22 is
      # older than the release that added OIDC support. Pinned, not @latest, so
      # the npm that holds the credential is one that was reviewed.
      - name: Use a pinned npm that can do trusted publishing
        run: npm install -g npm@12.1.0 --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-server-tarball
          path: tarball

      - name: Stage for maintainer approval
        run: |
          set -euo pipefail
          TARBALL=$(ls tarball/*.tgz)
          npm stage publish "$TARBALL" --ignore-scripts
