name: Desktop E2E

# Runs the Playwright-Electron suite in apps/desktop/tests/e2e. Those specs have
# existed for a while - tabs, command palette, compliance, document vault,
# offline cache, packaged app - but nothing ran them, so the desktop shell was
# the one shipped surface with no automated end-to-end coverage at all.
#
# Windows and macOS only, and only when the desktop app changes. Those are the
# two platforms desktop-release.yml signs and ships, and macOS runners bill at
# ten times the Linux rate, so a path filter is what makes running the real
# thing on the real platforms affordable. Linux is built by electron-builder but
# is not signed or published, so it is not covered here.
#
# The suite drives Electron directly rather than a browser, so no
# `playwright install` step is needed: there are no browser binaries to fetch.
# Electron's own binary arrives through its postinstall during the shared setup
# step.

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-e2e.yml'
  push:
    branches: [main, dev]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-e2e.yml'
  workflow_dispatch: {}

concurrency:
  group: desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Desktop E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Report both platforms on every run. A Windows-only failure is exactly
      # the kind of thing this suite exists to catch, and fail-fast would hide
      # it behind an unrelated macOS failure.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # The specs launch Electron with the app root as its argument, and the
      # package's `main` points at build/main.js, so an unbuilt tree starts an
      # app with no entry point rather than failing informatively.
      - name: Build the desktop app
        run: pnpm --filter @yosemite-crew/desktop run build

      - name: Run the Playwright Electron suite
        run: pnpm --filter @yosemite-crew/desktop run e2e

      # The list reporter prints enough to diagnose a failure in the log, but
      # traces and screenshots are what make an OS-specific failure tractable
      # from another machine.
      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Single check to mark required on the branch ruleset, for the same reason
  # ci.yaml and supply-chain.yml each have one: a required check treats a
  # skipped job as satisfied, so the matrix needs an aggregate that fails when
  # any leg fails or is skipped unexpectedly.
  desktop-e2e-required:
    name: Desktop E2E Required
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e]
    steps:
      - name: Fail on any failed or cancelled leg
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "Desktop E2E Required: at least one platform failed or was cancelled"
            exit 1
          fi
