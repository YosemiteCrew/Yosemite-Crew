name: React Doctor

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  # Kept for the action's sticky PR summary comment. Pull request comments are
  # created through the issue-comments API, so the action needs issues: write in
  # addition to pull-requests: write, as its own setup documentation states.
  # Dropping it silently disables the summary comment rather than failing, so it
  # stays until PR comments are deliberately turned off in the action's config.
  issues: write
  # `statuses: write` is deliberately NOT granted. Nothing in this workflow
  # creates a commit status, and the token is handed to a third-party action
  # running against pull-request-controlled code - a scope that can write commit
  # statuses is worth withholding where branch protection may consult legacy
  # status contexts. Add it back only alongside a step that demonstrably needs
  # it.

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Runs a third-party action against PR-controlled code; do not leave
          # the default token in git config for it to read.
          persist-credentials: false

      - name: Run React Doctor
        id: react-doctor
        uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
        with:
          directory: apps/frontend
          blocking: error
          node-version: '22'
          # Pin the CLI: react-doctor@0.7.5+ emits report schemaVersion 3, which
          # the pinned action (v2.2.6) rejects as an unrecognized payload and
          # fails as "Scan could not complete". 0.7.4 emits schema 1 (accepted).
          version: 0.7.4

      - name: Enforce React Doctor score
        env:
          REACT_DOCTOR_SCORE: ${{ steps.react-doctor.outputs.score }}
          REACT_DOCTOR_ERROR_COUNT: ${{ steps.react-doctor.outputs.error-count }}
          REACT_DOCTOR_MIN_SCORE: '95'
        run: |
          # Real problems are enforced by `blocking: error` in the scan step. This
          # step is a warning-only quality signal: don't fail the build on a
          # score-only shortfall when there are zero error-level diagnostics (the
          # full-project score has a baseline curve and can sit below the target
          # even with no actionable errors).
          if [ "${REACT_DOCTOR_ERROR_COUNT:-0}" -eq 0 ]; then
            echo "::notice::React Doctor reported 0 errors; skipping the score-only gate (score: ${REACT_DOCTOR_SCORE:-n/a}). Error-level diagnostics remain enforced via 'blocking: error'."
            exit 0
          fi

          if [ -z "$REACT_DOCTOR_SCORE" ]; then
            echo "::warning::React Doctor did not return a score (scoring service unavailable); skipping the score gate. Blocking diagnostics are still enforced via 'blocking: error'."
            exit 0
          fi

          echo "React Doctor score: $REACT_DOCTOR_SCORE"
          if [ "$REACT_DOCTOR_SCORE" -lt "$REACT_DOCTOR_MIN_SCORE" ]; then
            echo "React Doctor score must be at least $REACT_DOCTOR_MIN_SCORE."
            exit 1
          fi

  react-doctor-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Runs a third-party action against PR-controlled code; do not leave
          # the default token in git config for it to read.
          persist-credentials: false

      - name: Run React Doctor
        id: react-doctor
        uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
        with:
          directory: apps/mobileAppYC
          blocking: error
          node-version: '22'
          # Pin the CLI: react-doctor@0.7.5+ emits report schemaVersion 3, which
          # the pinned action (v2.2.6) rejects as an unrecognized payload and
          # fails as "Scan could not complete". 0.7.4 emits schema 1 (accepted).
          version: 0.7.4

      - name: Enforce React Doctor score
        env:
          REACT_DOCTOR_SCORE: ${{ steps.react-doctor.outputs.score }}
          REACT_DOCTOR_ERROR_COUNT: ${{ steps.react-doctor.outputs.error-count }}
          REACT_DOCTOR_MIN_SCORE: '95'
        run: |
          # Real problems are enforced by `blocking: error` in the scan step. This
          # step is a warning-only quality signal: don't fail the build on a
          # score-only shortfall when there are zero error-level diagnostics (the
          # full-project score has a baseline curve and can sit below the target
          # even with no actionable errors).
          if [ "${REACT_DOCTOR_ERROR_COUNT:-0}" -eq 0 ]; then
            echo "::notice::React Doctor reported 0 errors; skipping the score-only gate (score: ${REACT_DOCTOR_SCORE:-n/a}). Error-level diagnostics remain enforced via 'blocking: error'."
            exit 0
          fi

          if [ -z "$REACT_DOCTOR_SCORE" ]; then
            echo "::warning::React Doctor did not return a score (scoring service unavailable); skipping the score gate. Blocking diagnostics are still enforced via 'blocking: error'."
            exit 0
          fi

          echo "React Doctor score: $REACT_DOCTOR_SCORE"
          if [ "$REACT_DOCTOR_SCORE" -lt "$REACT_DOCTOR_MIN_SCORE" ]; then
            echo "React Doctor score must be at least $REACT_DOCTOR_MIN_SCORE."
            exit 1
          fi
