name: React Doctor

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  # Kept for the action's sticky PR summary comment. Pull request comments are
  # created through the issue-comments API, so the action needs issues: write in
  # addition to pull-requests: write, as its own setup documentation states.
  # Dropping it silently disables the summary comment rather than failing, so it
  # stays until PR comments are deliberately turned off in the action's config.
  issues: write
  # `statuses: write` is deliberately NOT granted. Nothing in this workflow
  # creates a commit status, and the token is handed to a third-party action
  # running against pull-request-controlled code - a scope that can write commit
  # statuses is worth withholding where branch protection may consult legacy
  # status contexts. Add it back only alongside a step that demonstrably needs
  # it.

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Each job holds one app to the minimum score. The job names are the required
  # status checks, so keep them stable and keep the workflow free of path
  # filters: every pull request must report both.
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Runs a third-party action against PR-controlled code; do not leave
          # the default token in git config for it to read.
          persist-credentials: false

      - name: React Doctor score
        uses: ./.github/actions/react-doctor-score
        with:
          directory: apps/frontend
          minimum-score: '95'

  react-doctor-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Runs a third-party action against PR-controlled code; do not leave
          # the default token in git config for it to read.
          persist-credentials: false

      - name: React Doctor score
        uses: ./.github/actions/react-doctor-score
        with:
          directory: apps/mobileAppYC
          minimum-score: '95'
