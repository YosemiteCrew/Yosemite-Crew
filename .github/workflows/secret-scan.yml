name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  # Push runs scan only their own `before..sha` range, so a superseded run leaves
  # its commits unscanned. Give each push run its own group; PR runs scan the full
  # base..head diff and are safe to supersede.
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (OSS CLI)
        env:
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's
          # published checksums. Verified before extraction so a tampered or
          # swapped release binary fails the job instead of running as root on
          # the runner with the repository checked out.
          #
          # 8.30.1, not 8.24.2: .gitleaks.toml scopes its lockfile allowlist with
          # `condition = "AND"`, and 8.24.2 parses that key then silently ignores
          # it, falling back to OR - which is what let a `<name>: <40 hex>` API
          # key anywhere in the repo pass the scan. Do not lower this pin.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Run Gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="${{ github.sha }}"
          fi
          echo "Scanning commit range: $RANGE"
          gitleaks git --redact --verbose --exit-code 1 --log-opts="$RANGE"
