name: Storybook Interactions

# Runs the stories' `play` functions against a built Storybook, so the
# interaction assertions are executed by something rather than only by a human
# opening the panel.
#
# ADVISORY for failing stories, NOT for a run that did not happen. This job is
# not part of the `CI Required` aggregate, and a failing play function does not
# fail it: there is a backlog of failing stories, and making them block every
# merge today is #2281's call, not this file's. What DOES fail it is a run that
# checked nothing - the browser did not launch, the shard matched no story, or
# not one story passed. The runner exits 1 for those exactly as it does for a
# failing assertion, so the results file decides instead
# (scripts/ci/check-play-results.mjs). Promotion to required: drop
# `continue-on-error` on the run step and add this job to the required contexts.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**'
      - 'pnpm-lock.yaml'
      - 'scripts/ci/check-play-results.mjs'
      - '.github/workflows/storybook-interactions.yml'
  push:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**'
      - 'pnpm-lock.yaml'
      - 'scripts/ci/check-play-results.mjs'
      - '.github/workflows/storybook-interactions.yml'
  workflow_dispatch:

concurrency:
  group: storybook-interactions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  interactions:
    name: Storybook play functions ${{ matrix.shard }}/4 (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Sharded because the whole suite does not fit in one job. 3366 tests across
    # 606 story files took 17 minutes locally on 4 workers; a single CI job hit
    # the 45-minute timeout and was cancelled, which fails the job regardless of
    # continue-on-error - a timeout is not a step failure. Four shards keep each
    # one well inside its budget and they run in parallel.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only chromium. The runner defaults to it, and installing three engines
      # costs minutes for coverage the play functions do not use.
      #
      # Installed with the Playwright that @storybook/test-runner itself
      # resolves, not the frontend's own `playwright` bin. The two drift: the
      # frontend's e2e Playwright moved to a newer browser build while the test
      # runner still pinned an older one, so the old step downloaded a chromium
      # the runner never looks for and every shard died with "Executable doesn't
      # exist ... Failed to launch browser" before running a single story.
      - name: Install the chromium the test runner launches
        working-directory: apps/frontend
        run: |
          pw_dir=$(node -p "require('path').dirname(require.resolve('playwright/package.json', { paths: [require('path').dirname(require.resolve('@storybook/test-runner/package.json'))] }))")
          echo "test runner resolves playwright $(node -p "require('$pw_dir/package.json').version")"
          node "$pw_dir/cli.js" install chromium --with-deps

      - name: Build Storybook
        run: pnpm --filter frontend run storybook:build

      # concurrently + http-server + wait-on is the combination the test-runner
      # documents for CI: serve the static build, wait for it, run, tear down.
      # `continue-on-error` keeps failing stories advisory; the next step is what
      # fails the job when the run itself did not happen.
      - name: Run play functions
        continue-on-error: true
        run: |
          pnpm --filter frontend exec concurrently -k -s first -n "SB,TEST" \
            "pnpm --filter frontend run storybook:serve-static" \
            "pnpm --filter frontend run storybook:wait && pnpm --filter frontend exec test-storybook --maxWorkers=2 --shard=${{ matrix.shard }}/4 --json -- --outputFile=${{ runner.temp }}/play-results.json"

      # Fails on a missing results file, zero tests, or zero passes. Lists every
      # failing story in the job summary either way.
      - name: Check the play functions ran
        run: node scripts/ci/check-play-results.mjs "${{ runner.temp }}/play-results.json"
