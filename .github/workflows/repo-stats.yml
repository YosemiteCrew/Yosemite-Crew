name: repo-stats

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The action retries an authorization failure fifteen times at sixty-second
      # intervals and then runs into `timeout-minutes`, and GitHub reports a
      # timed-out job as `cancelled`. Twelve consecutive runs failed that way in
      # August and September 2026 and every one of them read like somebody had
      # pressed stop, so the frozen clone count on the marketing site was found by
      # eye rather than by CI.
      #
      # A 403 here is permanent - the token authenticates and is refused - so
      # retrying it cannot help. Check once, fail immediately, and put the required
      # permission in the message so the fix does not need an investigation.
      - name: Check the traffic API is readable before scanning
        env:
          GHRS_TOKEN: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
        run: |
          set -u
          # -o /dev/null keeps the response body out of a public log; only the
          # status code is read. On a transport error curl exits non-zero, and the
          # `|| status=000` overwrites whatever it printed - so a DNS or TLS failure
          # lands on a value that is not 200 and fails, rather than passing as a
          # response nobody checked.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GHRS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/traffic/clones") || status="000"

          if [ "$status" = "200" ]; then
            echo "Traffic API readable (HTTP 200)."
            exit 0
          fi

          echo "::error title=repo-stats cannot read the traffic API::GHRS_GITHUB_API_TOKEN got HTTP ${status} from /traffic/clones. The traffic endpoints need Administration (read) on this repository - a fine-grained token also needs Contents (read and write) for the data branch, and a classic token needs the repo scope plus push access. A 401 means the token is invalid or expired; a 403 means it authenticates but is not permitted."
          exit 1

      - name: Generate repo stats report
        uses: jgehrcke/github-repo-stats@306db38ad131cab2aa5f2cd3062bf6f8aa78c1aa # v1.4.2
        with:
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
          repository: YosemiteCrew/Yosemite-Crew
          databranch: github-repo-stats
          ghpagesprefix: https://yosemitecrew.github.io/Yosemite-Crew

  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: stats
    permissions:
      # Checkout/push to the data branch uses the GHRS_GITHUB_API_TOKEN PAT, not GITHUB_TOKEN.
      # The default GITHUB_TOKEN only needs read access here.
      contents: read
    steps:
      - name: Checkout stats branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
          ref: github-repo-stats
          fetch-depth: 0

      - name: Build summary json
        env:
          OWNER: YosemiteCrew
          REPO: Yosemite-Crew
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import sys
          import csv
          from html.parser import HTMLParser
          from pathlib import Path

          owner = os.environ["OWNER"]
          repo = os.environ["REPO"]
          report_dir = Path(owner) / repo / "latest-report"
          report_html = report_dir / "report.html"
          report_md = report_dir / "report.md"

          if not report_html.exists() and not report_md.exists():
            print(f"Report files not found: {report_html} and {report_md}")
            sys.exit(1)

          class TextExtractor(HTMLParser):
            def __init__(self) -> None:
              super().__init__()
              self.chunks: list[str] = []

            def handle_data(self, data: str) -> None:
              text = data.strip()
              if text:
                self.chunks.append(text)

          parser = TextExtractor()
          if report_md.exists():
            text = report_md.read_text(encoding="utf-8")
          else:
            parser.feed(report_html.read_text(encoding="utf-8"))
            text = "\n".join(parser.chunks)

          def extract_cumulative(label: str) -> int | None:
            match = re.search(rf"{label}\s*Cumulative:\s*([0-9,]+)", text, re.IGNORECASE)
            if not match:
              return None
            return int(match.group(1).replace(",", ""))

          def parse_ranked_list(block: str) -> list[dict]:
            items: list[dict] = []
            for part in block.split(","):
              raw = part.strip().strip("` ")
              if not raw:
                continue
              match = re.match(r"^\s*(\d+)\s*:\s*(.+?)\s*$", raw)
              if match:
                items.append({"rank": int(match.group(1)), "value": match.group(2)})
              else:
                items.append({"rank": None, "value": raw})
            return items

          def extract_top(section_label: str, next_label: str) -> list[dict]:
            match = re.search(
              rf"{section_label}:\s*(.*?)\s*{next_label}:",
              text,
              re.IGNORECASE | re.DOTALL,
            )
            if not match:
              return []
            block = match.group(1)
            return parse_ranked_list(block)

          def extract_top_until(section_label: str, stop_labels: list[str]) -> list[dict]:
            stop_group = "|".join(map(re.escape, stop_labels))
            match = re.search(
              rf"{section_label}:\s*(.*?)(?:\s*(?:{stop_group}))",
              text,
              re.IGNORECASE | re.DOTALL,
            )
            if not match:
              return []
            block = match.group(1)
            return parse_ranked_list(block)

          generated_at = None
          generated_match = re.search(r"Generated .* at ([0-9:\- ]+UTC)", text)
          if generated_match:
            generated_at = generated_match.group(1).strip()

          generated_for = None
          generated_with = None
          generated_full_match = re.search(
            r"Generated for \[([^\]]+)\]\([^)]+\) with \[([^\]]+)\]\([^)]+\) at ([0-9:\- ]+UTC)",
            text,
          )
          if generated_full_match:
            generated_for = generated_full_match.group(1).strip()
            generated_with = generated_full_match.group(2).strip()
            generated_at = generated_full_match.group(3).strip()

          top_referrers_ranked = extract_top("Top 15 referrers", "Top 15 paths")
          top_paths_ranked = extract_top_until(
            "Top 15 paths",
            ["Generated", "Report file contents", "<script", "script"],
          )

          def load_csv(path: Path) -> dict:
            with path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              rows = [row for row in reader]
              return {
                "headers": reader.fieldnames or [],
                "rows": rows,
              }

          def load_json(path: Path):
            try:
              return json.loads(path.read_text(encoding="utf-8"))
            except json.JSONDecodeError:
              return None

          raw_csv: dict = {}
          for csv_path in sorted(Path(".").glob("*-raw.csv")):
            raw_csv[csv_path.stem] = load_csv(csv_path)

          snapshots: dict = {}
          snapshots_dir = Path("newsnapshots")
          if snapshots_dir.exists():
            for json_path in sorted(snapshots_dir.glob("*.json")):
              payload = load_json(json_path)
              if payload is not None:
                snapshots[json_path.name] = payload

          charts: dict = {}
          if report_md.exists():
            md_text = report_md.read_text(encoding="utf-8")
            cursor = 0
            while True:
              idx = md_text.find("vegaEmbed('", cursor)
              if idx == -1:
                break
              chart_id_start = idx + len("vegaEmbed('")
              chart_id_end = md_text.find("'", chart_id_start)
              if chart_id_end == -1:
                break
              chart_id = md_text[chart_id_start:chart_id_end]
              json_start = md_text.find("{", chart_id_end)
              if json_start == -1:
                break
              depth = 0
              i = json_start
              while i < len(md_text):
                if md_text[i] == "{":
                  depth += 1
                elif md_text[i] == "}":
                  depth -= 1
                  if depth == 0:
                    break
                i += 1
              if depth != 0:
                break
              json_str = md_text[json_start : i + 1]
              try:
                spec = json.loads(json_str)
                chart_key = chart_id.replace("chart_", "")
                charts[chart_key] = {
                  "datasets": spec.get("datasets", {}),
                }
              except json.JSONDecodeError:
                pass
              cursor = i + 1

          summary = {
            "owner": owner,
            "repo": repo,
            "generated_at_utc": generated_at,
            "generated_for": generated_for,
            "generated_with": generated_with,
            "views": {
              "unique": extract_cumulative("Unique visitors"),
              "total": extract_cumulative("Total views"),
            },
            "clones": {
              "unique": extract_cumulative("Unique cloners"),
              "total": extract_cumulative("Total clones"),
            },
            "top_referrers": [item["value"] for item in top_referrers_ranked],
            "top_paths": [item["value"] for item in top_paths_ranked],
            "top_referrers_ranked": top_referrers_ranked,
            "top_paths_ranked": top_paths_ranked,
            "raw_csv": raw_csv,
            "snapshots": snapshots,
            "charts": charts,
            "data_files": {
              "raw_csv": sorted(raw_csv.keys()),
              "snapshots": sorted(snapshots.keys()),
              "charts": sorted(charts.keys()),
            },
            "report_url": f"https://{owner.lower()}.github.io/{repo}/{owner}/{repo}/latest-report/report.html",
          }

          report_dir.mkdir(parents=True, exist_ok=True)
          summary_path = report_dir / "summary.json"
          summary_path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {summary_path}")
          PY

      - name: Commit summary json
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add YosemiteCrew/Yosemite-Crew/latest-report/summary.json
            git commit -m "chore(repo-stats): update summary json"
            git push origin github-repo-stats
          else
            echo "No summary changes to commit."
          fi
