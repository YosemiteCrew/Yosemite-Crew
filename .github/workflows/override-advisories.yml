name: Override Advisories

# scripts/ci/check-override-advisories.mjs answers "does a pnpm override pin a
# version that still has an advisory". It has never had a caller.
#
# It cannot be a pull-request gate, and that is deliberate: it needs the registry
# (`pnpm audit`), and check-override-drift.mjs says so where it explains why IT
# can be a hard gate and this one cannot. A registry timeout on a required check
# is a flaky security check, which gets routed around.
#
# What was missing is the other half. The script's own `--strict` flag exists,
# in its words, "so a scheduled security job can opt into fail-closed" - and that
# job was never written, so the check ran only when somebody typed it by hand.
# Reviewing PR #3344 meant running it manually to find out that dev was carrying
# two stale pins. Nightly, off the critical path, fail-closed, is the shape this
# check was designed for.
on:
  schedule:
    # After the nightly Sonar analysis and the TLS check, before European hours.
    - cron: '40 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: override-advisories-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Check override pins (${{ matrix.branch }})
    # A fork has its own overrides.
    if: github.repository_owner == 'YosemiteCrew'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # main failing must not cancel dev. Without this the run reports on one
      # branch and says nothing at all about the other, which is the same silent
      # hole this workflow exists to close.
      fail-fast: false
      matrix:
        # Both branches, because they are different trees with different
        # overrides and they answer differently. A schedule fires only from the
        # default branch and `actions/checkout` with no `ref` takes the
        # triggering ref, so the obvious workflow audits main and never sees dev
        # - it would not have caught the two stale pins on dev that #3344 fixed.
        #
        # Auditing only dev is wrong in the other direction. main drifts on its
        # own: dependabot SECURITY updates open against the default branch
        # regardless of `target-branch` (see promotion-guard.yml), and #2954
        # exists because main had accumulated stale-pinned advisories that dev
        # did not have. Each branch also carries its own acceptance baseline, so
        # each is checked against the acceptances recorded for it.
        branch: [main, dev]
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      # A full install, because the check imports `semver` - the same resolver
      # pnpm uses - to decide whether an override key covers a vulnerable copy.
      # An earlier revision hand-rolled that comparator to stay dependency-free
      # and review found eight defects in it, every one a silent false negative.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Check override pins
        id: check
        run: |
          set +e
          node scripts/ci/check-override-advisories.mjs --strict 2>&1 \
            | tee override-report.txt
          status="${PIPESTATUS[0]}"
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"
