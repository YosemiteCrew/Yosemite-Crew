name: Dev Docs Build

on:
  pull_request:
    paths:
      - 'apps/dev-docs/**'
      - '.github/workflows/dev-docs-build.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: dev-docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-docs:
    name: Build dev-docs (Docusaurus)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dev-docs (includes postbuild copy)
        run: pnpm --filter dev-docs build
