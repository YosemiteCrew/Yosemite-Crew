# Mobile release: build signed artifacts and ship them to the TESTING tracks.
#
# Deliberately stops short of production. A tag uploads to TestFlight and the
# Play internal track; promoting to the App Store or Play production remains a
# manual action in App Store Connect / Play Console.
#
# The reason is not caution for its own sake. Nothing in CI builds the mobile
# app today, and a single afternoon of trying to produce a release build turned
# up five separate breakages that had accumulated unnoticed: a gitignored
# gradle.properties, a floating react-native-screens range whose codegen specs
# RN 0.81 cannot parse, an unsatisfiable nitro-modules peer range, and two
# untracked Firebase config files. A testing track is reversible in seconds. A
# production submission is not.
#
# REQUIRED SECRETS (all on the protected `release` environment):
#   Android
#     ANDROID_KEYSTORE_BASE64        base64 of the release keystore
#     ANDROID_KEYSTORE_PASSWORD      YC_RELEASE_STORE_PASSWORD
#     ANDROID_KEY_ALIAS              YC_RELEASE_KEY_ALIAS
#     ANDROID_KEY_PASSWORD           YC_RELEASE_KEY_PASSWORD
#     ANDROID_GOOGLE_SERVICES_JSON   base64 of android/app/google-services.json
#     ANDROID_STRINGS_XML            base64 of android/app/src/main/res/values/strings.xml
#     PLAY_SERVICE_ACCOUNT_JSON      Play Developer API service account key
#   iOS
#     IOS_CERTIFICATE_BASE64         base64 of the distribution .p12
#     IOS_CERTIFICATE_PASSWORD       its export password
#     IOS_PROVISIONING_PROFILE_BASE64
#     IOS_GOOGLE_SERVICE_INFO_PLIST  base64 of ios/GoogleService-Info.plist
#     IOS_SECRETS_XCCONFIG           base64 of ios/mobileAppYC/Secrets.xcconfig
#     APP_STORE_CONNECT_KEY_ID / _ISSUER_ID / _KEY_BASE64   (.p8 API key)
#   Both platforms
#     MOBILE_VARIABLES_LOCAL_TS      base64 of src/config/variables.local.ts,
#                                    which carries appleServiceId, appleRedirectUri,
#                                    googleWebClientId and facebookAppId. It is
#                                    gitignored, and variables.ts falls back to
#                                    templates SILENTLY when CI=true, so a build
#                                    without it uploads working-looking binaries
#                                    whose social sign-in cannot succeed.
#
# An App Store Connect API key is used rather than an Apple ID plus
# app-specific password: it is scopable, revocable, and does not carry a human
# account's full privileges.

name: Mobile release

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to release
        type: choice
        options: [both, android, ios]
        default: both

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap gate. Both stores reject a version that is not higher than the live
  # one, and that failure otherwise surfaces after a full signed build.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes commits, so the default GITHUB_TOKEN does not
          # need to persist in the local git config where later steps or a
          # compromised third-party action could read it. That matters more
          # in this workflow than most, since it also handles signing secrets.
          persist-credentials: false
          # Full history so the main-ancestry check below can see origin/main.
          fetch-depth: 0

      # Releases are cut by merging dev into main and tagging there. The
      # protected `release` environment gates the signing jobs, but approval is a
      # human glancing at a run - it is not a check that the tag points at
      # reviewed code. Without this, any `mobile-v*` tag pushed from any branch
      # reaches a job holding the upload keys and the App Store Connect .p8,
      # which the iOS build's own run-script phases can read. Mirrors the same
      # gate in desktop-release.yml. Throwaway builds belong on
      # workflow_dispatch, which skips this.
      - name: Tag must be on main
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::Could not resolve origin/main to check tag reachability."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '${TAG}' points at ${GITHUB_SHA}, which is not reachable from main."
            echo "::error::Merge the release commit into main and re-tag there, per RELEASING.md."
            echo "::error::For a throwaway test build, run this workflow via workflow_dispatch instead."
            exit 1
          fi
          echo "Tag ${TAG} is reachable from main."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Versions agree across platforms
        run: node scripts/mobile/version.mjs --check
      - name: Report the version being released
        run: |
          VERSION=$(grep -oE 'versionName "[^"]+"' apps/mobileAppYC/android/app/build.gradle | grep -oE '[0-9.]+')
          echo "Releasing mobile version ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android (Play internal)
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'android'
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes commits, so the default GITHUB_TOKEN does not
          # need to persist in the local git config where later steps or a
          # compromised third-party action could read it. That matters more
          # in this workflow than most, since it also handles signing secrets.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These are gitignored by design: they carry Firebase config and signing
      # material. Restore them from secrets for the build only.
      - name: Restore untracked config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          STRINGS_XML: ${{ secrets.ANDROID_STRINGS_XML }}
          VARIABLES_LOCAL_TS: ${{ secrets.MOBILE_VARIABLES_LOCAL_TS }}
        run: |
          cd apps/mobileAppYC
          cp android/gradle.properties.example android/gradle.properties
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          mkdir -p android/app/src/main/res/values
          echo "$STRINGS_XML" | base64 -d > android/app/src/main/res/values/strings.xml
          echo "$VARIABLES_LOCAL_TS" | base64 -d > src/config/variables.local.ts

      # variables.local.ts supplies appleServiceId, appleRedirectUri,
      # googleWebClientId and facebookAppId. Without it the app silently falls
      # back to the templates in variables.ts and ships a build whose social
      # sign-in cannot work, so this must fail the release rather than warn.
      - name: Verify the app config restored
        run: node scripts/mobile/doctor.mjs --require-app-config

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Verify the build can proceed
        run: node scripts/mobile/doctor.mjs
        continue-on-error: true

      - name: Build signed AAB
        working-directory: apps/mobileAppYC/android
        env:
          YC_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          YC_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YC_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YC_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Every run of this workflow gets its own version code. Play rejects
          # a repeat, and recovering from that means re-cutting the tag, which
          # is how the release ends up chasing its own tail. The base sits
          # above the highest code already published by hand.
          VERSION_CODE=$(( 20 + GITHUB_RUN_NUMBER ))
          echo "Building version code ${VERSION_CODE}"
          ./gradlew bundleRelease --no-daemon "-PversionCodeOverride=${VERSION_CODE}"

      # Only a `mobile-v*` tag push publishes. A workflow_dispatch builds and
      # signs, then stops here, so the Android signing chain can be exercised
      # without a Play submission and without burning a version code (Play
      # rejects a repeat, and the run number that produced it is not reusable).
      # This mirrors desktop-release.yml, where the same separation is spelled
      # `--publish ${{ github.event_name == 'push' && 'always' || 'never' }}`.
      # The guard reads `push` rather than the ref because the only push trigger
      # this workflow has is `tags: mobile-v*`; adding a branch trigger above
      # would make it fire on a branch, so add `startsWith(github.ref,
      # 'refs/tags/')` here if that trigger ever changes.
      - name: Upload to Play internal track (tag pushes only)
        if: github.event_name == 'push'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mobileappyc
          releaseFiles: apps/mobileAppYC/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Remove restored secrets
        if: always()
        # Block scalar (`run: |`), not a folded one. Folded, YAML turns each
        # newline into a space, so the trailing backslashes ended up escaping
        # those spaces rather than continuing the line - and every path after
        # the first was passed to rm with a leading space, matching nothing.
        # The restored config files were left on the runner.
        run: |
          rm -f \
            "${RUNNER_TEMP}/release.keystore" \
            apps/mobileAppYC/android/app/google-services.json \
            apps/mobileAppYC/android/app/src/main/res/values/strings.xml \
            apps/mobileAppYC/src/config/variables.local.ts

  ios:
    name: iOS (TestFlight)
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'ios'
    needs: preflight
    # React Native 0.81 requires Xcode >= 16.1 (min_xcode_version_supported in
    # react-native/scripts/cocoapods/helpers.rb). The macos-14 image ships 15.x,
    # so `pod install` aborted with "Please upgrade XCode" before any build ran.
    #
    # This image defaults to Xcode 16.4, which is no longer enough to upload.
    # It also carries Xcode 26, so the Select Xcode step below picks one rather
    # than moving the image out from under a signing path that works.
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes commits, so the default GITHUB_TOKEN does not
          # need to persist in the local git config where later steps or a
          # compromised third-party action could read it. That matters more
          # in this workflow than most, since it also handles signing secrets.
          persist-credentials: false

      # App Store Connect refuses anything built with an older SDK:
      #
      #   SDK version issue. This app was built with the iOS 18.5 SDK. All iOS
      #   and iPadOS apps must be built with the iOS 26 SDK or later, included
      #   in Xcode 26 or later
      #
      # It refuses it at upload rather than at build, so without this the job
      # archives, exports and signs correctly and then throws the result away
      # on the last step, forty minutes in. Selecting the toolchain first means
      # a wrong one fails in seconds instead.
      #
      # 26.3 is the newest Xcode on this image, and is pinned rather than
      # inherited because image defaults move without a workflow edit. It is
      # also deliberately not the newest Xcode that exists: from 26.4 the
      # compiler miscompiles Firebase's `async let` in release builds, and this
      # app is on FirebaseAuth 12.8.0, below the version that works around it.
      # That one would ship rather than fail the build.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: ${SDK}"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "Selected Xcode carries the iOS ${SDK} SDK; uploads need 26 or later." >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore untracked config
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
          SECRETS_XCCONFIG: ${{ secrets.IOS_SECRETS_XCCONFIG }}
          VARIABLES_LOCAL_TS: ${{ secrets.MOBILE_VARIABLES_LOCAL_TS }}
        run: |
          cd apps/mobileAppYC
          echo "$GOOGLE_SERVICE_INFO" | base64 -d > ios/GoogleService-Info.plist
          echo "$SECRETS_XCCONFIG" | base64 -d > ios/mobileAppYC/Secrets.xcconfig
          echo "$VARIABLES_LOCAL_TS" | base64 -d > src/config/variables.local.ts

      # Info.plist references these as $(...) build variables now that it is
      # tracked, and xcodebuild does not fail on an absent one: it substitutes
      # nothing, or the literal placeholder, and the archive succeeds. Checked in
      # a script rather than inline so the empty and placeholder cases are covered
      # by tests; grep alone reports success for "FACEBOOK_APP_ID =".
      - name: Verify the iOS build variables carry real values
        run: node scripts/mobile/check-ios-secrets.mjs

      # See the android job: without this the app ships template social sign-in
      # config, and nothing in the build itself would say so.
      - name: Verify the app config restored
        run: node scripts/mobile/doctor.mjs --require-app-config

      # A dedicated keychain, deleted in cleanup, so the signing identity never
      # persists on the runner beyond this job.
      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE=~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision
          echo "$PROFILE_BASE64" | base64 -d > "$PROFILE"
          rm -f "${RUNNER_TEMP}/cert.p12"

          # Manual signing needs the profile's own name, and the name is inside
          # the CMS envelope rather than the filename. Reading it here means the
          # archive never has to ask Apple which profile to use.
          # A .mobileprovision is a CMS envelope wrapping a plist, and the decode
          # can carry bytes past the plist. Anything read out of it is scrubbed of
          # NUL and control characters before it goes near the environment: a NUL
          # reaching GITHUB_ENV corrupts every later step, and Ruby then fails with
          # "ArgumentError - pathname contains null byte" somewhere unrelated, which
          # is exactly how this presented as a CocoaPods flake.
          clean() { LC_ALL=C tr -d '\000-\037' | LC_ALL=C sed 's/[[:space:]]*$//'; }

          security cms -D -i "$PROFILE" > "${RUNNER_TEMP}/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "${RUNNER_TEMP}/profile.plist" | clean)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${RUNNER_TEMP}/profile.plist" | clean)
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n '1s/.*"\(.*\)".*/\1/p' | clean)
          rm -f "${RUNNER_TEMP}/profile.plist"

          if [ -z "$PROFILE_NAME" ] || [ -z "$IDENTITY" ]; then
            echo "Could not read the provisioning profile name or the signing identity." >&2
            exit 1
          fi
          # Refuse anything with a newline as well. GITHUB_ENV is line based, so a
          # newline in a value silently turns the rest into a separate variable.
          for pair in "PROFILE_NAME=$PROFILE_NAME" "PROFILE_UUID=$PROFILE_UUID" "SIGNING_IDENTITY=$IDENTITY"; do
            if [ "$(printf '%s' "$pair" | wc -l | tr -d ' ')" != "0" ]; then
              echo "A signing value contains a newline; refusing to write it to the environment." >&2
              exit 1
            fi
          done

          echo "Signing as: $IDENTITY"
          echo "Profile:    $PROFILE_NAME ($PROFILE_UUID)"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # CocoaPods fails intermittently in pnpm monorepos with
      # "ArgumentError - pathname contains null byte". It is not deterministic:
      # the same commit installed cleanly on the previous run and failed on the
      # next. Retrying costs a couple of minutes; not retrying costs a whole
      # tagged release, because the tag has to be deleted and re-cut.
      # Podfile.lock is left alone so resolution stays reproducible.
      #
      # On mobile-v1.6.1 all three attempts lost inside about five minutes and
      # the job died. Because GitHub refuses `gh run rerun --failed` while any
      # job in the run is still going, the retry could not even be queued until
      # the Android job finished ~40 minutes later. The re-run then passed on
      # the first attempt, which is the signature of a flake given a wider
      # reset rather than a repo problem.
      #
      # So: five attempts, an exponential backoff, and a reset that also clears
      # the CocoaPods caches. The stack points at Pathname#realdirpath walking
      # pnpm's symlinked layout, and the stale entries the resolver trips over
      # live in those caches, not in Pods/.
      - name: Install pods
        working-directory: apps/mobileAppYC/ios
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if pod install; then
              if [ "$attempt" -gt 1 ]; then
                echo "::notice::pod install recovered on attempt ${attempt}"
              fi
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi
            backoff=$((attempt * 15))
            echo "::warning::pod install failed on attempt ${attempt}/${attempts}, resetting and retrying in ${backoff}s"
            # Podfile.lock is deliberately left alone so resolution stays
            # reproducible; everything derived from it is fair game.
            rm -rf Pods build
            rm -rf ~/Library/Caches/CocoaPods
            rm -rf ~/.cocoapods/repos/trunk/.git/index.lock
            sleep "$backoff"
          done
          echo "pod install failed ${attempts} times; this is no longer the known flake." >&2
          exit 1

      # altool authenticates with this key on the upload. It is written here,
      # ahead of the archive, because the archive used to sign automatically and
      # Manual signing, deliberately. Automatic signing asks App Store Connect to
      # resolve a profile, which returned 401 on listTeams.action and then hunted
      # for an "iOS App Development" profile that a distribution archive should
      # never want. The certificate and the distribution profile are both already
      # installed above, so nothing needs to be fetched at build time.
      # Signing is written into the app target instead of being passed to
      # xcodebuild. Command line build settings reach every target in the
      # workspace, and a Pods framework cannot carry a provisioning profile, so
      # the archive failed with "FirebaseCoreExtension does not support
      # provisioning profiles" on targets that have nothing to sign.
      - name: Point the app target at the release profile
        working-directory: apps/mobileAppYC/ios
        env:
          DEVELOPMENT_TEAM: '9TZWPYQ45S'
        run: |
          if ! ruby -rxcodeproj -e 'nil' 2>/dev/null; then
            gem install xcodeproj --no-document
          fi
          ruby "${GITHUB_WORKSPACE}/scripts/ci/ios-manual-signing.rb" \
            mobileAppYC.xcodeproj mobileAppYC Release

      - name: Archive and export IPA
        working-directory: apps/mobileAppYC/ios
        run: |
          xcodebuild -workspace mobileAppYC.xcworkspace \
            -scheme mobileAppYC \
            -configuration Release \
            -archivePath "${RUNNER_TEMP}/mobileAppYC.xcarchive" \
            archive

          # The committed ExportOptions.plist asks for automatic signing and cannot
          # name the profile, because the name only exists inside the secret. This
          # writes the manual equivalent from what was actually installed.
          EXPORT_PLIST="${RUNNER_TEMP}/ExportOptions.manual.plist"
          cp ExportOptions.plist "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string $SIGNING_IDENTITY" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.yosemitecrew.mobile string $PROFILE_NAME" "$EXPORT_PLIST"

          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/mobileAppYC.xcarchive" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "${RUNNER_TEMP}/export"

      # 1.6.0 shipped an app that died on launch for every user, and CI was
      # green throughout, because nothing ever ran the Release binary. A Debug
      # build would not have caught it either: Debug shows a redbox where
      # Release calls RCTFatal.
      #
      # This builds the same Release configuration for the simulator, launches
      # it, and fails if the process is gone a few seconds later. It runs before
      # the TestFlight upload so a dead build cannot reach a store.
      - name: Smoke test the Release build on a simulator
        working-directory: apps/mobileAppYC/ios
        run: |
          set -euo pipefail
          DD="${RUNNER_TEMP}/smoke-dd"

          xcodebuild -workspace mobileAppYC.xcworkspace \
            -scheme mobileAppYC \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$DD" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$DD/Build/Products/Release-iphonesimulator/mobileAppYC.app"
          test -d "$APP" || { echo "Release simulator build produced no .app" >&2; exit 1; }

          # Every bundled font must be registered in UIAppFonts or iOS ignores
          # it: icon fonts draw "?" boxes and text fonts fall back silently.
          node "${GITHUB_WORKSPACE}/scripts/mobile/doctor.mjs" || true

          UDID=$(xcrun simctl create smoke com.apple.CoreSimulator.SimDeviceType.iPhone-16 || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available -j \
              | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x.get('isAvailable')))")
          fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.yosemitecrew.mobile

          # RCTFatal kills the process within the first render, so a few seconds
          # is enough to tell a launch crash from a slow start.
          sleep 20

          if ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "com.yosemitecrew.mobile"; then
            echo "::error::The Release build is not running 20s after launch. It crashed on startup." >&2
            find ~/Library/Logs/DiagnosticReports -name "mobileAppYC*" -newermt '-5 minutes' \
              -exec echo "--- {} ---" \; -exec head -60 {} \; 2>/dev/null || true
            xcrun simctl shutdown "$UDID" || true
            exit 1
          fi

          echo "Release build survived launch."
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true

      # Deliberately AFTER the archive and export. `-allowProvisioningUpdates`
      # once needed an authenticated App Store Connect session, but the archive
      # signs manually now and does not. Writing the .p8 before the build put a
      # publishing key on disk while xcodebuild ran app and CocoaPods build
      # phases as the same user - any one of which could have read it. Only the
      # upload needs the key, so only the upload runs with it present.
      - name: Provide the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          # A secret pasted with a trailing newline is invisible in the log,
          # because Actions masks the value either way. It reaches the key
          # filename and the JWT that altool signs, and comes back as nothing
          # more specific than "Failed to authenticate for session".
          KEY_ID=$(printf '%s' "$KEY_ID" | LC_ALL=C tr -d '[:space:]')
          if [ -z "$KEY_ID" ]; then
            echo "APP_STORE_CONNECT_KEY_ID is empty." >&2
            exit 1
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "$KEY_BASE64" | base64 -d > "$KEY_PATH"
          # A truncated or mis-encoded secret otherwise surfaces as an opaque
          # signing failure several minutes into the archive.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "APP_STORE_CONNECT_KEY_BASE64 did not decode to a PEM private key." >&2
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      # altool reports an authentication failure as "Failed to authenticate for
      # session" and nothing else, which does not say whether the key is
      # revoked, the issuer id is wrong, or the role cannot upload builds. This
      # asks App Store Connect the same question directly and prints what it
      # answers. It never fails the job: if the credentials are fine the upload
      # is the real test, and if they are not the upload says so too, with less
      # to go on.
      - name: Check the App Store Connect key
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ruby scripts/ci/asc-key-check.rb

      # Same separation as Android above. The steps before this one still run on
      # a dispatch on purpose: importing the certificate, exporting a signed IPA
      # and checking the App Store Connect key all exercise the iOS credentials
      # without submitting anything. Only the upload is a submission.
      - name: Upload to TestFlight (tag pushes only)
        if: github.event_name == 'push'
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ISSUER_ID=$(printf '%s' "$ISSUER_ID" | LC_ALL=C tr -d '[:space:]')
          if [ -z "$ISSUER_ID" ]; then
            echo "APP_STORE_CONNECT_ISSUER_ID is empty." >&2
            exit 1
          fi

          xcrun altool --upload-app -f "${RUNNER_TEMP}/export/mobileAppYC.ipa" \
            -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Remove restored secrets
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision
          rm -f apps/mobileAppYC/ios/GoogleService-Info.plist apps/mobileAppYC/ios/mobileAppYC/Secrets.xcconfig
          rm -f apps/mobileAppYC/src/config/variables.local.ts
