services:
  frontend:
    image: node:20-alpine
    working_dir: /app/apps/frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install && pnpm run dev --port 3000"

  backend:
    image: node:20-alpine  
    working_dir: /app/apps/backend
    ports:
      - "4000:4000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/yosemitecrew
      - PORT=4000
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install && pnpm run dev"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo-data: