apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

// Avoid duplicate androidsvg artifacts (jar + aar) pulled by SVG-capable deps
configurations.all {
    exclude group: "com.caverock", module: "androidsvg"
}

// Patched versions for transitive Maven coordinates flagged by the supply-chain scan.
def pinnedNettyVersion = "4.1.137.Final"
def pinnedProtobufVersion = "3.25.9"
def pinnedPlayServicesBasementVersion = "18.5.0"
def pinnedOkioVersion = "3.9.1"

// AGP builds its Unified Test Platform classpaths itself and drags netty 4.1.93/4.1.110
// and protobuf 3.22/3.24 in through grpc-netty and the test platform artifacts, so these
// pins cannot be declared as ordinary dependency constraints and are applied per
// configuration instead. Both rules stay inside their major line so a future dependency
// asking for netty 4.2.x or protobuf 4.x is left alone rather than silently downgraded.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "io.netty" && details.requested.version?.startsWith("4.1.")) {
            details.useVersion pinnedNettyVersion
            details.because "netty 4.1.x codec/http2/handler advisories reported against the locked test-platform classpath"
        }
        if (details.requested.group == "com.google.protobuf" && details.requested.version?.startsWith("3.")) {
            details.useVersion pinnedProtobufVersion
            details.because "CVE-2024-7254 affects protobuf-java and protobuf-kotlin below 3.25.5"
        }
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def hermesEnabled = (project.findProperty("hermesEnabled") ?: "true").toString()
project.ext.set("hermesEnabled", hermesEnabled)

def resolveReleaseProp(String name, Object defaultValue = null) {
    return System.getenv(name) ?: project.findProperty(name) ?: defaultValue
}

def isReleaseSigningRequired() {
    def taskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
    return taskNames.any { task ->
        // Generic aggregate tasks can produce release artifacts.
        if (task == "assemble" || task == "build") {
            return true
        }

        // Explicit release artifact tasks (e.g., assembleRelease, bundleProdRelease, publishReleaseBundle).
        def isArtifactTask = task.contains("assemble") ||
            task.contains("bundle") ||
            task.contains("publish") ||
            task.contains("package") ||
            task.contains("install")

        return isArtifactTask && task.contains("release")
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mobileappyc"
    defaultConfig {
        applicationId "com.mobileappyc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "1.6.2"
        manifestPlaceholders = [
            MAPS_API_KEY: localProperties['MAPS_API_KEY'] ?: System.getenv('MAPS_API_KEY') ?: ''
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def storeFilePath = resolveReleaseProp('YC_RELEASE_STORE_FILE', 'my-release-key.keystore')
            def storePass = resolveReleaseProp('YC_RELEASE_STORE_PASSWORD')
            def keyAliasVal = resolveReleaseProp('YC_RELEASE_KEY_ALIAS')
            def keyPass = resolveReleaseProp('YC_RELEASE_KEY_PASSWORD')

            if (!storeFilePath || !storePass || !keyAliasVal || !keyPass) {
                if (isReleaseSigningRequired()) {
                    throw new GradleException(
                        "Release signing properties missing. " +
                        "Set YC_RELEASE_STORE_FILE, YC_RELEASE_STORE_PASSWORD, YC_RELEASE_KEY_ALIAS, YC_RELEASE_KEY_PASSWORD " +
                        "in your environment or gradle.properties (e.g., ~/.gradle/gradle.properties)."
                    )
                }

                // Allow non-release tasks (e.g., clean/lint/test) without local release secrets.
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                return
            }

            storeFile file(storeFilePath)
            storePassword storePass
            keyAlias keyAliasVal
            keyPassword keyPass
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    constraints {
        // The instrumentation-test classpath resolves older copies of two libraries the app
        // itself already ships at these versions, so aligning it introduces no version skew.
        androidTestImplementation("com.google.android.gms:play-services-basement:$pinnedPlayServicesBasementVersion") {
            because "GHSA-cm6r-892j-jv2g affects play-services-basement below 18.0.2"
        }
        androidTestImplementation("com.squareup.okio:okio:$pinnedOkioVersion") {
            because "CVE-2023-3635 affects okio below 3.4.0"
        }
    }

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'
    implementation project(':react-native-fbsdk-next')
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-messaging'

    // AndroidX Core for edge-to-edge support
    implementation 'androidx.core:core-ktx:1.15.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Play refuses a version code it has already accepted, so re-cutting a release
// tag has to produce a new one. CI passes versionCodeOverride for that.
//
// The assignment is here rather than inside defaultConfig on purpose: the
// literal above has to stay a literal, because scripts/mobile/version.mjs both
// reads and rewrites it with a `versionCode <number>` pattern, and a ternary in
// its place stops the release preflight dead with "could not read
// versionCode/versionName from build.gradle".
if (project.hasProperty('versionCodeOverride')) {
    android.defaultConfig.versionCode = project.versionCodeOverride.toInteger()
}

// Bundle the react-native-vector-icons glyph fonts used by the warm-bone UI
// (Ionicons for the redesigned screens, MaterialIcons for chat) so icons render
// on Android instead of tofu boxes.
project.ext.vectoricons = [
    iconFontNames: ['Ionicons.ttf', 'MaterialIcons.ttf']
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
