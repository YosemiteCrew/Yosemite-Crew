<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; font-src file:; style-src file:; script-src file:;"
    />
    <title>Command Palette</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="command-palette.css" />
  </head>
  <body>
    <div class="cp-search">
      <svg
        class="cp-search-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="M20 20l-3.2-3.2" />
      </svg>
      <input
        id="search"
        type="text"
        placeholder="Search patients, actions, and commands…"
        aria-label="Search commands"
        autofocus
        spellcheck="false"
      />
      <span class="cp-esc">esc</span>
    </div>
    <div id="results"></div>
    <div class="cp-footer">
      <span class="cp-hint"><span class="cp-key">↑↓</span>Navigate</span>
      <span class="cp-hint"><span class="cp-key">↵</span>Open</span>
      <span class="cp-foot-note">Desktop commands included</span>
    </div>

    <script src="command-palette.js"></script>
  </body>
</html>
