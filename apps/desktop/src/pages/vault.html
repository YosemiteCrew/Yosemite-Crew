<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file: data: blob:; font-src file:; style-src file:; script-src file:;"
    />
    <title>Document Vault — Yosemite Crew PIMS</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="vault.css" />
  </head>
  <body>
    <div class="vault-main">
      <div class="header">
        <div class="header-top">
          <h1>All documents</h1>
          <span class="badge badge-unknown" id="encBadge">checking…</span>
          <span class="header-meta">
            <span id="docCount">0 documents</span>
            <span class="dot-sep">·</span>
            <span id="sizeInfo">0 KB</span>
          </span>
        </div>
        <div class="search-row">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.2-3.2" />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search by filename…"
            autocomplete="off"
            aria-label="Search documents by filename"
          />
          <span id="searchCount" class="search-count"></span>
        </div>
        <div class="drop-zone" id="dropZone">Drop files here to add them to the vault</div>
      </div>

      <div class="list-wrap" id="listWrap">
        <div class="loading" id="loadingMsg">Loading documents</div>
        <div class="empty hidden" id="emptyMsg">
          <div class="empty-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
              <path d="M14 3v5h5" />
            </svg>
          </div>
          <div class="empty-title">No documents in the vault</div>
          <div class="empty-hint">Drag files here or use the command palette to save documents</div>
        </div>
        <div id="docList"></div>
      </div>
    </div>

    <div class="preview-panel" id="previewPanel">
      <div class="preview-head">
        <h2 id="previewTitle">Preview</h2>
        <button class="preview-close" id="previewClose" aria-label="Close preview">&times;</button>
      </div>
      <div class="preview-body" id="previewBody">
        <img id="previewImg" class="hidden" alt="preview" />
        <div class="preview-text hidden" id="previewText"></div>
        <div class="preview-meta" id="previewMeta"></div>
        <div class="preview-actions">
          <button id="previewExport" class="preview-primary">Export…</button>
          <button id="previewReveal" class="preview-ghost">Reveal in Finder</button>
          <button id="previewDel" class="preview-danger">Delete</button>
        </div>
      </div>
    </div>

    <script src="vault.js"></script>
  </body>
</html>
