<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Yosemite Crew — Tab bar</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="tabbar.css" />
    <style>
      /* tokens.css gives every page an opaque --page background. This one is a
         WebContentsView stacked OVER the workspace, and while an overlay is
         open it covers the whole window - so an opaque body painted a flat
         colour where the dimmed page should have been (issue #3289). The strip
         itself still paints its own background, so only what is NOT the strip
         is see-through. */
      body {
        background: transparent;
      }
      /* Both overlays are real modal dialogs. showModal() supplies what the
         page used to lack and could not convincingly fake: focus moves into the
         dialog, Tab is trapped inside it, Escape raises `cancel`, and the top
         layer lifts it above the strip without a z-index ladder. The dim is
         ::backdrop rather than a wrapper element, which also means a click on
         it reports the dialog itself as the event target. */
      #tab-search-dialog::backdrop,
      #cheatsheet-dialog::backdrop {
        background: var(--sh28);
      }
      /* Restores the UA's own `dialog:not([open]) { display: none }`. An author
         rule outranks the UA stylesheet whatever the specificity, so the
         `display: flex` each panel needs while open was keeping BOTH of them
         painted permanently once they stopped being wrapped in a hidden div.
         Measured: with this rule removed, the shortcut list and the search box
         are both on screen with nothing open. */
      dialog:not([open]) {
        display: none;
      }
      .ts-panel {
        position: fixed;
        top: 8px;
        /* The UA dialog stylesheet sets every inset - left: 0 on any dialog and
           top/bottom: 0 once it is modal. Left un-reset, the fixed width and
           height over-constrain those insets and the panel snaps to the corner,
           so each one this panel does not want is put back to auto by hand. */
        left: auto;
        right: 12px;
        bottom: auto;
        width: 460px;
        max-height: calc(100vh - 24px);
        background: var(--glass-93);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--hairline-soft);
        border-radius: var(--radius-lg);
        box-shadow: 0 24px 60px var(--sh28);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-family: var(--font-satoshi);
        margin: 0;
        padding: 0;
        color: var(--ink-body);
      }
      .ts-search {
        padding: 10px;
        border-bottom: 1px solid var(--hairline-soft);
      }
      .ts-search input {
        width: 100%;
        font: inherit;
        font-size: 14px;
        padding: 9px 12px;
        color: var(--ink);
        background: var(--field-bg);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-sm);
        outline: none;
      }
      .ts-search input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 2px var(--nav-active-bg);
      }
      .ts-list {
        overflow-y: auto;
        padding: 6px;
      }
      .ts-section {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--ink-faint);
        padding: 10px 10px 4px;
      }
      .ts-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
      }
      .ts-item:hover {
        background: var(--nav-active-bg);
      }
      .ts-item.sel {
        background: var(--nav-active-bg);
        box-shadow: inset 0 0 0 1px var(--blue-soft);
      }
      .ts-item:hover .lbl,
      .ts-item.sel .lbl {
        color: var(--ink);
      }
      .ts-item .ic {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        opacity: 0.85;
        color: var(--ink-muted);
      }
      .ts-item .lbl {
        flex: 1;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ts-item .x {
        opacity: 0.55;
        font-size: 15px;
        padding: 0 4px;
        border: none;
        background: none;
        cursor: pointer;
        color: var(--ink-faint);
      }
      .ts-item .x:hover {
        opacity: 1;
      }
      .ts-item .hint {
        font-size: 11px;
        color: var(--ink-faint);
      }
      .ts-empty {
        padding: 18px;
        text-align: center;
        color: var(--ink-faint);
        font-size: 13px;
      }
      /* The live region carries the result count to a screen reader. Typing in
         the filter changes the list without moving focus, so nothing else in
         the panel announces that the matches changed. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      /* ── Cheatsheet overlay ── */
      .cs-panel {
        position: fixed;
        top: 50%;
        left: 50%;
        /* As with .ts-panel: the UA's dialog insets are reset, not relied on. */
        right: auto;
        bottom: auto;
        transform: translate(-50%, -50%);
        width: 520px;
        max-height: 80vh;
        background: var(--glass-93);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--hairline-soft);
        border-radius: var(--radius-lg);
        box-shadow: 0 40px 90px var(--sh28);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-family: var(--font-satoshi);
        margin: 0;
        padding: 0;
        color: var(--ink-body);
      }
      .cs-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 15px;
        font-weight: 700;
        padding: 14px 18px;
        border-bottom: 1px solid var(--hairline-soft);
        color: var(--ink);
      }
      /* Escape closes the panel, but a keyboard user who arrives by Tab and a
         pointer user on a touchpad both need a control they can see. */
      .cs-close {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--ink-faint);
        font: inherit;
        font-size: 16px;
        font-weight: 400;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }
      .cs-close:hover {
        background: var(--pill-raised);
        color: var(--ink);
      }
      .cs-body {
        padding: 10px 18px 18px;
        overflow-y: auto;
      }
      .cs-group {
        margin-top: 14px;
      }
      .cs-group:first-child {
        margin-top: 0;
      }
      .cs-group-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--ink-faint);
        margin-bottom: 6px;
      }
      .cs-row {
        display: flex;
        align-items: center;
        padding: 5px 0;
        font-size: 13px;
      }
      .cs-key {
        display: inline-block;
        min-width: 80px;
        padding: 2px 8px;
        background: var(--pill-raised);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 600;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--ink);
        text-align: center;
        margin-right: 14px;
      }
      .cs-desc {
        color: var(--ink-body);
      }

      /* ── Sync status badge ── */
      #sync-badge {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        margin: 0 6px;
        transition: background 0.3s;
      }
      /* One rule per SyncState in src/sync/sync-status.ts. `idle` is the healthy
         state and MUST stay here: an unstyled class draws no dot at all, which
         is how the "everything is synced" signal went missing. */
      #sync-badge.idle {
        background: var(--color-success-bright);
      }
      #sync-badge.pending {
        background: var(--color-warning-600);
        animation: sync-pulse 1.2s ease-in-out infinite;
      }
      #sync-badge.offline {
        background: var(--color-danger-600);
      }
      #sync-badge.error {
        background: var(--color-danger-600);
      }
      #sync-badge.not-ready {
        background: var(--color-neutral-500);
      }
      #sync-badge.blocked {
        background: var(--color-neutral-500);
      }
      @keyframes sync-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <div id="tabbar">
      <div id="tab-strip" class="tab-strip" role="tablist" aria-label="Tabs"></div>
      <div class="drag-spacer" aria-hidden="true"></div>
      <div class="tabbar-trailing">
        <button
          id="search-tabs-btn"
          class="tab-action-btn"
          aria-label="Search tabs"
          data-shortcut-title="Search tabs"
          data-shortcut="Mod+Shift+Y"
        >
          <!-- Satoshi has no glyph for U+2315, so the character the button used
               fell back to a ~7px system one. Same SVG as vault.html and
               command-palette.html. -->
          <svg
            class="tab-action-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.2-3.2" />
          </svg>
        </button>
        <button
          id="new-tab-btn"
          class="tab-action-btn"
          aria-label="New tab"
          data-shortcut-title="New tab"
          data-shortcut="Mod+T"
        >
          +
        </button>
        <!-- <output> rather than a div with role="status": it carries the
             implicit status role and is announced on devices where the bare
             ARIA role is not. -->
        <output
          id="sync-badge"
          class="not-ready"
          title="Initializing"
          aria-label="Sync: Initializing"
        ></output>
      </div>
      <div id="win-caption" class="win-caption">
        <button id="win-min" class="win-btn" type="button" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5h8" /></svg>
        </button>
        <button id="win-max" class="win-btn" type="button" aria-label="Maximize" title="Maximize">
          <svg data-glyph="maximize" viewBox="0 0 12 12" aria-hidden="true">
            <rect x="2.5" y="2.5" width="7" height="7" />
          </svg>
          <svg data-glyph="restore" viewBox="0 0 12 12" aria-hidden="true" hidden>
            <rect x="2.5" y="4.5" width="5" height="5" />
            <path d="M4.5 4.5V2.5h5v5h-2" />
          </svg>
        </button>
        <button
          id="win-close"
          class="win-btn win-close"
          type="button"
          aria-label="Close"
          title="Close"
        >
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
        </button>
      </div>
    </div>

    <div id="tab-preview" class="tab-preview" style="display: none">
      <img id="tab-preview-img" alt="" />
    </div>

    <dialog id="tab-search-dialog" class="ts-panel" aria-label="Search tabs">
      <div class="ts-search">
        <input
          id="ts-input"
          type="text"
          placeholder="Search tabs…"
          spellcheck="false"
          autocomplete="off"
          aria-label="Search tabs"
          role="combobox"
          aria-expanded="true"
          aria-controls="ts-list"
          aria-autocomplete="list"
        />
      </div>
      <div id="ts-list" class="ts-list" role="listbox" aria-label="Matching tabs"></div>
      <output id="ts-status" class="sr-only" aria-live="polite"></output>
    </dialog>

    <dialog id="cheatsheet-dialog" class="cs-panel" aria-label="Keyboard shortcuts">
      <div class="cs-header">
        <span>Keyboard Shortcuts</span>
        <button id="cs-close" class="cs-close" type="button" aria-label="Close keyboard shortcuts">
          ×
        </button>
      </div>
      <div class="cs-body">
        <div class="cs-group">
          <div class="cs-group-title">Tabs</div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+T"></span><span class="cs-desc">New tab</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+W"></span><span class="cs-desc">Close tab</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+Shift+T"></span
            ><span class="cs-desc">Reopen closed tab</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+Shift+Y"></span
            ><span class="cs-desc">Search tabs</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+1-9"></span
            ><span class="cs-desc">Jump to tab</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+Shift+E"></span
            ><span class="cs-desc">Toggle vertical tabs</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+Shift+\"></span
            ><span class="cs-desc">Split view</span>
          </div>
        </div>
        <div class="cs-group">
          <div class="cs-group-title">Navigation</div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+Shift+H"></span
            ><span class="cs-desc">Home</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+Shift+B"></span
            ><span class="cs-desc">Open in browser</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+K"></span
            ><span class="cs-desc">Command palette</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+F"></span
            ><span class="cs-desc">Find in page</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+G"></span><span class="cs-desc">Find next</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+Shift+G"></span
            ><span class="cs-desc">Find previous</span>
          </div>
        </div>
        <div class="cs-group">
          <div class="cs-group-title">Window</div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+P"></span><span class="cs-desc">Print</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+,"></span
            ><span class="cs-desc">Preferences</span>
          </div>
          <div class="cs-row">
            <span class="cs-key" data-shortcut="Mod+/"></span
            ><span class="cs-desc">Keyboard shortcuts</span>
          </div>
        </div>
      </div>
    </dialog>

    <script src="platform-labels.js"></script>
    <script src="tab-indicators.js"></script>
    <script src="tabbar-a11y.js"></script>
    <script src="tab-strip-diff.js"></script>
    <script src="tab-row.js"></script>
    <script src="window-caption.js"></script>
    <script src="tab-preview-position.js"></script>
    <script>
      const tabStrip = document.getElementById('tab-strip');
      const newTabBtn = document.getElementById('new-tab-btn');
      const yc = globalThis.ycDesktop;

      const state = { tabs: [], activeId: null, splitId: null, closedStack: [] };
      let dragSrcId = null;
      let dragDropped = false;

      // One reading of the host for every platform-dependent label and layout
      // decision on this page: the preload's value when it is there, the user
      // agent only as a fallback.
      const platform = ycPlatformLabels.detectPlatform(yc, navigator.userAgent);
      const isMac = platform === 'darwin';

      // Where the macOS traffic lights need room depends on the orientation, and
      // the orientation changes at runtime, so the host is published as an
      // attribute for the stylesheet to answer rather than being baked into an
      // inline padding here.
      document.getElementById('tabbar').dataset.platform = platform;

      // Windows and Linux have neither the Command key nor its glyph, so the
      // tab-bar tooltips and the cheat sheet are written as neutral
      // accelerators in the markup and named for the host here.
      for (const el of document.querySelectorAll('[data-shortcut]')) {
        const prefix = el.dataset.shortcutTitle;
        if (prefix) {
          const named = ycPlatformLabels.shortcut(el.dataset.shortcut, platform, 'name');
          el.title = prefix + ' (' + named + ')';
        } else {
          el.textContent = ycPlatformLabels.shortcut(el.dataset.shortcut, platform, 'symbol');
        }
      }

      const send = (method, ...args) => {
        if (yc && typeof yc[method] === 'function') return yc[method](...args);
        return Promise.resolve(null);
      };

      // Everything this page draws on top of the workspace - the tab search
      // panel, the shortcut list, the hover thumbnail - lives inside the tab
      // bar's own WebContentsView, which is 40px tall horizontally and 240px
      // wide vertically. Anything bigger was simply cut off (issue #3289).
      //
      // So there is ONE rule for all of them rather than one per feature: while
      // any overlay is open the main process grows this view to the whole
      // window, in either orientation. The view is transparent, so the page
      // behind stays visible under each overlay's own scrim.
      const overlaysOpen = { search: false, cheatsheet: false, preview: false };
      const syncChromeOverlay = () => {
        send(
          'setChromeOverlay',
          overlaysOpen.search || overlaysOpen.cheatsheet || overlaysOpen.preview
        );
      };
      const setOverlayOpen = (name, open) => {
        if (overlaysOpen[name] === open) return;
        overlaysOpen[name] = open;
        syncChromeOverlay();
      };
      const isVertical = () => document.getElementById('tabbar').dataset.orientation === 'vertical';

      // Manual window drag. The tab bar lives in a child WebContentsView where
      // `-webkit-app-region: drag` is all-or-nothing (it would make the tabs and
      // controls undraggable-but-unclickable), so the empty filler streams pointer
      // deltas to the main process to move the frameless window itself.
      const dragSpacer = document.querySelector('.drag-spacer');
      if (dragSpacer && yc && typeof yc.windowDragBy === 'function') {
        let dragging = false;
        let lastX = 0;
        let lastY = 0;
        dragSpacer.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          dragging = true;
          lastX = e.screenX;
          lastY = e.screenY;
          dragSpacer.setPointerCapture(e.pointerId);
        });
        dragSpacer.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          const dx = e.screenX - lastX;
          const dy = e.screenY - lastY;
          lastX = e.screenX;
          lastY = e.screenY;
          if (dx || dy) yc.windowDragBy(dx, dy);
        });
        const endDrag = (e) => {
          if (!dragging) return;
          dragging = false;
          try {
            dragSpacer.releasePointerCapture(e.pointerId);
          } catch {
            /* pointer already released */
          }
        };
        dragSpacer.addEventListener('pointerup', endDrag);
        dragSpacer.addEventListener('pointercancel', endDrag);
      }

      // Native title bars toggle maximise on a double-click of their empty
      // area. The pointer-drag above swallows the two clicks, so this has to be
      // its own listener rather than a count inside endDrag.
      if (dragSpacer) {
        dragSpacer.addEventListener('dblclick', () => send('windowToggleMaximize'));
      }

      // The right-click menu is native (see the yc:tab-context-menu handler): the
      // page's own <div> menu was clipped to the 40px chrome view and unusable.
      // Main pushes the chosen item back here and the tab bar performs it
      // through the same tab IPC its own buttons use.
      const tabContextActions = {
        duplicate: (id) => send('duplicateTab', id),
        pin: (id) => send('pinTab', id, true),
        unpin: (id) => send('pinTab', id, false),
        close: (id) => send('closeTab', id),
        'close-others': (id) => {
          state.tabs.forEach((t) => {
            if (t.id !== id) send('closeTab', t.id);
          });
        },
        'close-right': (id) => {
          const idx = state.tabs.findIndex((t) => t.id === id);
          state.tabs.slice(idx + 1).forEach((t) => send('closeTab', t.id));
        },
        'reopen-closed': () => send('reopenClosedTab'),
      };

      if (yc && typeof yc.onTabContextAction === 'function') {
        yc.onTabContextAction((payload) => {
          // Own-property only: a plain index would resolve 'constructor' and
          // friends off Object.prototype into something callable.
          if (!payload || !Object.hasOwn(tabContextActions, payload.action)) return;
          tabContextActions[payload.action](payload.tabId);
        });
      }

      const wireTabDrag = (div, tab) => {
        div.addEventListener('dragstart', (e) => {
          dragSrcId = tab.id;
          dragDropped = false;
          e.dataTransfer.effectAllowed = 'move';
          div.classList.add('tab--dragging');
        });

        div.addEventListener('dragend', () => {
          if (dragSrcId && !dragDropped) {
            send('detachTab', dragSrcId);
          }
          dragSrcId = null;
          document
            .querySelectorAll('.tab--drag-over')
            .forEach((el) => el.classList.remove('tab--drag-over'));
          document
            .querySelectorAll('.tab--dragging')
            .forEach((el) => el.classList.remove('tab--dragging'));
        });

        div.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        div.addEventListener('dragenter', (e) => {
          e.preventDefault();
          if (dragSrcId !== tab.id) div.classList.add('tab--drag-over');
        });

        div.addEventListener('dragleave', () => {
          div.classList.remove('tab--drag-over');
        });

        div.addEventListener('drop', (e) => {
          e.preventDefault();
          div.classList.remove('tab--drag-over');
          if (dragSrcId && dragSrcId !== tab.id) {
            dragDropped = true;
            const toIndex = state.tabs.findIndex((t) => t.id === tab.id);
            send('moveTab', dragSrcId, toIndex);
          }
        });
      };

      const buildTabInner = (tab) => {
        const inner = document.createElement('div');
        inner.className = 'tab-inner';

        if (tab.loading) {
          const spinner = document.createElement('span');
          spinner.className = 'tab-spinner';
          inner.appendChild(spinner);
        } else if (tab.favicon) {
          const img = document.createElement('img');
          img.className = 'tab-favicon';
          img.src = tab.favicon;
          img.alt = '';
          img.onerror = () => {
            img.style.display = 'none';
          };
          inner.appendChild(img);
        }

        const label = document.createElement('span');
        label.className = 'tab-label';
        label.textContent = tab.title;
        inner.appendChild(label);

        if (tab.error || tab.offline) {
          const badge = document.createElement('span');
          badge.className = 'tab-badge ' + (tab.error ? 'tab-badge--error' : 'tab-badge--offline');
          badge.textContent = tab.error ? '!' : '\u26A0';
          inner.appendChild(badge);
        }

        if (tab.audible) {
          const audio = document.createElement('span');
          audio.className = 'tab-audio' + (tab.muted ? ' tab-audio--muted' : '');
          audio.textContent = tab.muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
          audio.title = tab.muted ? 'Unmute tab' : 'Mute tab';
          audio.addEventListener('click', (e) => {
            e.stopPropagation();
            send('toggleTabMute', tab.id);
          });
          inner.appendChild(audio);
        }

        return inner;
      };

      // The hovered tab's box, kept so the thumbnail can be re-placed whenever
      // the view's size changes - which it does immediately after the preview
      // opens, because opening it is what grows the view.
      let previewRect = null;

      const placePreview = () => {
        const preview = document.getElementById('tab-preview');
        if (!previewRect) return;
        const viewport = { width: window.innerWidth, height: window.innerHeight };
        // Before the main process has grown the view the viewport IS the 40px
        // strip (or the 240px rail), and there is nowhere in it a 320x200
        // thumbnail fits. Stay hidden rather than flash one over the tabs; the
        // resize that the growth produces runs this again.
        if (
          viewport.width < ycTabPreviewPosition.WIDTH ||
          viewport.height < ycTabPreviewPosition.HEIGHT
        ) {
          preview.style.display = 'none';
          return;
        }
        const at = ycTabPreviewPosition.previewPosition(
          previewRect,
          viewport,
          isVertical() ? document.getElementById('tabbar').offsetWidth : 0
        );
        preview.style.left = at.left + 'px';
        preview.style.top = at.top + 'px';
        preview.style.display = 'block';
      };
      window.addEventListener('resize', placePreview);

      const hidePreview = () => {
        previewRect = null;
        document.getElementById('tab-preview').style.display = 'none';
        setOverlayOpen('preview', false);
      };

      const showPreview = (rect, dataUrl) => {
        document.getElementById('tab-preview-img').src = dataUrl;
        previewRect = rect;
        setOverlayOpen('preview', true);
        placePreview();
      };

      const wireTabHoverPreview = (div, tab) => {
        let previewTimer = null;
        div.addEventListener('mouseenter', () => {
          if (previewTimer) clearTimeout(previewTimer);
          previewTimer = setTimeout(async () => {
            const rect = div.getBoundingClientRect();
            const result = await send('getTabPreview', tab.id);
            if (result && result.ok && result.dataUrl) showPreview(rect, result.dataUrl);
          }, 600);
        });
        div.addEventListener('mouseleave', () => {
          if (previewTimer) clearTimeout(previewTimer);
          hidePreview();
        });
      };

      // Which tab holds the strip's single tab stop. Arrow keys move focus
      // without activating (activating swaps a whole view, so doing it on every
      // arrow press would navigate the user through every tab they pass), which
      // means the entry point has to follow focus and not selection.
      let focusedTabId = null;
      const entryTabId = () => {
        const stillOpen = state.tabs.some((t) => t.id === focusedTabId);
        return stillOpen ? focusedTabId : state.activeId;
      };

      // Named so as not to shadow window.orientation, which still exists here.
      const stripOrientation = () => document.getElementById('tabbar').dataset.orientation;

      const focusTabAt = (index) => {
        const el = tabStrip.children[index];
        if (el) el.focus();
      };

      const onTabKeydown = (e) => {
        // Mod-held keys are the window-wide shortcuts handled on document.
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const id = e.currentTarget.dataset.tabId;
        const index = state.tabs.findIndex((t) => t.id === id);
        if (index < 0) return;
        const action = ycTabbarA11y.keyAction(e.key, stripOrientation());
        if (!action) return;
        e.preventDefault();
        if (action === 'activate') {
          send('activateTab', id);
          return;
        }
        if (action === 'close') {
          send('closeTab', id);
          return;
        }
        const next = ycTabbarA11y.moveIndex(action, index, state.tabs.length);
        if (next !== null) focusTabAt(next);
      };

      const renderTab = (tab) => {
        const div = document.createElement('div');
        div.setAttribute('role', 'tab');
        div.dataset.tabId = tab.id;
        div.setAttribute('draggable', 'true');

        wireTabDrag(div, tab);
        div.appendChild(ycTabRow.buildRow((tabId) => send('toggleTabMute', tabId)));

        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'tab-close-btn';
        // Deliberately out of the sequential tab order: with eight tabs open,
        // Tab would otherwise walk eight close buttons - most of them invisible
        // - before leaving the strip. The keyboard route to closing a tab is
        // Delete on the focused tab. It still takes focus on click, which is
        // what the :focus-within rule in tabbar.css is for.
        closeBtn.tabIndex = -1;
        closeBtn.textContent = '\u00D7';
        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          send('closeTab', tab.id);
        });
        div.appendChild(closeBtn);

        div.addEventListener('click', () => send('activateTab', tab.id));
        div.addEventListener('dblclick', () => send('closeTab', tab.id));
        div.addEventListener('keydown', onTabKeydown);
        div.addEventListener('focus', () => {
          focusedTabId = tab.id;
        });

        div.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          send('showTabContextMenu', tab.id);
        });

        wireTabHoverPreview(div, tab);

        return div;
      };

      const updateTab = (div, tab) => {
        const active = tab.id === state.activeId;
        const split = tab.id === state.splitId;
        div.className =
          'tab' +
          (active ? ' tab--active' : '') +
          (tab.pinned ? ' tab--pinned' : '') +
          (split ? ' tab--split' : '');
        div.setAttribute('aria-selected', String(active));
        div.tabIndex = ycTabbarA11y.rovingTabIndex(state.tabs, entryTabId(), tab.id);
        const name = ycTabbarA11y.tabName(tab);
        div.title = name;
        // A pinned tab renders no text and the split tab's only other marker is
        // a colour, so both need the name spelled out. Per poll, not per build:
        // a tab can be pinned or split long after its row exists.
        div.setAttribute('aria-label', split ? name + ' (split view)' : name);
        div.lastElementChild.setAttribute('aria-label', ycTabbarA11y.closeLabel(tab));
        ycTabRow.updateRow(div.firstElementChild, tab);
      };

      const render = (newState) => {
        state.tabs = newState.tabs || [];
        state.activeId = newState.activeId;
        state.closedStack = newState.closedStack || [];
        state.splitId = newState.splitId || null;
        if (newState.orientation) {
          document.getElementById('tabbar').dataset.orientation = newState.orientation;
        }

        // Reconcile rather than rebuild. Clearing innerHTML destroyed whatever
        // had keyboard focus in the strip within a second of it getting there.
        const byId = new Map();
        for (const el of tabStrip.children) byId.set(el.dataset.tabId, el);
        const plan = ycTabStripDiff.plan(
          [...byId.keys()],
          state.tabs.map((t) => t.id)
        );
        for (const id of plan.remove) {
          byId.get(id).remove();
          byId.delete(id);
        }
        for (const step of plan.insert) {
          let el = byId.get(step.id);
          if (!el) {
            el = renderTab(state.tabs.find((t) => t.id === step.id));
            byId.set(step.id, el);
          }
          tabStrip.insertBefore(el, step.before ? byId.get(step.before) : null);
        }
        for (const tab of state.tabs) updateTab(byId.get(tab.id), tab);

        if (searchOpen) renderSearch();
      };

      const updateSyncBadge = async () => {
        try {
          const res = await send('getSyncStatus');
          if (!res || !res.status) return;
          const badge = document.getElementById('sync-badge');
          if (!badge) return;
          const view = ycTabIndicators.syncBadge(res.status.state || 'not-ready');
          badge.className = view.className;
          badge.title = view.label;
          badge.setAttribute('aria-label', view.ariaLabel);
        } catch {
          /* ignore sync poll errors */
        }
      };

      const poll = async () => {
        try {
          const result = await send('getTabs');
          if (result && typeof result === 'object' && 'ok' in result) {
            render(result);
          }
        } catch {
          /* ignore polling errors */
        }
        updateSyncBadge();
      };

      newTabBtn.addEventListener('click', () => send('newTab'));

      const cycleActiveTab = (backward) => {
        if (state.tabs.length <= 1) return;
        const idx = state.tabs.findIndex((t) => t.id === state.activeId);
        const next = backward
          ? (idx - 1 + state.tabs.length) % state.tabs.length
          : (idx + 1) % state.tabs.length;
        send('activateTab', state.tabs[next].id);
      };

      // Mod+1..9 is deliberately absent: the main process claims it for every view
      // through before-input-event, so a copy here would be unreachable.
      document.addEventListener('keydown', (e) => {
        // All tab shortcuts require the platform modifier; bail early otherwise so
        // each branch below stays flat (keeps cognitive complexity low).
        if (!(e.metaKey || e.ctrlKey)) return;
        const key = e.key;
        if (key === 't' && !e.shiftKey) {
          e.preventDefault();
          send('newTab');
        } else if (key === 't' && e.shiftKey) {
          e.preventDefault();
          send('reopenClosedTab');
        } else if (key === 'w') {
          e.preventDefault();
          if (state.activeId) send('closeTab', state.activeId);
        } else if (key === 'Tab') {
          e.preventDefault();
          cycleActiveTab(e.shiftKey);
        }
      });

      // ── Figma-style tab search panel ──
      const tsDialog = document.getElementById('tab-search-dialog');
      const tsInput = document.getElementById('ts-input');
      const tsList = document.getElementById('ts-list');
      const tsStatus = document.getElementById('ts-status');
      let searchOpen = false;
      let tsSel = 0;
      let tsRows = []; // flattened selectable rows: { kind:'open'|'closed', tab }

      const matches = (q, text) => !q || (text || '').toLowerCase().includes(q.toLowerCase());

      const renderSearch = () => {
        const q = tsInput.value.trim();
        const open = state.tabs.filter((t) => matches(q, t.title) || matches(q, t.url));
        const closed = (state.closedStack || []).filter(
          (t) => matches(q, t.title) || matches(q, t.url)
        );
        tsRows = [];
        let html = '';
        if (open.length) {
          html += '<div class="ts-section">Tabs in this window</div>';
          open.forEach((t) => {
            const i = tsRows.length;
            tsRows.push({ kind: 'open', tab: t });
            html +=
              '<div class="ts-item" role="option" id="ts-item-' +
              i +
              '" data-i="' +
              i +
              '">' +
              '<span class="ic" aria-hidden="true">' +
              (t.id === state.activeId ? '●' : '○') +
              '</span>' +
              '<span class="lbl"></span><button class="x" type="button" tabindex="-1" data-close="' +
              t.id +
              '">×</button></div>';
          });
        }
        if (closed.length) {
          html += '<div class="ts-section">Recently closed tabs</div>';
          closed.forEach((t) => {
            const i = tsRows.length;
            tsRows.push({ kind: 'closed', tab: t });
            html +=
              '<div class="ts-item" role="option" id="ts-item-' +
              i +
              '" data-i="' +
              i +
              '"><span class="ic" aria-hidden="true">↺</span><span class="lbl"></span></div>';
          });
        }
        if (!tsRows.length) html = '<div class="ts-empty">No matching tabs</div>';
        tsList.innerHTML = html;
        // set labels via textContent (avoid HTML injection from titles/urls)
        const items = tsList.querySelectorAll('.ts-item');
        items.forEach((el) => {
          const i = Number.parseInt(el.dataset.i, 10);
          const row = tsRows[i];
          el.querySelector('.lbl').textContent = row.tab.title || row.tab.url || 'Untitled';
          el.addEventListener('mousemove', () => setSel(i));
          el.addEventListener('click', (e) => {
            if (e.target.classList.contains('x')) return;
            activateRow(i);
          });
          const x = el.querySelector('.x');
          if (x) {
            x.setAttribute('aria-label', ycTabbarA11y.closeLabel(row.tab));
            x.addEventListener('click', (e) => {
              e.stopPropagation();
              send('closeTab', x.dataset.close);
            });
          }
        });
        // Filtering changes the list with no focus move, so without a live
        // region nothing tells a screen-reader user that the matches changed -
        // including the "No matching tabs" state, which was on screen only.
        tsStatus.textContent = ycTabbarA11y.resultsStatus(tsRows.length);
        if (tsSel >= tsRows.length) tsSel = Math.max(0, tsRows.length - 1);
        paintSel();
      };

      // Focus stays in the input the whole time; the "selected" row is carried
      // to assistive technology by aria-activedescendant, as a listbox wants.
      const paintSel = () => {
        tsList.querySelectorAll('.ts-item').forEach((el) => {
          const selected = Number.parseInt(el.dataset.i, 10) === tsSel;
          el.classList.toggle('sel', selected);
          el.setAttribute('aria-selected', String(selected));
        });
        if (tsRows.length) {
          tsInput.setAttribute('aria-activedescendant', 'ts-item-' + tsSel);
        } else {
          tsInput.removeAttribute('aria-activedescendant');
        }
      };
      const setSel = (i) => {
        tsSel = i;
        paintSel();
      };

      const activateRow = (i) => {
        const row = tsRows[i];
        if (!row) return;
        if (row.kind === 'open') send('activateTab', row.tab.id);
        else send('newTab', row.tab.url);
        closeSearch();
      };

      const openSearch = () => {
        if (searchOpen) return;
        // Only one of the two overlays at a time, in either direction: two
        // stacked modals leave the user Escaping twice to get back to the app.
        closeCheatsheet();
        searchOpen = true;
        tsSel = 0;
        tsInput.value = '';
        setOverlayOpen('search', true); // grows the chrome view to the window
        // showModal(), not an `open` attribute: it is what traps Tab inside the
        // panel, raises `cancel` on Escape, and puts the panel in the top layer.
        if (!tsDialog.open) tsDialog.showModal();
        renderSearch();
        tsInput.focus();
      };
      const closeSearch = () => {
        if (!searchOpen) return;
        searchOpen = false;
        if (tsDialog.open) tsDialog.close();
        // Collapses the chrome view back to the strip - unless another overlay
        // is still open - and hands the keyboard back to the page underneath.
        setOverlayOpen('search', false);
      };
      globalThis.__ycOpenTabSearch = openSearch;

      // Escape and the backdrop both close through the dialog's own `close`
      // event, so there is one path out however the user leaves.
      tsDialog.addEventListener('close', closeSearch);
      tsDialog.addEventListener('click', (e) => {
        if (e.target === tsDialog) closeSearch();
      });
      tsInput.addEventListener('input', () => {
        tsSel = 0;
        renderSearch();
      });
      tsInput.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSel(Math.min(tsRows.length - 1, tsSel + 1));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSel(Math.max(0, tsSel - 1));
        } else if (e.key === 'Enter') {
          e.preventDefault();
          activateRow(tsSel);
        }
        // Escape is the dialog's own; it raises `cancel`, then `close`.
      });
      document.getElementById('search-tabs-btn').addEventListener('click', openSearch);

      // ── Cheatsheet ──
      const csDialog = document.getElementById('cheatsheet-dialog');
      const openCheatsheet = () => {
        if (csDialog.open) return;
        setOverlayOpen('cheatsheet', true);
        // As with tab search: showModal() gives the panel focus, traps Tab in
        // it and closes it on Escape. It had none of the three, and no way out
        // but Cmd+/ again or a click outside.
        csDialog.showModal();
      };
      const closeCheatsheet = () => {
        if (csDialog.open) csDialog.close();
        setOverlayOpen('cheatsheet', false);
      };
      const toggleCheatsheet = () => {
        if (csDialog.open) {
          closeCheatsheet();
          return;
        }
        if (searchOpen) closeSearch();
        openCheatsheet();
      };
      globalThis.__ycOpenCheatsheet = openCheatsheet;
      globalThis.__ycToggleCheatsheet = toggleCheatsheet;
      csDialog.addEventListener('close', () => setOverlayOpen('cheatsheet', false));
      csDialog.addEventListener('click', (e) => {
        if (e.target === csDialog) closeCheatsheet();
      });
      document.getElementById('cs-close').addEventListener('click', closeCheatsheet);

      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === 'y' || e.key === 'Y')) {
          e.preventDefault();
          searchOpen ? closeSearch() : openSearch();
        }
        if ((e.metaKey || e.ctrlKey) && e.key === '/' && !e.shiftKey) {
          e.preventDefault();
          toggleCheatsheet();
        }
      });

      // Windows / Linux frameless window: surface caption controls (macOS uses
      // native traffic lights). Fire-and-forget to the main process.
      if (!isMac) {
        const cap = document.getElementById('win-caption');
        if (cap) cap.style.display = 'flex';
        const minBtn = document.getElementById('win-min');
        const maxBtn = document.getElementById('win-max');
        const closeBtn = document.getElementById('win-close');
        if (minBtn) minBtn.addEventListener('click', () => send('windowMinimize'));
        if (maxBtn) maxBtn.addEventListener('click', () => send('windowToggleMaximize'));
        if (closeBtn) closeBtn.addEventListener('click', () => send('windowClose'));

        // The window can also be maximised by snapping, by the double-click
        // above or from the app menu, so the button follows main's state
        // rather than the last click here.
        const applyMaxState = (isMaximized) => {
          if (maxBtn) ycWindowCaption.applyMaximizeState(maxBtn, isMaximized);
        };
        if (yc && typeof yc.onWindowMaximizedChanged === 'function') {
          yc.onWindowMaximizedChanged(applyMaxState);
        }
      }

      poll();
      setInterval(poll, 1000);
    </script>
  </body>
</html>
