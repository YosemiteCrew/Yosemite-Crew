<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file:; font-src file:; style-src file:; script-src file:;"
    />
    <title>Locked — Yosemite Crew PIMS</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="idle-lock.css" />
  </head>
  <body>
    <div class="lock-bg" aria-hidden="true">
      <span class="lock-bg-rail"></span>
      <span class="lock-bg-main">
        <span class="sk sk-title"></span>
        <span class="sk-row">
          <span class="sk sk-card"></span>
          <span class="sk sk-card"></span>
          <span class="sk sk-card"></span>
        </span>
        <span class="sk sk-panel"></span>
      </span>
    </div>
    <div class="lock-scrim" aria-hidden="true"></div>

    <dialog class="lock-card" id="lockCard" aria-label="App locked">
      <span class="lock-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 19.8C3 10.2 7 3.8 12 3.8s9 6.4 9 16" />
          <path d="M6.8 20.8C6.8 12.4 9 7.6 12 7.6s5.2 4.8 5.2 13.2" />
          <path d="M12 11.6c.8 0 1.4 1.8 1.4 4c0 2-.2 3.8-.6 5.4" />
        </svg>
      </span>
      <h1>Locked</h1>
      <p>Locked after inactivity. Patient data stays encrypted while the app is locked.</p>

      <button class="unlock" id="unlock" type="button" autofocus>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 19.8C3 10.2 7 3.8 12 3.8s9 6.4 9 16" />
          <path d="M6.8 20.8C6.8 12.4 9 7.6 12 7.6s5.2 4.8 5.2 13.2" />
          <path d="M12 11.6c.8 0 1.4 1.8 1.4 4c0 2-.2 3.8-.6 5.4" />
        </svg>
        <span>Unlock with Touch ID</span>
      </button>
      <button
        class="use-password"
        id="usePassword"
        type="button"
        aria-expanded="false"
        aria-controls="signOutConfirm"
      >
        Sign out and sign in with password
      </button>

      <div class="signout-confirm" id="signOutConfirm" hidden>
        <p>Signing out closes this session. Anything unsaved in open tabs is lost.</p>
        <div class="signout-actions">
          <button class="signout-go" id="confirmSignOut" type="button">Sign out</button>
          <button class="signout-cancel" id="cancelSignOut" type="button">Cancel</button>
        </div>
      </div>

      <div class="lock-user">
        <span class="lock-user-ic">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="5" y="11" width="14" height="9" rx="2" />
            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
          </svg>
        </span>
        <span class="lock-user-name">Encrypted on this device</span>
      </div>

      <output class="lock-status" id="lockStatus"></output>
    </dialog>

    <script src="idle-lock-controls.js"></script>
    <script src="idle-lock.js"></script>
  </body>
</html>
