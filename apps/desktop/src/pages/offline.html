<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file:; font-src file:; style-src file:; script-src file:;"
    />
    <title>Connection lost — Yosemite Crew PIMS</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="offline.css" />
  </head>
  <body>
    <div class="card">
      <img class="logo" src="../../resources/logo-beta.svg" alt="Yosemite Crew" />
      <h1>You're offline</h1>
      <p>
        We can't reach the Yosemite Crew workspace right now. Check your internet connection. Your
        session is saved and you won't need to sign in again.
      </p>
      <div class="row">
        <button class="primary" id="retry" type="button">Try again</button>
        <button class="ghost" id="browser" type="button">Open in browser</button>
      </div>
      <div class="countdown" id="countdown">Retrying automatically in <b id="secs">20</b>s</div>
      <div class="detail" id="detail"></div>
      <div class="offline-divider"></div>
      <div class="sync-note">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M7 18a4 4 0 0 1-.5-7.97 5.5 5.5 0 0 1 10.7-1.2A3.75 3.75 0 0 1 17 18" />
          <path d="M12 12v7" />
          <path d="M9 15l3-3 3 3" />
        </svg>
        Edits are saved on this device and sync when the connection returns
      </div>
    </div>
    <script src="offline.js"></script>
  </body>
</html>
