sonar.projectKey=yosemitecrew_Yosemite-Crew_Desktop
sonar.organization=yosemitecrew

# Source settings
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=./tsconfig.json
sonar.javascript.node.maxspace=4096

# Coverage — lcov generated by "pnpm test:coverage" (jest --coverage).
# Path is relative to projectBaseDir (apps/desktop/).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions (speed up scan, drop generated/vendored/static assets)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,resources/**,scripts/**,e2e/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Mirror jest's collectCoverageFrom: the composition-root/bootstrap glue
# (main.ts, create-main-window.ts, boot/setup.ts) and the local HTML pages are
# only exercisable in a real Electron runtime and aren't unit-covered, so don't
# penalise their coverage.
sonar.coverage.exclusions=**/*.test.ts,tests/**,e2e/**,scripts/**,src/pages/**,src/main.ts,src/shell/create-main-window.ts,src/boot/setup.ts

# Ignore non-relevant languages
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Narrow issue exclusion, with its rationale (the CI issue ceiling is 0, and
# scripts/ci/sonar-thresholds.mjs asks for exactly this rather than a NOSONAR).
#
# Web:S6819 tells you to use a native element instead of an ARIA role, and for
# role="status" and role="group" it is right - those became <output> and a plain
# container. It also flags role="listbox" on the command palette's result list
# and offers <datalist> or <select> instead, and neither can do this job: the
# palette is the ARIA combobox pattern, where a text input owns the focus and
# drives the selection through aria-activedescendant over rows that render an
# icon, a highlighted label and a type badge. A <select> cannot be driven from a
# separate input and cannot render those rows. Issue #3295 asks for this pattern
# by name. Scoped to the one rule in the one file.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e1.resourceKey=src/pages/command-palette.html
