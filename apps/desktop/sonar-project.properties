sonar.projectKey=yosemitecrew_Yosemite-Crew_Desktop
sonar.organization=yosemitecrew

# Source settings
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=./tsconfig.json
sonar.javascript.node.maxspace=4096

# Coverage — lcov generated by "pnpm test:coverage" (jest --coverage).
# Path is relative to projectBaseDir (apps/desktop/).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions (speed up scan, drop generated/vendored/static assets)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,resources/**,scripts/**,e2e/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Mirror jest's collectCoverageFrom: the composition-root/bootstrap glue
# (main.ts, create-main-window.ts, boot/setup.ts) and the local HTML pages are
# only exercisable in a real Electron runtime and aren't unit-covered, so don't
# penalise their coverage.
sonar.coverage.exclusions=**/*.test.ts,tests/**,e2e/**,scripts/**,src/pages/**,src/main.ts,src/shell/create-main-window.ts,src/boot/setup.ts

# Two narrow, documented exclusions. Both are Web:S6819, both are scoped to a
# single file, and both are declared in ONE multicriteria list: a properties file
# that names sonar.issue.ignore.multicriteria twice keeps only one of the two,
# which is exactly what a textual merge of these two branches produced. The CI
# issue ceiling is 0 and scripts/ci/sonar-thresholds.mjs asks for this shape
# rather than a NOSONAR.
#
# Web:S6819 asks for a native element in place of an ARIA role, and where it is
# right the role was removed rather than excluded: role="status" became <output>
# and role="group" became a plain container, in both files. What remains is
# role="listbox", and its two suggested remedies - <datalist> and <select>
# - cannot do this job in either place.
#
# listboxRole - src/pages/tabbar.html (#3294). The tab search results each carry
# a state glyph, a label and their own close button, and the list is filtered as
# you type while focus stays in the input and the selection travels by
# aria-activedescendant. A <select> has no room for any of that, and #3294
# specifies the listbox pattern for exactly this reason.
#
# e1 - src/pages/command-palette.html (#3295). The palette is the ARIA combobox
# pattern: a text input owns the focus and drives the selection through
# aria-activedescendant over rows that render an icon, a highlighted label and a
# type badge. A <select> cannot be driven from a separate input and cannot
# render those rows. #3295 asks for this pattern by name.
#
# RESIDUAL, stated rather than papered over: resourceKey is a path, not a line,
# so each entry also stops S6819 firing on any OTHER role in that one file. The
# instances it would otherwise have caught are fixed rather than hidden, but a
# future role added to either file would go unflagged. Narrowing further is not
# available in this mechanism.
sonar.issue.ignore.multicriteria=listboxRole,e1
sonar.issue.ignore.multicriteria.listboxRole.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.listboxRole.resourceKey=src/pages/tabbar.html
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e1.resourceKey=src/pages/command-palette.html

# Ignore non-relevant languages
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
