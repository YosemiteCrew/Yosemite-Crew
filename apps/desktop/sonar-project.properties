sonar.projectKey=yosemitecrew_Yosemite-Crew_Desktop
sonar.organization=yosemitecrew

# Source settings
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=./tsconfig.json
sonar.javascript.node.maxspace=4096

# Coverage — lcov generated by "pnpm test:coverage" (jest --coverage).
# Path is relative to projectBaseDir (apps/desktop/).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions (speed up scan, drop generated/vendored/static assets)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,resources/**,scripts/**,e2e/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Mirror jest's collectCoverageFrom: the composition-root/bootstrap glue
# (main.ts, create-main-window.ts, boot/setup.ts) and the local HTML pages are
# only exercisable in a real Electron runtime and aren't unit-covered, so don't
# penalise their coverage.
sonar.coverage.exclusions=**/*.test.ts,tests/**,e2e/**,scripts/**,src/pages/**,src/main.ts,src/shell/create-main-window.ts,src/boot/setup.ts

# Narrow, documented exclusion (the only one). Web:S6819 asks for a native
# element in place of an ARIA role, and for `role="status"` it is right - the
# live region in tabbar.html is an <output>, which carries that role natively.
# For `role="listbox"` its two suggested remedies, <datalist> and <select>,
# cannot express the tab search results: each row carries a state glyph, a
# label and its own close button, and the list is filtered as you type while
# focus stays in the input and the selection travels by aria-activedescendant.
# A <select> has no room for any of that. Issue #3294 specifies the listbox
# pattern for exactly this reason.
#
# RESIDUAL, stated rather than papered over: resourceKey is a path, not a line,
# so this also stops S6819 firing on any OTHER role in this one file. The
# `role="status"` instance it would otherwise have caught is fixed rather than
# hidden, but a future role added here would go unflagged. Narrowing further
# is not available in this mechanism.
sonar.issue.ignore.multicriteria=listboxRole
sonar.issue.ignore.multicriteria.listboxRole.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.listboxRole.resourceKey=src/pages/tabbar.html

# Ignore non-relevant languages
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
