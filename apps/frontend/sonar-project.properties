sonar.projectKey=yosemitecrew_Yosemite-Crew_Frontend
sonar.organization=yosemitecrew

# Source settings
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/__tests__/**

# Coverage — lcov generated by "pnpm test:coverage" (jest --coverage)
# Path is relative to projectBaseDir (apps/frontend/)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions (speed up scan massively)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,**/*.stories.tsx,**/*.stories.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/tests/**,**/__tests__/**,**/*.stories.tsx,**/*.stories.ts,**/*.d.ts,**/types/**,**/types.ts,**/jest.mocks/**,**/lib/data/**,**/constants/**,**/loading.tsx,**/not-found.tsx,**/layout.tsx,**/page.tsx

# The legal content modules are the verbatim terms and privacy policy stored as data:
# one entry per clause, list item and table row, so that a legal update is reviewed as a
# content diff. Their repetition is the shape of the contract, not logic to factor out,
# and collapsing it would move the published text out of the file a reviewer reads.
# Duplication is measured everywhere else.
sonar.cpd.exclusions=src/app/features/legal/pages/content/**

# ModalBase intentionally keeps a mounted div with role="dialog" for CSS close transitions.
# Native <dialog> hides with display:none when closed, breaking opacity/transform animations.
# NOSONAR in JSX is unreliable for this rule — suppress via multicriteria instead.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e1.resourceKey=src/app/ui/overlays/Modal/ModalBase.tsx

# Ignore non-relevant languages
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
