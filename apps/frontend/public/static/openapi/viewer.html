<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yosemite Crew OpenAPI</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="redoc"></div>
    <!--
      Pinned to an exact version rather than `latest`: an unpinned CDN bundle
      changes under us with no review.

      Deliberately NO `integrity`/`crossorigin`. cdn.redoc.ly does not send an
      `access-control-allow-origin` header - checked with `curl -I` - and a
      browser only enforces `integrity` on a cross-origin script when the
      request is CORS-enabled. Adding the pair would make the browser BLOCK the
      script outright and render this page empty with no visible error, which
      is worse than no SRI.

      To get integrity here, the bundle has to be vendored into public/ and
      served same-origin. Worth doing; it is a separate change from retiring
      Docusaurus.
    -->
    <script src="https://cdn.redoc.ly/redoc/v2.5.0/bundles/redoc.standalone.js"></script>
    <!--
      The docs frame this page with sandbox="allow-scripts", so it runs in an
      opaque origin and cannot fetch the spec from the app itself. It asks the
      parent page instead, over a private channel, and answers Redoc's request
      for the spec URL with the text it gets back. Opened directly, it loads the
      spec as a normal same-origin page.

      Authorised by hash in next.config.ts (OPENAPI_VIEWER_CSP): any edit to the
      script below, whitespace included, needs the hash there updated too. A
      test recomputes it from this file and fails if the two drift.
    -->
    <script>
      const el = document.getElementById('redoc');
      const specUrl = new URL('openapi.yaml', location.href).href;
      if (window.parent === window) {
        Redoc.init(specUrl, {}, el);
      } else {
        const channel = new MessageChannel();
        channel.port1.onmessage = (event) => {
          const nativeFetch = window.fetch.bind(window);
          window.fetch = (input, init) =>
            String(input) === specUrl
              ? Promise.resolve(new Response(event.data))
              : nativeFetch(input, init);
          Redoc.init(specUrl, {}, el);
        };
        window.parent.postMessage('yc-openapi-viewer-ready', location.origin, [channel.port2]);
      }
    </script>
  </body>
</html>
