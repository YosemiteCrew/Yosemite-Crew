  '/v1/contact-us/requests':
    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/contact-us/requests'
      operationId: get_v1_contact_us_requests
      security:
        - BearerAuth: []
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: array
                description: ContactController.list returns res.json(docs) where docs = prisma.contactRequest.findMany(...) (src/services/contact-us.service.ts listRequests), capped at 100 rows, newest first.
                items:
                  type: object
                  required:
                    - id
                    - type
                    - source
                    - subject
                    - message
                    - status
                    - createdAt
                    - updatedAt
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                      enum:
                        - GENERAL_ENQUIRY
                        - FEATURE_REQUEST
                        - DSAR
                        - COMPLAINT
                    source:
                      type: string
                      enum:
                        - MOBILE_APP
                        - PMS_WEB
                        - MARKETING_SITE
                    subject:
                      type: string
                    message:
                      type: string
                    userId:
                      type: string
                      nullable: true
                    email:
                      type: string
                      nullable: true
                    organisationId:
                      type: string
                      nullable: true
                    patientId:
                      type: string
                      nullable: true
                    parentId:
                      type: string
                      nullable: true
                    dsarDetails:
                      type: object
                      nullable: true
                      description: Present only when type=DSAR. Stored as a Prisma Json column but always written in this shape by ContactService.createRequest/createWebRequest (src/models/contect-us.ts DsraDetails).
                      properties:
                        requesterType:
                          type: string
                          enum:
                            - SELF
                            - PARENT_GUARDIAN
                            - AUTHORIZED_AGENT
                        lawBasis:
                          type: string
                          nullable: true
                          enum:
                            - GDPR
                            - CCPA
                            - UK_GDPR
                            - LGPD
                            - PIPEDA
                            - POPIA
                            - PDPA
                            - PIPL
                            - PA_1988_AU
                            - OTHER
                        otherLawText:
                          type: string
                          nullable: true
                        rightsRequested:
                          type: array
                          items:
                            type: string
                            enum:
                              - KNOW_INFORMATION_COLLECTED
                              - ACCESS_PERSONAL_INFORMATION
                              - DELETE_DATA
                              - RECTIFY_INACCURATE_INFORMATION
                              - RESTRICT_PROCESSING
                              - PORTABILITY_COPY
                              - OPT_OUT_SELLING_SHARING
                              - LIMIT_SENSITIVE_PROCESSING
                              - OTHER
                        otherRightText:
                          type: string
                          nullable: true
                        dataSubjectDescription:
                          type: string
                          nullable: true
                        declarationAccepted:
                          type: boolean
                        declarationAcceptedAt:
                          type: string
                          format: date-time
                          nullable: true
                    complaintContext:
                      type: object
                      nullable: true
                      description: 'Stored as a Prisma Json column. Only createWebRequest populates it, via buildComplaintContext (src/services/contact-us.service.ts): {fullName, phone} - not the {aboutOrganisationId, aboutAppointmentId} shape declared in the ContactRequestMongo TS interface, which no code path actually writes.'
                      properties:
                        fullName:
                          type: string
                        phone:
                          type: string
                          nullable: true
                    attachments:
                      type: array
                      nullable: true
                      description: Stored as a Prisma Json column; app-level shape from src/models/contect-us.ts ContactAttachment.
                      items:
                        type: object
                        required:
                          - url
                          - name
                        properties:
                          id:
                            type: string
                            nullable: true
                          url:
                            type: string
                          name:
                            type: string
                          contentType:
                            type: string
                            nullable: true
                          sizeBytes:
                            type: number
                            nullable: true
                    status:
                      type: string
                      enum:
                        - OPEN
                        - IN_PROGRESS
                        - RESOLVED
                        - CLOSED
                    internalNotes:
                      type: string
                      nullable: true
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
