                    type: string
                  subcategory:
                    type: string
                    nullable: true
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  additionalNotes:
                    type: string
                    nullable: true
                  medication:
                    type: object
                    nullable: true
                    description: Stored as a Prisma Json column (Task.medication); the service layer types it as MedicationInput.
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                      notes:
                        type: string
                      frequency:
                        type: string
                      doses:
                        type: array
                        items:
                          type: object
                          properties:
                            time:
                              type: string
                            dosage:
                              type: string
                            instructions:
                              type: string
                  observationToolId:
                    type: string
                    nullable: true
                  dueAt:
                    type: string
                    format: date-time
                  timezone:
                    type: string
                    nullable: true
                  recurrence:
                    type: object
                    nullable: true
                    description: Stored as a Prisma Json column (Task.recurrence); the service layer (buildRecurrence/mergeRecurrence) writes {type, isMaster, masterTaskId, cronExpression, endDate} to track recurring task series.
                    properties:
                      type:
                        type: string
                        enum:
