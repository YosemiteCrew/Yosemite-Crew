  '/v1/migration-audit/pms/organisations/{organisationId}/migration-audit':
    post:
      tags:
        - 'Non-FHIR'
      summary: 'POST /v1/migration-audit/pms/organisations/{organisationId}/migration-audit'
      operationId: post_v1_migration_audit_pms_organisations_organisationId_migration_audit
      description: Starts a read-only migration audit run for a bundle already uploaded via the upload-url endpoint above. Never writes any clinic record.
      security:
        - BearerAuth: []
      parameters:
        - name: organisationId
          in: path
          required: true
          schema:
            type: string
        - name: x-org-id
          in: header
          required: false
          description: Organisation the request acts on. Optional here because the path already carries it; sent otherwise it is ignored in favour of the path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceKeys
              properties:
                sourceKeys:
                  type: object
                  required:
                    - owners
                    - animals
                    - appointments
                  properties:
                    owners:
                      type: string
                      description: S3 key returned by the upload-url endpoint.
                    animals:
                      type: string
                    appointments:
                      type: string
                    attachments:
                      type: string
                      description: Optional attachment manifest CSV key.
      responses:
        201:
          description: Audit run created and enqueued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - PENDING
                      - RUNNING
                      - COMPLETED
                      - FAILED
        400:
          description: Missing required file(s), a key that does not belong to this organisation, or a body that fails validation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        401:
          description: Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
