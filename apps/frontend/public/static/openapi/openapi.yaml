    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/migration-audit/pms/organisations/{organisationId}/migration-audit/{auditRunId}'
      operationId: get_v1_migration_audit_pms_organisations_organisationId_migration_audit_auditRunId
      security:
        - BearerAuth: []
      parameters:
        - name: organisationId
          in: path
          required: true
          schema:
            type: string
        - name: auditRunId
          in: path
          required: true
          schema:
            type: string
        - name: x-org-id
          in: header
          required: false
          description: Organisation the request acts on. Optional here because the path already carries it; sent otherwise it is ignored in favour of the path.
          schema:
            type: string
      responses:
        200:
          description: Run status, per-section summary once COMPLETED, and findings as a FHIR OperationOutcome (row/column reference only - never the raw untrusted cell content).
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - outcome
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - PENDING
                      - RUNNING
                      - COMPLETED
                      - FAILED
                  summary:
                    type: object
                    nullable: true
                    description: Present once the run leaves PENDING/RUNNING. Absent otherwise.
                    properties:
                      OWNERS:
                        $ref: '#/components/schemas/MigrationAuditSectionSummary'
                      ANIMALS:
                        $ref: '#/components/schemas/MigrationAuditSectionSummary'
                      APPOINTMENTS:
                        $ref: '#/components/schemas/MigrationAuditSectionSummary'
                      ATTACHMENTS:
                        $ref: '#/components/schemas/MigrationAuditSectionSummary'
                  errorMessage:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                  completedAt:
                    type: string
                    format: date-time
                    nullable: true
                  outcome:
                    $ref: '#/components/schemas/OperationOutcome'
        404:
          description: Migration audit run not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
