          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeveloperUsage'
        401:
          description: 'No API key presented, or the key is invalid, revoked or expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApiErrorEnvelope'
  '/v1/developer/appointments':
    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/developer/appointments'
      description: 'Appointments for one practice, keyset-paginated and ordered by (appointmentDate, id). Requires the appointments:read scope and a live active membership of the practice named in x-org-id.'
      operationId: get_v1_developer_appointments
      security:
        - DeveloperApiKeyAuth: []
      parameters:
        - name: x-org-id
          in: header
          required: true
          description: "Practice to read from. Must be one of the ids returned by GET /v1/developer/organizations for this key's owner."
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: 'ISO 8601 date-time lower bound on appointmentDate'
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 'ISO 8601 date-time upper bound on appointmentDate'
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [REQUESTED, UPCOMING, CHECKED_IN, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW]
        - name: limit
          in: query
          required: false
          description: 'Page size, clamped server-side (default 50, max 100)'
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: "Opaque cursor from a previous response's pagination.nextCursor"
          schema:
            type: string
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeveloperAppointment'
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      nextCursor:
                        type: string
                        nullable: true
        400:
          description: 'Missing organisation context, or from/to/status/cursor failed validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApiErrorEnvelope'
        401:
          description: 'No API key presented, or the key is invalid, revoked or expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApiErrorEnvelope'
        500:
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApiErrorEnvelope'
  '/v1/developer/appointments/{appointmentId}':
    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/developer/appointments/{appointmentId}'
      description: 'One appointment. The practice is derived from the appointment record itself rather than from x-org-id, so a key holder cannot read a record in another practice by naming it in the header.'
      operationId: get_v1_developer_appointments_appointmentId
      security:
        - DeveloperApiKeyAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
        - name: x-org-id
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeveloperAppointment'
        400:
          description: Missing organisation context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApiErrorEnvelope'
        401:
          description: 'No API key presented, or the key is invalid, revoked or expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApiErrorEnvelope'
        404:
          description: Appointment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApiErrorEnvelope'
        500:
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApiErrorEnvelope'
  '/v1/developers/api-keys':
    post:
      tags:
        - 'Non-FHIR'
      summary: 'POST /v1/developers/api-keys'
      description: 'Issue a new API key for the signed-in developer. Session-authenticated only, deliberately with no role or organisation gate: this account type has no UserOrganization row. The plaintext key is returned exactly once, in this response, and never again.'
      operationId: post_v1_developers_api_keys
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeveloperApiKeyBody'
      responses:
        201:
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDeveloperApiKey'
        400:
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: "'Invalid request' when the body fails CreateApiKeySchema validation (DeveloperApiKeyController.createApiKey); other DeveloperApiKeyServiceError messages surface here too but share this same {message} shape."
                  errors:
                    type: object
                    description: zod v4 z.flattenError(parsed.error) output for the CreateApiKeySchema ({name, scopes?, environment?, expiresAt?}) validation failure. Only present on the validation-error path.
                    properties:
                      formErrors:
                        type: array
                        items:
                          type: string
                      fieldErrors:
                        type: object
                        description: Keyed by request field name (name, scopes, environment, expiresAt).
                        additionalProperties:
                          type: array
                          items:
                            type: string
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        429:
          description: 'Active API key limit reached (25 per developer)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/developers/api-keys'
      description: "List this developer's own API keys, most recently created first. Never includes the plaintext secret."
      operationId: get_v1_developers_api_keys
      security:
        - BearerAuth: []
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeveloperApiKey'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  '/v1/developers/api-keys/{keyId}':
    delete:
      tags:
        - 'Non-FHIR'
      summary: 'DELETE /v1/developers/api-keys/{keyId}'
      description: "Revoke one of this developer's own API keys. Revoking does not delete the row; it stops the key from authenticating."
      operationId: delete_v1_developers_api_keys_keyId
      security:
        - BearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Revoked, no content
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: API key not found (wrong id, or it does not belong to this developer)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  '/v1/developers/billing':
    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/developers/billing'
      description: "This developer's own subscription. A developer with no Stripe subscription yet gets a synthetic free-plan record rather than a 404."
      operationId: get_v1_developers_billing
      security:
        - BearerAuth: []
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeveloperSubscription'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  '/v1/developers/billing/checkout':
    post:
      tags:
        - 'Non-FHIR'
      summary: 'POST /v1/developers/billing/checkout'
      description: 'Create a Stripe Checkout session for this developer to start a paid subscription.'
      operationId: post_v1_developers_billing_checkout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successUrl, cancelUrl]
              properties:
                successUrl:
                  type: string
                  format: uri
                cancelUrl:
                  type: string
                  format: uri
      responses:
        201:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
        400:
          description: 'successUrl or cancelUrl missing or not a valid URL'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  '/v1/developers/billing/portal':
    post:
      tags:
        - 'Non-FHIR'
      summary: 'POST /v1/developers/billing/portal'
      description: 'Create a Stripe Billing Portal session so this developer can manage their existing subscription.'
      operationId: post_v1_developers_billing_portal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnUrl]
              properties:
                returnUrl:
                  type: string
                  format: uri
      responses:
        201:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
        400:
          description: returnUrl is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  '/v1/developers/billing/webhook':
    post:
      tags:
        - 'Non-FHIR'
      summary: 'POST /v1/developers/billing/webhook'
      description: "Stripe webhook receiver for developer billing events. Not part of the developer-facing surface: authenticated by Stripe's request signature (stripe-signature header) rather than a session or API key, and mounted directly on the app ahead of the JSON body parser so the raw body reaches the signature check."
      operationId: post_v1_developers_billing_webhook
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        400:
          description: 'Missing stripe-signature header, or signature verification failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        500:
          description: Webhook handler failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  '/v1/developers/usage':
    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/developers/usage'
      description: "This developer's own call count and quota for a billing period. Session-authenticated counterpart to GET /v1/developer/usage (which is API-key authenticated) — backed by the same service."
      operationId: get_v1_developers_usage
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          description: 'Billing period as YYYY-MM. Defaults to the current month.'
          schema:
            type: string
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeveloperUsage'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  '/v1/form-draft-imports/{orgId}':
    post:
      tags:
        - 'Non-FHIR'
      summary: 'POST /v1/form-draft-imports/{orgId}'
      operationId: post_v1_form_draft_imports_orgId
      description: Deterministically converts supplied intake-form text into a new draft Form (status=draft), reusing the existing Form/FormVersion schema, validators and publish machinery. Never publishes; publishing stays on the existing /fhir/v1/form/admin/{formId}/publish route.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: x-org-id
          in: header
          required: false
          description: Organisation the request acts on. Optional here because the path already carries it; sent otherwise it is ignored in favour of the path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - suppliedText
              properties:
                suppliedText:
                  type: string
                  maxLength: 20000
                  description: '`|`-delimited lines, one field per line: label | type | required|optional | comma-separated options (choice types only).'
                sourceFormId:
                  type: string
                  format: uuid
                  description: An existing Form in this organisation to diff the proposed fields against. Omit to import as a brand-new form.
      responses:
        201:
          description: Draft Form created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FormDraftImport'
        400:
          description: Empty/oversized suppliedText, no supported fields found, or a body that fails validation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        401:
          description: Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        403:
          description: Caller is not an active member of this organisation, or lacks forms:edit:any.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: sourceFormId does not exist in this organisation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  '/v1/form-draft-imports/{orgId}/{id}':
    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/form-draft-imports/{orgId}/{id}'
      operationId: get_v1_form_draft_imports_orgId_id
      description: Re-parses the stored suppliedText and recomputes the diff against the source form's CURRENT latest version, so a concurrent edit to the source form is visible as stale=true rather than served from a cached comparison.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-org-id
          in: header
          required: false
          description: Organisation the request acts on. Optional here because the path already carries it; sent otherwise it is ignored in favour of the path.
          schema:
            type: string
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FormDraftImport'
        401:
          description: Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        403:
          description: Caller is not an active member of this organisation, or lacks forms:view:any.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: No such draft import in this organisation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    delete:
      tags:
        - 'Non-FHIR'
      summary: 'DELETE /v1/form-draft-imports/{orgId}/{id}'
      operationId: delete_v1_form_draft_imports_orgId_id
      description: Discards a draft import by deleting its still-draft Form. Refuses (409) once the draft Form has been published through the existing human publish path, so this action can never undo a publish.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-org-id
          in: header
          required: false
          description: Organisation the request acts on. Optional here because the path already carries it; sent otherwise it is ignored in favour of the path.
          schema:
            type: string
      responses:
        204:
          description: Draft discarded.
        401:
          description: Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        403:
          description: Caller is not an active member of this organisation, or lacks forms:edit:any.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: No such draft import in this organisation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        409:
          description: The draft Form has already been published and can no longer be discarded here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DeveloperApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: 'yc_<live|test>_<secret> - a developer API key, not a session JWT'
  schemas:
    AccessPolicy:
      type: object
      properties:
        resourceType:
          type: string
          enum:
            - AccessPolicy
          description: This is a AccessPolicy resource
        id:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        implicitRules:
          type: string
        language:
          type: string
        text:
          $ref: '#/components/schemas/Narrative'
        contained:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        extension:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
        modifierExtension:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
        name:
          type: string
        basedOn:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        compartment:
          $ref: '#/components/schemas/Reference'
        resource:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicyResource'
        ipAccessRule:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicyIpAccessRule'
      additionalProperties: true
      required:
        - resourceType
    AccessPolicyIpAccessRule:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        action:
          type: string
          enum:
            - allow
            - block
          description: Access rule action applied to incoming traffic.
      additionalProperties: true
      required:
        - value
        - action
    AccessPolicyResource:
      type: object
      properties:
        resourceType:
          type: string
        compartment:
          $ref: '#/components/schemas/Reference'
        criteria:
          type: string
        readonly:
          type: boolean
        interaction:
          type: array
          items:
            type: string
            enum:
              - read
              - vread
              - update
              - delete
              - history
              - create
              - search
            description: Permitted FHIR interaction with this resource type.
        hiddenFields:
          type: array
          items:
            type: string
        readonlyFields:
          type: array
          items:
            type: string
        writeConstraint:
          type: array
          items:
            $ref: '#/components/schemas/Expression'
      additionalProperties: true
      required:
        - resourceType
    Address:
      type: object
      properties:
        id:
          type: string
        extension:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
        use:
          type: string
          enum:
            - home
            - work
            - temp
            - old
            - billing
          description: The purpose of this address.
        type:
          type: string
          enum:
            - postal
            - physical
            - both
          description: Distinguishes between physical addresses and mailing addresses.
        text:
          type: string
        line:
          type: array
          items:
            type: string
        city:
          type: string
        district:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        period:
          $ref: '#/components/schemas/Period'
      additionalProperties: true
    Age:
      type: object
      properties:
        id:
          type: string
        extension:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
        value:
          type: number
        comparator:
          type: string
          enum:
            - <
            - <=
            - '>='
            - '>'
          description: How the value should be understood relative to the stated value.
        unit:
          type: string
        system:
          type: string
        code:
          type: string
      additionalProperties: true
    Appointment:
      type: object
      properties:
        resourceType:
          type: string
          enum:
            - Appointment
        id:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        implicitRules:
          type: string
        language:
          type: string
        text:
          $ref: '#/components/schemas/Narrative'
        contained:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        extension:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
        modifierExtension:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        status:
          type: string
        cancelationReason:
          $ref: '#/components/schemas/CodeableConcept'
        serviceCategory:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        serviceType:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        speciality:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        appointmentType:
          $ref: '#/components/schemas/CodeableConcept'
        reasonCode:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        reasonReference:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        priority:
          type: number
        description:
          type: string
        supportingInformation:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        start:
          type: string
        end:
          type: string
        minutesDuration:
          type: number
        slot:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        created:
          type: string
        comment:
          type: string
        patientInstruction:
          type: string
        basedOn:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        participant:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentParticipant'
        requestedPeriod:
          type: array
          items:
            $ref: '#/components/schemas/Period'
      additionalProperties: true
      required:
        - resourceType
        - participant
    AppointmentDataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Appointment'
    AppointmentEnvelope:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/Appointment'
    AppointmentListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
    UploadUrlEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url, key]
          properties:
            url:
              type: string
              format: uri
            key:
