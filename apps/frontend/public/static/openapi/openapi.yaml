openapi: 3.0.3
info:
  title: Yosemite Crew API
  version: 1.0.0
  description: 'FHIR and non-FHIR endpoints. Written by hand and checked for drift against the backend routers in CI (scripts/ci/openapi-drift.mjs) - there is no generator.'
servers:
  - url: https://api.yosemitecrew.com
    description: Production
  - url: https://devapi.yosemitecrew.com
    description: Development
tags:
  - name: FHIR
    description: FHIR endpoints under /fhir/v1
  - name: 'Non-FHIR'
    description: 'Non-FHIR endpoints under /v1'
paths:
  '/v1/account-withdrawal/withdraw':
    post:
      tags:
        - 'Non-FHIR'
      summary: 'POST /v1/account-withdrawal/withdraw'
      operationId: post_v1_account_withdrawal_withdraw
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountWithdrawalBody'
      responses:
        201:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
        400:
          description: 'Client validation failed, e.g. "fullName and email are required" or "Checkbox confirmation is required"'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  '/v1/adverse-event/':
    post:
      tags:
        - 'Non-FHIR'
      summary: 'POST /v1/adverse-event/'
      operationId: post_v1_adverse_event
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reporter
                - patient
                - product
              description: AdverseEventReport submitted by the mobile app (apps/backend/src/controllers/web/adverse-event.controller.ts createFromMobile, typed Request<unknown, unknown, AdverseEventReport>). reporter/patient/companion/product/destinations/consent are stored as Prisma Json columns on AdverseEventReport with no fixed shape at the database level, but the application-level contract is the AdverseEventReporterInfo/AdverseEventPatientInfo/AdverseEventProductInfo/AdverseEventDestinations/AdverseEventConsent types in packages/types/src/adverse-event.ts, which is what req.body is typed against. AdverseEventService.createFromMobile (apps/backend/src/services/adverse-event.service.ts) throws a 400 if reporter.firstName, reporter.email, patient.name or product.productName are missing; destinations and consent are read with optional chaining and default safely if omitted, so they are not enforced at runtime even though the TS type marks them non-optional.
              properties:
                organisationId:
                  type: string
                  description: Selected clinic/organisation id.
                appointmentId:
                  type: string
                  nullable: true
                reporter:
                  type: object
                  required:
                    - type
                    - firstName
                    - lastName
                    - email
                  properties:
                    userId:
                      type: string
                    type:
                      type: string
                      enum:
                        - PARENT
                        - CO_PARENT
                        - CLINIC_STAFF
                    firstName:
                      type: string
                    lastName:
                      type: string
                    phoneNumber:
                      type: string
                    email:
                      type: string
                    dateOfBirth:
                      type: string
                      description: ISO date string.
                    addressLine:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postalCode:
                      type: string
                    country:
                      type: string
                    currency:
                      type: string
                patient:
                  type: object
                  required:
                    - name
                  properties:
                    patientId:
                      type: string
                    companionId:
                      type: string
                    name:
                      type: string
                    breed:
                      type: string
                    dateOfBirth:
                      type: string
                    gender:
                      type: string
                    currentWeight:
                      type: string
                    color:
                      type: string
                    neuteredStatus:
                      type: string
                    bloodGroup:
                      type: string
                    microchipNumber:
                      type: string
                    passportNumber:
                      type: string
                    insured:
                      type: string
                    insuranceCompany:
                      type: string
                    insurancePolicyNumber:
                      type: string
                    countryOfOrigin:
                      type: string
                    originDetails:
                      type: string
                companion:
                  type: object
                  description: Same shape as patient. Accepted on the payload type but never read by AdverseEventService.createFromMobile; the stored/returned companion always mirrors patient instead.
                  properties:
                    patientId:
                      type: string
                    companionId:
                      type: string
                    name:
                      type: string
                    breed:
                      type: string
                    dateOfBirth:
                      type: string
                    gender:
                      type: string
                    currentWeight:
                      type: string
                    color:
                      type: string
                    neuteredStatus:
                      type: string
                    bloodGroup:
                      type: string
                    microchipNumber:
                      type: string
                    passportNumber:
                      type: string
                    insured:
                      type: string
                    insuranceCompany:
                      type: string
                    insurancePolicyNumber:
                      type: string
                    countryOfOrigin:
                      type: string
                    originDetails:
                      type: string
                product:
                  type: object
                  required:
                    - productName
                  properties:
                    productName:
                      type: string
                    brandName:
                      type: string
                    manufacturingCountry:
                      type: string
                    batchNumber:
                      type: string
                    numberOfTimesUsed:
                      type: number
                    quantityUsed:
                      type: number
                    dosageForm:
                      type: string
                    administrationRoute:
                      type: string
                    reasonToUse:
                      type: string
                    conditionBefore:
                      type: string
                    conditionAfter:
                      type: string
                    eventDate:
                      type: string
                    productImageUrl:
                      type: string
                destinations:
                  type: object
                  properties:
                    sendToManufacturer:
                      type: boolean
                    sendToHospital:
                      type: boolean
                    sendToAuthority:
                      type: boolean
                consent:
                  type: object
                  properties:
                    agreedToContact:
                      type: boolean
                    agreedToTermsAt:
                      type: string
                      format: date-time
      responses:
        201:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  '/v1/adverse-event/regulatory-authority/':
    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/adverse-event/regulatory-authority/'
      operationId: get_v1_adverse_event_regulatory_authority
      security:
        - BearerAuth: []
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                description: RegulatoryAuthority row returned as-is by prisma.regulatoryAuthority.findFirst (apps/backend/src/controllers/web/adverse-event.controller.ts getRegulatoryAuthorityInof), matched by iso2 or country query param. Only id is non-nullable in the Prisma model (packages/database/prisma/schema.prisma); every other column is optional.
                properties:
                  id:
                    type: string
                  country:
                    type: string
                    nullable: true
                  iso2:
                    type: string
                    nullable: true
                  iso3:
                    type: string
                    nullable: true
                  authorityName:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true
                  email:
                    type: string
                    nullable: true
                  website:
                    type: string
                    nullable: true
                  notes:
                    type: string
                    nullable: true
                  sourceUrl:
                    type: string
                    nullable: true
  '/v1/adverse-event/organisation/{organisationId}':
    get:
      tags:
        - 'Non-FHIR'
      summary: 'GET /v1/adverse-event/organisation/{organisationId}'
      operationId: get_v1_adverse_event_organisation_organisationId
      parameters:
        - name: organisationId
          in: path
          required: true
          schema:
            type: string
        - name: x-org-id
          in: header
          required: false
          description: Organisation the request acts on. Optional here because the path already carries it; sent otherwise it is ignored in favour of the path.
          schema:
            type: string
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                type: array
                description: Reports for the organisation from AdverseEventService.listForOrganisation, each mapped through toDomainFromPrisma (apps/backend/src/services/adverse-event.service.ts).
                items:
                  type: object
                  required:
                    - id
                    - appointmentId
                    - reporter
                    - patient
                    - companion
                    - product
                    - destinations
                    - consent
                    - status
                    - createdAt
                    - updatedAt
                  properties:
                    id:
                      type: string
                    organisationId:
                      type: string
                    appointmentId:
                      type: string
                      nullable: true
                    reporter:
                      type: object
                      properties:
                        userId:
                          type: string
                        type:
                          type: string
                          enum:
                            - PARENT
                            - CO_PARENT
                            - CLINIC_STAFF
                        firstName:
                          type: string
                        lastName:
                          type: string
                        phoneNumber:
                          type: string
                        email:
                          type: string
                        dateOfBirth:
                          type: string
                        addressLine:
                          type: string
                        city:
                          type: string
                        state:
                          type: string
                        postalCode:
                          type: string
                        country:
                          type: string
                        currency:
                          type: string
                      description: Persisted from the request's reporter object; stored as a Prisma Json column with no DB-level shape (see packages/types/src/adverse-event.ts AdverseEventReporterInfo for the application contract).
                    patient:
                      type: object
                      properties:
                        patientId:
                          type: string
                        companionId:
                          type: string
                        name:
                          type: string
                        breed:
                          type: string
                        dateOfBirth:
                          type: string
                        gender:
                          type: string
                        currentWeight:
                          type: string
                        color:
                          type: string
                        neuteredStatus:
                          type: string
                        bloodGroup:
                          type: string
                        microchipNumber:
                          type: string
                        passportNumber:
                          type: string
                        insured:
                          type: string
                        insuranceCompany:
                          type: string
                        insurancePolicyNumber:
                          type: string
                        countryOfOrigin:
                          type: string
                        originDetails:
                          type: string
                    companion:
                      type: object
                      description: AdverseEventReport has no companion DB column; toDomainFromPrisma always sets this to the same value as patient.
                      properties:
                        patientId:
                          type: string
                        companionId:
                          type: string
                        name:
                          type: string
                        breed:
                          type: string
                        dateOfBirth:
                          type: string
                        gender:
                          type: string
                        currentWeight:
                          type: string
                        color:
                          type: string
                        neuteredStatus:
                          type: string
                        bloodGroup:
                          type: string
                        microchipNumber:
                          type: string
                        passportNumber:
                          type: string
                        insured:
                          type: string
                        insuranceCompany:
                          type: string
                        insurancePolicyNumber:
                          type: string
                        countryOfOrigin:
                          type: string
                        originDetails:
                          type: string
                    product:
                      type: object
                      properties:
                        productName:
                          type: string
                        brandName:
                          type: string
                        manufacturingCountry:
                          type: string
                        batchNumber:
                          type: string
                        numberOfTimesUsed:
                          type: number
                        quantityUsed:
                          type: number
                        dosageForm:
                          type: string
                        administrationRoute:
                          type: string
                        reasonToUse:
                          type: string
                        conditionBefore:
                          type: string
                        conditionAfter:
                          type: string
                        eventDate:
                          type: string
                        productImageUrl:
                          type: string
                    destinations:
                      type: object
                      properties:
                        sendToManufacturer:
                          type: boolean
                        sendToHospital:
                          type: boolean
                        sendToAuthority:
                          type: boolean
                    consent:
                      type: object
                      properties:
                        agreedToContact:
                          type: boolean
                        agreedToTermsAt:
                          type: string
                          format: date-time
                    status:
                      type: string
                      enum:
                        - DRAFT
                        - SUBMITTED
                        - REVIEWING
                        - FORWARDED
                        - CLOSED
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
