  /fhir/v1/appointment/mobile:
    post:
      tags:
        - FHIR
      summary: POST /fhir/v1/appointment/mobile
      operationId: post_fhir_v1_appointment_mobile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
      responses:
        201:
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
                  message:
                    type: string
